<!doctype html>
<!-- 极简陈列馆 · 由 tools/build-gallery.mjs 依据 src/games.json 生成，请勿手改 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#f4efe7" />
<title>游戏陈列馆 · THE GALLERY</title>
<style>
  :root {
    --paper: #f4efe7;
    --paper-dim: #ece5d9;
    --ink: #29241d;
    --ink-soft: #57503f;
    --caption: #857a67;
    --rule: #d9cfbe;
    --accent: #8a6b3d;
    --serif: "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "SimSun", serif;
    --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  }
  * { box-sizing: border-box; min-width: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: clamp(15px, 1.05vw + 10px, 17px);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    width: min(100% - 2 * clamp(1.1rem, 4vw, 3.5rem), 62rem);
    margin-inline: auto;
    padding-inline: env(safe-area-inset-right) env(safe-area-inset-left);
  }

  /* ---------- 馆头 ---------- */
  header.museum { padding-top: clamp(1.4rem, 4vh, 3rem); }
  .museum-bar {
    display: flex; flex-wrap: wrap; gap: 0.6rem 1.2rem;
    align-items: baseline; justify-content: space-between;
    padding-bottom: 0.9rem; border-bottom: 1px solid var(--rule);
    font-size: 0.78rem; letter-spacing: 0.22em; color: var(--caption);
    text-transform: uppercase;
  }
  .museum-bar a { color: var(--accent); text-decoration: none; letter-spacing: 0.12em; }
  .museum-bar a:hover, .museum-bar a:focus-visible { text-decoration: underline; }
  h1.museum-title {
    margin: clamp(1.8rem, 6vh, 3.6rem) 0 0.4rem;
    font-family: var(--serif); font-weight: 400;
    font-size: clamp(2rem, 6vw, 3.4rem); letter-spacing: 0.06em;
  }
  .museum-intro {
    margin: 0 0 clamp(2.2rem, 7vh, 4.5rem); max-width: 36em;
    color: var(--ink-soft); font-size: 0.95em;
  }

  /* ---------- 展墙 ---------- */
  .wall { display: grid; gap: clamp(3.2rem, 9vh, 5.5rem); padding-bottom: clamp(3rem, 9vh, 5rem); }
  .exhibit { display: grid; justify-items: center; gap: clamp(0.9rem, 2.4vh, 1.4rem); scroll-margin-top: 5vh; }

  a.frame {
    display: block; width: min(100%, 54rem);
    background: #fbf8f2;
    padding: clamp(10px, 1.8vw, 20px);
    border: 1px solid var(--rule);
    box-shadow: 0 1px 2px rgba(60, 50, 35, 0.05), 0 18px 42px rgba(60, 50, 35, 0.10);
    text-decoration: none; outline: none;
    transition: transform 0.35s ease, box-shadow 0.35s ease;
    touch-action: manipulation;
  }
  a.frame img {
    display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover;
    background: var(--paper-dim);
    filter: saturate(0.68) sepia(0.10);
    transition: filter 0.45s ease;
  }
  @media (hover: hover) {
    a.frame:hover { transform: translateY(-3px); box-shadow: 0 2px 3px rgba(60,50,35,0.05), 0 26px 54px rgba(60,50,35,0.14); }
    a.frame:hover img { filter: none; }
  }
  a.frame:focus-visible { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 0 0 3px rgba(138,107,61,0.28), 0 26px 54px rgba(60,50,35,0.14); }
  a.frame:focus-visible img { filter: none; }

  /* 展品铭牌 */
  .label {
    width: min(100%, 21rem);
    border-top: 1px solid var(--rule);
    padding-top: 0.75rem;
    font-size: 0.86em; color: var(--ink-soft);
  }
  .label .no { font-size: 0.72rem; letter-spacing: 0.28em; color: var(--caption); }
  .label h2 {
    margin: 0.15rem 0 0; font-family: var(--serif); font-weight: 400;
    font-size: 1.35em; color: var(--ink);
    overflow-wrap: anywhere;
  }
  .label .en { margin: 0; font-size: 0.7rem; letter-spacing: 0.24em; color: var(--caption); text-transform: uppercase; }
  .label .medium { margin: 0.45rem 0 0; }
  .label .medium .dot { color: var(--accent); }
  .label .pitch { margin: 0.35rem 0 0; color: var(--caption); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .label .tags { margin: 0.4rem 0 0; font-size: 0.78em; color: var(--caption); }
  .notice {
    display: none; margin: 0.5rem 0 0; padding: 0.55rem 0.8rem;
    border: 1px solid var(--rule); background: var(--paper-dim);
    font-size: 0.8em; color: var(--ink-soft);
  }
  .exhibit[data-notice] .notice { display: block; }

  /* ---------- 馆尾 ---------- */
  footer.museum {
    border-top: 1px solid var(--rule);
    padding: 1.2rem 0 calc(1.6rem + env(safe-area-inset-bottom));
    display: flex; flex-wrap: wrap; gap: 0.4rem 1.4rem; align-items: baseline; justify-content: space-between;
    font-size: 0.78em; color: var(--caption);
  }
  footer.museum code { font-size: 0.95em; }
  #hint { letter-spacing: 0.06em; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
    a.frame img { filter: none; }
  }
</style>
</head>
<body>
  <header class="museum wrap">
    <div class="museum-bar">
      <span>The Gallery · 极简陈列馆</span>
    </div>
    <h1 class="museum-title">游戏陈列馆</h1>
    <p class="museum-intro">CYD 的常驻展。五件作品，白墙素框，不设主次——慢慢看。</p>
  </header>

  <main id="wall" class="wall wrap" aria-label="展品列表"></main>

  <footer class="museum wrap">
    <span>新增展品：运行 <code>node tools/sync-games.mjs</code>，登记 <code>src/games.json</code>，再跑 <code>node tools/build-gallery.mjs</code> 与 <code>node tools/build-express.mjs</code></span>
    <span id="hint"></span>
  </footer>

  <noscript><p class="wrap">本陈列馆需要启用 JavaScript 才能参观。</p></noscript>
<script>
const GAMES = [{"slug":"inn","title":"次元旅店","subtitle":"DIMENSIONAL INN","genre":"放置经营 · 抽卡","pitch":"经营一家连接万千世界的旅店：招募奇珍旅客、扩建房间、放置也有收益。","status":"开发中","tags":["放置","经营","抽卡"],"entry":"./games/inn/index.html","cover":"./covers/inn.jpg","needsServer":true,"updatedAt":"2026-07-23"},{"slug":"zero-day","title":"零日协议","subtitle":"ZERO-DAY PROTOCOL","genre":"卡牌 Roguelike","pitch":"扮演觉醒的流浪 AI「零日」，用程序卡牌攻破巨企主网层层 ICE，直抵核心窃取奇点密钥。","status":"可玩","tags":["卡牌","Roguelike","赛博朋克"],"entry":"./games/zero-day/index.html","cover":"./covers/zero-day.jpg","needsServer":false,"updatedAt":"2026-07-22"},{"slug":"embernight","title":"烛夜","subtitle":"EMBERNIGHT","genre":"动作 · 黑暗奇幻","pitch":"一根蜡烛照亮黑夜：十分钟一局的打击感动作小品，零外部素材、纯代码渲染与程序化音频。","status":"可玩","tags":["动作","单文件"],"entry":"./games/embernight/index.html","cover":"./covers/embernight.jpg","needsServer":false,"updatedAt":"2026-07-22"},{"slug":"dungeon","title":"地牢幸存者：巫妖深渊","subtitle":"DUNGEON SURVIVORS","genre":"幸存者类动作","pitch":"吸血鬼幸存者式实时动作：6 武器进化、8 种敌人与三阶段巫妖，在 10 分钟波次中活下来。","status":"可玩","tags":["动作","幸存者","Roguelite"],"entry":"./games/dungeon/index.html","cover":"./covers/dungeon.jpg","needsServer":true,"updatedAt":"2026-07-23"},{"slug":"spellforge","title":"Spellforge","subtitle":"咒锻工坊","genre":"合成休闲","pitch":"拖拽合成咒语与装备，打造属于你的法术工坊——已打包上架 itch.io 与 CrazyGames。","status":"可玩","tags":["合成","休闲"],"entry":"./games/spellforge/index.html","cover":"./covers/spellforge.jpg","needsServer":false,"updatedAt":"2026-07-21"}];
</script>
<script>
(function () {
  'use strict'
  var wall = document.getElementById('wall')
  var hint = document.getElementById('hint')
  var isFile = window.location.protocol === 'file:'
  var HINTS = {
    kbm: '←/→ 或 ↑/↓ 移步 · Enter 进展间 · / 回到顶部',
    touch: '轻点画框进展间',
    pad: '十字键移步 · Ⓐ 进展间 · Ⓑ 收起说明'
  }

  // ---- 渲染展品（按更新日期倒序，与旅店大厅一致） ----
  var games = GAMES.slice().sort(function (a, b) { return a.updatedAt < b.updatedAt ? 1 : -1 })
  games.forEach(function (g, i) {
    var no = ('0' + (i + 1)).slice(-2)
    var ex = document.createElement('article')
    ex.className = 'exhibit'
    ex.setAttribute('data-slug', g.slug)
    ex.innerHTML =
      '<a class="frame" href="' + g.entry + '" aria-label="' + g.title + '（' + g.genre + '，' + g.status + '）">' +
        '<img src="' + g.cover + '" alt="' + g.title + ' 展品画" loading="' + (i ? 'lazy' : 'eager') + '" decoding="async" />' +
      '</a>' +
      '<div class="label">' +
        '<span class="no">展品 ' + no + '</span>' +
        '<h2>' + g.title + '</h2>' +
        '<p class="en">' + g.subtitle + '</p>' +
        '<p class="medium">' + g.genre + ' <span class="dot">●</span> ' + g.status + ' · ' + g.updatedAt + '</p>' +
        '<p class="pitch">' + g.pitch + '</p>' +
        '<p class="tags">' + g.tags.map(function (t) { return '#' + t }).join('　') + '</p>' +
        (g.needsServer ? '<p class="notice" role="note">此展品需经本地服务或在线版进入：在门户目录运行 <code>npm run dev</code>，或使用部署后的网址。</p>' : '') +
      '</div>'
    wall.appendChild(ex)
  })

  // ---- file:// 下 needsServer 游戏：不跳转，展开铭牌说明 ----
  wall.addEventListener('click', function (e) {
    var a = e.target.closest('a.frame')
    if (!a) return
    var ex = a.parentElement
    var g = games.filter(function (x) { return x.slug === ex.getAttribute('data-slug') })[0]
    if (isFile && g && g.needsServer) {
      e.preventDefault()
      if (ex.hasAttribute('data-notice')) ex.removeAttribute('data-notice')
      else ex.setAttribute('data-notice', '')
    }
  })

  // ---- 键盘 / 手柄 移步 ----
  var frames = Array.prototype.slice.call(document.querySelectorAll('a.frame'))
  function cur() { return frames.indexOf(document.activeElement) }
  function focusAt(i) {
    var n = frames.length
    if (!n) return
    frames[((i % n) + n) % n].focus()
  }
  document.addEventListener('keydown', function (e) {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return
    setMode('kbm')
    var i = cur()
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); focusAt(i < 0 ? 0 : i + 1) }
    else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { e.preventDefault(); focusAt(i < 0 ? frames.length - 1 : i - 1) }
    else if (e.key === 'Escape') { document.querySelectorAll('[data-notice]').forEach(function (x) { x.removeAttribute('data-notice') }) }
  })
  document.addEventListener('pointerdown', function (e) { setMode(e.pointerType === 'touch' ? 'touch' : 'kbm') }, { passive: true })

  var padTimer = 0, padPrev = []
  function padLoop() {
    var pads = navigator.getGamepads ? navigator.getGamepads() : []
    var gp = null
    for (var k = 0; k < pads.length; k++) if (pads[k] && pads[k].connected) { gp = pads[k]; break }
    if (gp) {
      var ax = gp.axes[1] || 0
      var btn = function (n) { return gp.buttons[n] && gp.buttons[n].pressed }
      var pressed = {
        next: btn(15) || btn(13) || ax > 0.6,
        prev: btn(14) || btn(12) || ax < -0.6,
        ok: btn(0), back: btn(1)
      }
      var was = padPrev
      if (pressed.next && !was.next) focusAt(cur() + 1)
      if (pressed.prev && !was.prev) focusAt(cur() < 0 ? frames.length - 1 : cur() - 1)
      if (pressed.ok && !was.ok && document.activeElement && document.activeElement.classList.contains('frame')) document.activeElement.click()
      if (pressed.back && !was.back) document.querySelectorAll('[data-notice]').forEach(function (x) { x.removeAttribute('data-notice') })
      padPrev = pressed
    }
    padTimer = requestAnimationFrame(padLoop)
  }
  window.addEventListener('gamepadconnected', function () { setMode('pad') })
  padLoop()

  function setMode(m) { hint.textContent = HINTS[m] || HINTS.kbm }
  setMode('kbm')
})()
</script>
</body>
</html>
