.sc-gmenu-stamp { margin-top: clamp(6px, 1vw, 10px); }
/* 触屏：可点目标 ≥42px（§2-6） */
@media (pointer: coarse) {
  .sc-gmenu-btn { min-width: 42px; min-height: 42px; }
  .sc-gmenu-item { min-height: 42px; }
}
/* ============ 局内子屏菜单按钮挂载（奖励/商店/休息/事件/宝箱接线微调） ============ */
/* 奖励/休息/宝箱（sc-center 居中壳）：壳转 relative，齿轮绝对定位浮挂右上角，
   居中标题行保持原位不被顶偏；top 对齐 .sc-shell 上 padding 令牌 */
.sc-gmenu-shell { position: relative; }
.sc-gmenu-float { position: absolute; top: clamp(10px, 1.5vw, 16px); right: 0; }
/* 商店（块级壳）：screenHead 天然整行，齿轮 margin-left:auto 推至右端 */
.sc-gmenu-head-btn { margin-left: auto; }
/* 事件（无标题行）：面板内顶行，事件图标居左、齿轮居右 */
.sc-gmenu-event-top { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--gap); }

/* ============ 进阶系统（ASCEND.md §4，批 2 UI） ============ */
/* —— 二级选级条：0..已解锁可选、未解锁置灰；尺寸只用 §3 令牌/clamp —— */
.sc-ascend-hidden { display: none !important; }
.sc-ascend-panel {
  display: flex; flex-direction: column; align-items: center;
  gap: clamp(10px, 1.8vw, 16px); max-width: 100%;
}
.sc-ascend-title { font-size: var(--fs-lg); letter-spacing: .08em; }
.sc-ascend-loading { font-size: var(--fs-sm); }
.sc-ascend-list {
  display: flex; flex-direction: column; gap: var(--gap);
  width: min(560px, 94vw);
}
.sc-ascend-item {
  display: flex; flex-direction: column; gap: clamp(2px, .5vw, 4px);
  text-align: left; font-family: var(--font); font-size: var(--fs-md); color: var(--ink);
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: clamp(8px, 1.4vw, 12px) clamp(12px, 2vw, 16px); cursor: pointer;
  touch-action: manipulation;
  transition: border-color .15s, transform .15s, box-shadow .15s;
}
@media (hover:hover) and (pointer:fine) {
  .sc-ascend-item:hover:not(:disabled) {
    border-color: var(--amber); transform: translateY(-2px);
    box-shadow: 0 4px 14px rgba(0, 0, 0, .3);
  }
}
.sc-ascend-item:disabled { cursor: not-allowed; }
.sc-ascend-item--lock { opacity: .42; }
.sc-ascend-lv {
  display: flex; justify-content: space-between; align-items: baseline;
  gap: var(--gap); letter-spacing: .06em;
}
.sc-ascend-name { color: var(--amber); }
.sc-ascend-item--lock .sc-ascend-name { color: var(--dim); }
.sc-ascend-tag { font-size: var(--fs-xs); color: var(--dim); flex: none; }
.sc-ascend-desc { font-size: var(--fs-sm); color: var(--dim); line-height: 1.6; }
.sc-ascend-back { margin-top: clamp(2px, .6vw, 6px); }
/* 触屏：选级条目可点目标 ≥42px（§2-6 同款纪律） */
@media (pointer: coarse) {
  .sc-ascend-item { min-height: clamp(42px, 6vw, 46px); justify-content: center; }
}

/* —— 局内「进阶 N」chip（地图顶栏/战斗标题区共用基类）：
   恒渲染，0 级 visibility:hidden 预留——出现/消失布局零位移（占位纪律，D-010 同款） —— */
.sc-ascend-chip {
  display: inline-flex; align-items: center; flex: none;
  font-size: var(--fs-xs); letter-spacing: .08em; white-space: nowrap;
  color: var(--amber); border: 1px solid var(--amber); border-radius: 2em;
  padding: 1px clamp(6px, 1vw, 10px);
}
.sc-ascend-chip--off { visibility: hidden; }

/* —— 结算屏「进阶 N 通关」徽记：sc-unlock-chip 琥珀变体 —— */
.sc-ascend-badge {
  color: var(--amber); border-color: var(--amber); font-weight: 700;
  box-shadow: 0 0 8px rgba(221, 176, 105, .18);
}

/* ==== styles/fx.css ==== */
/* 《零日协议》动效样式（.fx-* 命名空间，美术音效工程师所有）
   颜色只用 styles/main.css 的 CSS 变量；透明度经 color-mix 派生，不引入新色相。 */

/* —— 内联 SVG 图标基础尺寸（icons.js 输出默认携带此类） —— */
.fx-icon {
  width: 1.05em;
  height: 1.05em;
  vertical-align: -0.18em;
  flex: none;
}

/* —— 飘字 —— */
.fx-float {
  position: absolute;
  left: 50%;
  top: 34%;
  z-index: 60;
  transform: translate(-50%, 0);
  pointer-events: none;
  font-weight: 700;
  font-size: var(--fs-lg);
  letter-spacing: 0.06em;
  color: var(--ink);
  text-shadow: 0 0 8px var(--bg);
  animation: fxFloatUp 0.9s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
}
.fx-t-dmg { color: var(--red); }
.fx-t-block { color: var(--cyan); }
.fx-t-heal { color: var(--phos); }
.fx-t-status { color: var(--amber); }
.fx-t-gold { color: var(--amber); }
.fx-t-miss { color: var(--dim); }
@keyframes fxFloatUp {
  0% { opacity: 0; transform: translate(calc(-50% + var(--fx-drift, 0px)), 6px) scale(0.7); }
  18% { opacity: 1; transform: translate(calc(-50% + var(--fx-drift, 0px)), -4px) scale(1.08); }
  100% { opacity: 0; transform: translate(calc(-50% + var(--fx-drift, 0px)), -58px) scale(0.94); }
}

/* —— 震动（--fx-amp 由 anim.shake 注入） —— */
.fx-shake { animation: fxShake 0.4s linear; }
@keyframes fxShake {
  0%, 100% { transform: translate(0, 0); }
  15% { transform: translate(calc(var(--fx-amp, 5px) * -1), 1px); }
  30% { transform: translate(var(--fx-amp, 5px), -1px); }
  45% { transform: translate(calc(var(--fx-amp, 5px) * -0.6), 1px); }
  60% { transform: translate(calc(var(--fx-amp, 5px) * 0.6), 0); }
  75% { transform: translate(calc(var(--fx-amp, 5px) * -0.3), 1px); }
}

/* —— 闪烁高亮 —— */
.fx-flash { animation: fxFlash 0.35s ease-out; }
.fx-flash--red { animation: fxFlashRed 0.35s ease-out; }
.fx-flash--phos { animation: fxFlashPhos 0.35s ease-out; }
@keyframes fxFlash {
  0% { filter: brightness(2.2); }
  100% { filter: brightness(1); }
}
@keyframes fxFlashRed {
  0% { filter: brightness(2.4) drop-shadow(0 0 6px var(--red)); }
  100% { filter: none; }
}
@keyframes fxFlashPhos {
  0% { filter: brightness(2.4) drop-shadow(0 0 6px var(--phos)); }
  100% { filter: none; }
}

/* —— 卡牌飞行幻影（anim.flyCard，定位与位移由 WAAPI 内联驱动） —— */
.fx-fly {
  position: fixed;
  z-index: 90;
  font-size: var(--card-w);   /* 尺寸相对当前卡宽（§6 fx） */
  width: .124em;              /* ≈ 原 22px / 卡宽 178px */
  height: .169em;             /* ≈ 原 30px / 卡宽 178px */
  border: 1px solid var(--phos);
  border-radius: 3px;
  background: var(--panel2);
  box-shadow: 0 0 12px color-mix(in srgb, var(--phos) 35%, transparent);
  pointer-events: none;
  transform: translate(-50%, -50%);
}

/* —— 粒子爆发（anim.burst，--fx-dx/--fx-dy 逐粒子注入） —— */
.fx-burst {
  position: fixed;
  z-index: 90;
  width: 0;
  height: 0;
  pointer-events: none;
}
.fx-particle {
  position: absolute;
  left: 0;
  top: 0;
  width: .3em;              /* 相对正文流体字号（原 4px ≈ .3em @ --fs-md） */
  height: .3em;
  border-radius: 1px;
  background: var(--phos);
  animation: fxParticle 0.55s cubic-bezier(0.15, 0.6, 0.3, 1) forwards;
}
@keyframes fxParticle {
  0% { opacity: 1; transform: translate(0, 0) scale(1); }
  100% { opacity: 0; transform: translate(var(--fx-dx, 20px), var(--fx-dy, 20px)) scale(0.3); }
}

/* —— RGB 错位故障（anim.glitch） —— */
.fx-glitch {
  animation: fxGlitch 0.45s steps(2, jump-none) both;
  text-shadow: -2px 0 var(--red), 2px 0 var(--cyan);
}
@keyframes fxGlitch {
  0% { clip-path: inset(0 0 0 0); transform: translate(0, 0); }
  15% { clip-path: inset(12% 0 58% 0); transform: translate(-3px, 1px); }
  30% { clip-path: inset(55% 0 8% 0); transform: translate(3px, -1px); }
  45% { clip-path: inset(28% 0 30% 0); transform: translate(-2px, 0); }
  60% { clip-path: inset(70% 0 5% 0); transform: translate(2px, 1px); }
  80% { clip-path: inset(8% 0 72% 0); transform: translate(-1px, -1px); }
  100% { clip-path: inset(0 0 0 0); transform: translate(0, 0); }
}

/* —— 发牌入场（anim.dealIn，错峰由 animation-delay 内联注入） —— */
.fx-deal-in { animation: fxDealIn 0.45s cubic-bezier(0.2, 0.8, 0.3, 1.05) both; }
@keyframes fxDealIn {
  0% { opacity: 0; transform: translate(-48px, 40px) rotate(-4deg) scale(0.6); }
  60% { opacity: 1; }
  100% { opacity: 1; transform: translate(0, 0) rotate(0) scale(1); }
}

/* ══════════════════════════════════════════════════════════════════
   COMBAT2.md §5 战斗演出（投射/消散/屏边闪光/横幅/顿帧/连击/大数字档）
   ══════════════════════════════════════════════════════════════════ */

/* —— 投射光点（anim.projectile；轨迹 WAAPI 内联驱动，--fx-fly-c 注入颜色） —— */
.fx-fly-ghost {
  position: fixed;
  z-index: 95;
  width: .5em;                /* 相对正文流体字号（约 7px @ --fs-md） */
  height: .5em;
  border-radius: 50%;
  background: var(--fx-fly-c, var(--phos));
  box-shadow:
    0 0 8px var(--fx-fly-c, var(--phos)),
    0 0 16px color-mix(in srgb, var(--fx-fly-c, var(--phos)) 45%, transparent);
  pointer-events: none;
}

/* —— 屏边闪光（anim.vignette；径向渐变四边内阴影淡入淡出，--fx-ms 注入时长） —— */
.fx-vig {
  position: fixed;
  inset: 0;
  z-index: 80;
  pointer-events: none;
  opacity: 0;
  background: radial-gradient(118% 118% at 50% 50%, transparent 56%, var(--fx-vig-c, var(--red)) 100%);
  animation: fxVig var(--fx-ms, .32s) ease-out forwards;
}
.fx-vig--hit { --fx-vig-c: color-mix(in srgb, var(--red) 52%, transparent); }
.fx-vig--heat { --fx-vig-c: color-mix(in srgb, var(--amber) 50%, transparent); }
.fx-vig--win { --fx-vig-c: color-mix(in srgb, var(--phos) 50%, transparent); }
@keyframes fxVig {
  0% { opacity: 0; }
  22% { opacity: 1; }
  100% { opacity: 0; }
}

/* —— 回合横幅（anim.banner；挂 .cb-banner-host 时绝对居中，--vp 为 body 兜底 fixed） —— */
.fx-banner {
  position: absolute;
  left: 50%;
  top: 42%;
  z-index: 70;
  transform: translate(-50%, -50%);
  pointer-events: none;
  font-size: var(--fs-xl);
  font-weight: 700;
  letter-spacing: .12em;
  white-space: nowrap;
  color: var(--phos);
  text-shadow:
    0 0 12px color-mix(in srgb, var(--phos) 45%, transparent),
    0 0 2px var(--bg);
  animation: fxBanner var(--fx-ms, .85s) cubic-bezier(.2, .7, .3, 1) forwards;
}
.fx-banner--vp { position: fixed; }
.fx-banner--enemy {
  color: var(--red);
  text-shadow:
    0 0 12px color-mix(in srgb, var(--red) 45%, transparent),
    0 0 2px var(--bg);
}
@keyframes fxBanner {
  0% { opacity: 0; transform: translate(calc(-50% - 26px), -50%) scale(.92); }
  14% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  78% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(calc(-50% + 14px), -50%) scale(.98); }
}

/* —— 顿帧（anim.hitstop：子树动画全部暂停） —— */
.fx-stop,
.fx-stop *,
.fx-stop *::before,
.fx-stop *::after { animation-play-state: paused !important; }

/* —— 像素块消散（anim.dissolve；clip-path 阶梯 + 透明度 + 轻微位移，forwards 保持终态） —— */
.fx-dissolve { animation: fxDissolve var(--fx-ms, .52s) steps(5, jump-none) forwards; }
@keyframes fxDissolve {
  0% { opacity: 1; clip-path: inset(0 0 0 0); transform: translate(0, 0); filter: none; }
  22% { opacity: .9; clip-path: inset(12% 0 58% 0); transform: translate(-2px, 1px); }
  45% { opacity: .68; clip-path: inset(48% 0 18% 0); transform: translate(2px, -1px); }
  68% { opacity: .4; clip-path: inset(20% 0 52% 0); transform: translate(-1px, 0); filter: brightness(1.5); }
  86% { opacity: .16; clip-path: inset(62% 0 6% 0); transform: translate(1px, 1px); }
  100% { opacity: 0; clip-path: inset(0 0 96% 0); transform: translate(0, 2px); }
}

/* —— 连击弹跳（anim.comboPop） —— */
.fx-combo-pop { animation: fxComboPop .3s cubic-bezier(.2, .8, .3, 1.4); }
@keyframes fxComboPop {
  0% { transform: scale(1); }
  40% { transform: scale(1.35); }
  100% { transform: scale(1); }
}

/* —— 飘字大数字档（§4.5：≥12 --big / ≥20 --crit；字号基于 --fs-lg 令牌倍率） —— */
.fx-t-dmg--big {
  font-size: calc(var(--fs-lg) * 1.35);
  color: color-mix(in srgb, var(--red) 62%, var(--ink));
  text-shadow:
    0 0 2px var(--bg),
    0 0 12px color-mix(in srgb, var(--red) 50%, transparent);
}
.fx-t-dmg--crit {
  font-size: calc(var(--fs-lg) * 1.7);
  color: var(--amber);
  text-shadow:
    1px 0 0 var(--bg), -1px 0 0 var(--bg),
    0 1px 0 var(--bg), 0 -1px 0 var(--bg),
    0 0 14px color-mix(in srgb, var(--amber) 55%, transparent);
}

/* —— MONOTONY ① 大数字 roll-up 内层（anim.floatText opts.roll 创建；数字滚动由 rAF 驱动 textContent） —— */
.fx-roll { display: inline-block; }

/* 长按放大检视卡（风味文本两全方案：悬停 tooltip / 触屏长按放大） */
.fx-magnify {
  position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%);
  z-index: 9600;
  --card-w: clamp(168px, 58vw, 220px);
  filter: drop-shadow(0 10px 28px rgba(0, 0, 0, .55));
  animation: fxMagnifyIn .16s ease-out;
}
@keyframes fxMagnifyIn { from { opacity: 0; transform: translate(-50%, -46%) scale(.85); } }

/* —— 减弱动态偏好：一律压到近瞬发，尊重系统设置 —— */
@media (prefers-reduced-motion: reduce) {
  .fx-float,
  .fx-shake,
  .fx-flash,
  .fx-flash--red,
  .fx-flash--phos,
  .fx-particle,
  .fx-glitch,
  .fx-deal-in,
  .fx-vig,
  .fx-banner,
  .fx-dissolve,
  .fx-combo-pop { animation-duration: 0.01s; }
}
/* —— 设置页「减弱动画」开关（EXPAND.md §4）：body.rm 与系统偏好同策略，重动画近瞬发 —— */
body.rm .fx-float,
body.rm .fx-shake,
body.rm .fx-flash,
body.rm .fx-flash--red,
body.rm .fx-flash--phos,
body.rm .fx-particle,
body.rm .fx-glitch,
body.rm .fx-deal-in,
body.rm .fx-vig,
body.rm .fx-banner,
body.rm .fx-dissolve,
body.rm .fx-combo-pop { animation-duration: 0.01s; }

/* ==== styles/narrative.css ==== */
/* 《零日协议》叙事与引导层样式（叙事界面工程师所有，.nv-* 命名空间）
   铁律：颜色只用 main.css 变量；尺寸/字号只用 RESPONSIVE.md §3 令牌与 clamp/em；
   写死 px 仅限 1-2px 边框与阴影；6 视口矩阵无横滚无截断，手机端全纵排。 */

/* ==================== 序幕：全屏终端窗口 ==================== */
.nv-term {
  display: flex; flex-direction: column;
  height: calc(100vh - 2 * var(--shell-pad)); /* 定高外壳：底栏恒可见，正文内部滚动 */
  height: calc(100dvh - 2 * var(--shell-pad)); /* 定高外壳：底栏恒可见，正文内部滚动 */
  background: var(--panel);
  border: 1px solid var(--phos);
  border-radius: 8px;
  box-shadow: 0 0 22px rgba(143, 211, 160, .14), inset 0 0 48px rgba(143, 211, 160, .05);
  overflow: hidden;
}
.nv-term-bar {
  display: flex; align-items: center; gap: var(--gap);
  padding: .55em .9em;
  background: var(--panel2);
  border-bottom: 1px solid var(--line);
}
.nv-term-dots { display: inline-flex; gap: .45em; flex: none; }
.nv-term-dots i { width: .68em; height: .68em; border-radius: 50%; background: var(--line); }
.nv-term-dots i:first-child { background: var(--red); }
.nv-term-dots i:nth-child(2) { background: var(--amber); }
.nv-term-dots i:last-child { background: var(--phos); }
.nv-term-bar-t {
  flex: 1; min-width: 0;
  color: var(--dim); font-size: var(--fs-sm); letter-spacing: .12em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.nv-skip { flex: none; }
.nv-term-body {
  flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  padding: clamp(14px, 3.5vw, 36px);
  font-size: var(--fs-lg);
}
.nv-term-title {
  min-height: 1.3em; margin-bottom: .55em;
  color: var(--phos); font-size: var(--fs-xl); letter-spacing: .06em;
}
.nv-term-line { min-height: 1.55em; color: var(--ink); }
.nv-caret {
  display: inline-block; width: .58em; height: 1.05em;
  margin-left: .1em; vertical-align: -.15em;
  background: var(--phos);
  animation: nv-blink 1.05s steps(1) infinite;
}
@keyframes nv-blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
.nv-term-foot {
  display: flex; align-items: center; gap: var(--gap);
  padding: .65em .9em;
  background: var(--panel2);
  border-top: 1px solid var(--line);
}
.nv-term-hint { flex: 1; min-width: 0; color: var(--dim); font-size: var(--fs-sm); }
.nv-term-page { flex: none; color: var(--dim); font-size: var(--fs-sm); letter-spacing: .12em; }
.nv-next { flex: none; }

/* ==================== 章节引入：单屏章节卡 ==================== */
.nv-act {
  position: relative;
  min-height: calc(100vh - 2 * var(--shell-pad));
  min-height: calc(100dvh - 2 * var(--shell-pad));
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  cursor: pointer;
}
.nv-act-no {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: clamp(110px, 30vw, 380px);
  font-weight: 800; letter-spacing: .04em; white-space: nowrap;
  color: var(--line); opacity: .5;
  pointer-events: none; user-select: none;
}
.nv-act-inner {
  position: relative;
  max-width: 44em;
  padding: var(--shell-pad);
  text-align: center;
}
.nv-act-kicker {
  color: var(--amber); font-size: var(--fs-sm);
  letter-spacing: .42em; text-indent: .42em; /* 补偿末字间距，视觉居中 */
  margin-bottom: 1em;
}
.nv-act-title {
  color: var(--phos); font-size: var(--fs-title);
  line-height: 1.2; margin-bottom: .5em;
  text-shadow: 0 0 18px rgba(143, 211, 160, .3);
}
.nv-act-body { color: var(--ink); font-size: var(--fs-lg); }
.nv-act-body p { margin: .4em 0; }
.nv-act-next { margin-top: 1.6em; }

/* ==================== Boss 威胁档案 ==================== */
.nv-brief {
  display: flex; flex-direction: column;
  height: calc(100vh - 2 * var(--shell-pad)); /* 定高外壳：底栏恒可见，正文内部滚动 */
  height: calc(100dvh - 2 * var(--shell-pad)); /* 定高外壳：底栏恒可见，正文内部滚动 */
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
}
.nv-brief-bar {
  display: flex; align-items: center; justify-content: space-between; gap: var(--gap);
  padding: .7em 1em;
  background: var(--panel2);
  border-bottom: 1px solid var(--line);
}

  color: var(--red); font-size: var(--fs-sm); letter-spacing: .18em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.nv-stamp {
  flex: none;
  border: 2px solid var(--red); border-radius: 4px;
  color: var(--red); font-size: var(--fs-xs); letter-spacing: .18em;
  padding: .15em .6em;
  transform: rotate(4deg);
  white-space: nowrap;
  box-shadow: 0 0 12px rgba(212, 117, 106, .25);
}
.nv-brief-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: clamp(14px, 3.5vw, 34px); }
.nv-brief-head {
  display: flex; align-items: flex-start; gap: var(--gap); flex-wrap: wrap;
  margin-bottom: .4em;
}
.nv-brief-ic {
  flex: none; display: grid; place-items: center;
  padding: .5em;
  color: var(--red);
  background: var(--panel2);
  border: 1px solid var(--red); border-radius: 8px;
  box-shadow: 0 0 16px rgba(212, 117, 106, .18);
}
.nv-boss-ic { width: clamp(44px, 8vw, 76px); height: clamp(44px, 8vw, 76px); }
.nv-brief-idbox { flex: 1; min-width: min(100%, 15em); }
.nv-brief-name { color: var(--ink); font-size: var(--fs-xl); line-height: 1.25; }
.nv-brief-epithet { color: var(--amber); font-size: var(--fs-lg); margin-top: .15em; }
.nv-brief-chips { display: flex; flex-wrap: wrap; gap: .5em; margin-top: .6em; }
.nv-chip {
  border: 1px solid var(--line); border-radius: 999px;
  color: var(--dim); font-size: var(--fs-xs);
  padding: .2em .8em; white-space: nowrap;
}
.nv-chip--red { border-color: var(--red); color: var(--red); }
.nv-brief-sec-t {
  margin: 1.2em 0 .5em; padding-bottom: .3em;
  color: var(--dim); font-size: var(--fs-sm); letter-spacing: .2em;
  border-bottom: 1px dashed var(--line);
}
.nv-brief-text p { margin: .45em 0; font-size: var(--fs-lg); }
.nv-brief-mech {
  margin: 0; padding: 0; list-style: none;

  display: grid; gap: .5em;
}
.nv-brief-mech li {
  counter-increment: nv-mech;
  position: relative;
  padding: .55em .8em .55em 3em;
  background: var(--panel2);
  border: 1px solid var(--line); border-radius: 6px;
  font-size: var(--fs-md);
}
.nv-brief-mech li::before {
  content: counter(nv-mech, decimal-leading-zero);
  position: absolute; left: .8em; top: .55em;
  color: var(--red); font-size: var(--fs-sm); letter-spacing: .05em;
}
.nv-brief-foot {
  display: flex; align-items: center; gap: var(--gap); flex-wrap: wrap;
  padding: .75em 1em;
  background: var(--panel2);
  border-top: 1px solid var(--line);
}
.nv-brief-hint { flex: 1; min-width: 0; color: var(--dim); font-size: var(--fs-sm); }
.nv-brief-go { flex: none; font-size: var(--fs-lg); }

/* ==================== 档案库：数据库终端 ==================== */
.nv-codex {
  display: flex; flex-direction: column; gap: var(--gap);
  min-height: calc(100vh - 2 * var(--shell-pad));
  min-height: calc(100dvh - 2 * var(--shell-pad));
}
.nv-codex-head {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: var(--gap); flex-wrap: wrap;
}
.nv-codex-title { color: var(--phos); font-size: var(--fs-xl); letter-spacing: .08em; }
.nv-codex-sub { color: var(--dim); font-size: var(--fs-sm); margin-top: .2em; }
.nv-codex-actions { display: flex; gap: var(--gap); flex-wrap: wrap; }
.nv-codex-tabs { display: flex; gap: .5em; flex-wrap: wrap; }
.nv-codex-tab {
  font-family: var(--font); font-size: var(--fs-md); cursor: pointer;
  color: var(--dim); background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px;
  padding: .4em 1.1em; letter-spacing: .1em;
  touch-action: manipulation;
  transition: border-color .15s, color .15s, box-shadow .15s;
}
@media (hover:hover) and (pointer:fine) {
  .nv-codex-tab:hover { border-color: var(--phos); color: var(--phos); }
}
.nv-codex-tab--on {
  color: var(--phos); border-color: var(--phos);
  box-shadow: 0 0 10px rgba(143, 211, 160, .12);
}
.nv-codex-main {
  flex: 1; min-height: 0;
  display: flex; gap: var(--gap);
  height: min(66vh, 700px);
  height: min(66dvh, 700px);
}
.nv-codex-list {
  flex: none; width: clamp(190px, 24vw, 270px);
  overflow-y: auto; overscroll-behavior: contain;
  display: flex; flex-direction: column; gap: .2em;
  padding: .4em;
  background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px;
}
.nv-codex-item {
  font-family: var(--font); text-align: left; cursor: pointer;
  display: flex; flex-direction: column; gap: .1em;
  padding: .5em .7em;
  color: var(--ink); background: transparent;
  border: none; border-left: 2px solid transparent; border-radius: 4px;
  touch-action: manipulation;
}
@media (hover:hover) and (pointer:fine) {
  .nv-codex-item:hover { background: var(--panel2); }
}
.nv-codex-item--on { background: var(--panel2); border-left-color: var(--phos); }
.nv-codex-item-t { font-size: var(--fs-md); }
.nv-codex-item-c { color: var(--dim); font-size: var(--fs-xs); }
.nv-codex-read {
  flex: 1; min-width: 0; overflow-y: auto; overscroll-behavior: contain;
  padding: clamp(14px, 3vw, 30px);
  background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px;
}
.nv-codex-read-cat { color: var(--amber); font-size: var(--fs-xs); letter-spacing: .25em; }
.nv-codex-read-t { color: var(--phos); font-size: var(--fs-xl); margin: .3em 0 .6em; }
.nv-codex-read-body p { margin: .5em 0; font-size: var(--fs-lg); }
.nv-codex-empty { color: var(--dim); font-size: var(--fs-md); padding: 1em; }

/* ==================== 玩法指南：分页手册 ==================== */
.nv-guide {
  display: flex; flex-direction: column; gap: var(--gap);
  height: calc(100vh - 2 * var(--shell-pad)); /* 定高外壳：翻页栏恒可见，正文内部滚动 */

}

  display: flex; align-items: flex-end; justify-content: space-between;

}

.nv-guide-sub { color: var(--dim); font-size: var(--fs-sm); margin-top: .2em; }

}

.nv-guide-body { font-size: var(--fs-lg); }

.nv-guide-nav {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--gap); flex-wrap: wrap;
}
.nv-guide-mid {
  display: flex; align-items: center; justify-content: center;
  gap: .8em; flex-wrap: wrap;
}
.nv-guide-dots { display: flex; gap: .3em; flex-wrap: wrap; justify-content: center; }
.nv-guide-dot {
  display: grid; place-items: center;
  padding: .4em;
  background: transparent; border: none; cursor: pointer;
  touch-action: manipulation;
}
.nv-guide-dot i { width: .62em; height: .62em; border-radius: 50%; background: var(--line); }
.nv-guide-dot--on i { background: var(--phos); box-shadow: 0 0 8px rgba(143, 211, 160, .4); }
.nv-guide-page { color: var(--dim); font-size: var(--fs-sm); letter-spacing: .1em; }

/* ==================== 词汇表（modal 内容） ==================== */

.nv-tip-body p { margin: .25em 0; color: var(--ink); font-size: var(--fs-md); }

  .nv-tip {

}

}
