<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0f0d" />
  <title>零日协议 ZERO-DAY PROTOCOL</title>
  <style>
/* ==== styles/main.css ==== */
/* 设计令牌 + 应用外壳（Orchestrator 所有，其他人只读） */
:root {
  --bg: #0c0f0d;
  --panel: #141a16;
  --panel2: #1a211c;
  --ink: #d9ded4;
  --dim: #8b958a;
  --phos: #8fd3a0;
  --amber: #ddb069;
  --red: #d4756a;
  --cyan: #7fc4bd;
  --line: #2a332c;
  --font: "Cascadia Code", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Microsoft YaHei", monospace;

  /* —— 响应式令牌（RESPONSIVE.md §3，全项目唯一尺寸来源） —— */
  --fs-xs: clamp(10px, .7vw + 7px, 11.5px);
  --fs-sm: clamp(11px, .8vw + 8px, 12.5px);
  --fs-md: clamp(12.5px, .9vw + 8.5px, 14px);
  --fs-lg: clamp(14px, 1.2vw + 10px, 17px);
  --fs-xl: clamp(20px, 2.6vw + 14px, 34px);
  --fs-title: clamp(30px, 6vw + 12px, 58px);
  --card-w: clamp(132px, 13.5vw, 178px);
  --card-h: calc(var(--card-w) * 1.325);
  --card-cw: clamp(108px, 11vw, 142px);            /* compact 卡 */
  --enemy-w: clamp(118px, 12vw, 152px);
  --shell-max: 1180px;
  --shell-pad: clamp(10px, 2vw, 20px);
  --gap: clamp(8px, 1.2vw, 14px);
}
/* 宽屏档（§3 / §2-7）：≥1600px 时内容宽度与字号同步放大 */
@media (min-width: 1600px) { :root { --shell-max: 1440px; } }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; overflow-x: clip; overscroll-behavior-y: none; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: var(--fs-md);
  line-height: 1.55;
}
#app { min-height: 100vh; }
#app { min-height: 100dvh; }
.app-shell { width: 100%; max-width: var(--shell-max); margin: 0 auto; padding: var(--shell-pad); padding-bottom: calc(var(--shell-pad) + env(safe-area-inset-bottom, 0px)); }

/* CRT 扫描线覆层 */
.app-crt {
  pointer-events: none;
  position: fixed; inset: 0; z-index: 9999;
  mix-blend-mode: overlay; opacity: .55;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px);
}
/* 设置页 CRT 滤镜开关：body.no-crt 时隐藏扫描线覆层（EXPAND.md §4） */
body.no-crt .app-crt { display: none; }

/* 通用构件 */
.app-panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.app-btn {
  font-family: var(--font); font-size: var(--fs-md);
  background: var(--panel2); color: var(--ink);
  border: 1px solid var(--line); border-radius: 6px;
  padding: .55em 1.25em; cursor: pointer; letter-spacing: .05em;
  touch-action: manipulation;
  transition: border-color .15s, color .15s, box-shadow .15s;
}
/* 触屏可点目标 ≥ 42px（§2-6） */
@media (pointer: coarse) { .app-btn { min-height: 42px; } }
/* hover 仅对精确指针（鼠标/触控板）生效，避免触屏轻点残留 hover 态 */
@media (hover:hover) and (pointer:fine) {
  .app-btn:hover:not(:disabled) { border-color: var(--phos); color: var(--phos); box-shadow: 0 0 10px rgba(143, 211, 160, .15); }
  .app-btn--danger:hover:not(:disabled) { border-color: var(--red); color: var(--red); }
}
.app-btn:disabled { opacity: .4; cursor: not-allowed; }
.app-btn--primary { border-color: var(--phos); color: var(--phos); }
.app-dim { color: var(--dim); }
.app-phos { color: var(--phos); }
.app-amber { color: var(--amber); }
.app-red { color: var(--red); }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }
::-webkit-scrollbar-track { background: transparent; }

/* ==== styles/combat.css ==== */
/* 《零日协议 ZERO-DAY PROTOCOL》战斗界面样式（COMBAT2.md 全量重设计）
   所有权：战斗视觉设计师（COMBAT2.md §1）
   命名空间：.cb-*（契约 §0）；类名严格对齐 COMBAT2.md §2 骨架（与交互师的接缝）
   颜色只用 styles/main.css 的设计变量；字号/尺寸只用 RESPONSIVE.md §3 令牌或 clamp 表达式
   （写死 px 仅限 1-2px 边框/阴影，以及规范明文指定的位移值） */

/* §5.2：手牌卡宽唯一来源是 --card-w，这里只在 .cb-shell 作用域覆盖变量，绝不写 .sc-card 尺寸；
   §7.2/§7.3：--avatar（玩家灵像）与 --enemy-w（敌人卡）同为战斗屏局部令牌，媒体查询只改变量 */
/* 一屏预算：shell 高度 = 视口高 − 外壳上下 padding − 底部安全区（#app.app-shell 已承担这三项），
   flex 列分配——头/底排/日志 flex:none（内容定高），舞台 flex:1 1 auto 吃剩余空间。
   窗口越高战场越大；窗口越矮舞台让位，整屏恒不溢出（舞台内容各档已按预算紧凑化） */
/* 一屏预算：shell 高度 = 视口高 − 外壳上下 padding − 底部安全区（#app.app-shell 已承担这三项），
   flex 列分配——头/底排/日志 flex:none（内容定高），舞台 flex:1 1 auto 吃剩余空间。
   height:auto + min-height 双保险：内容紧凑时恰一屏；极端矮窗内容超预算时整页可滚（优雅降级），
   任何情况下元素本体永不被削（舞台溢出可见性由 overflow:visible 保证） */
.cb-shell {
  --card-w: clamp(104px, 15vw, 158px);
  /* D-011：基准卡宽的壳层冻结副本——桌面端计数感知收缩只覆写卡槽上的 --card-w，
     收缩 clamp 上限须引用「未收缩」的当档基准值
     （自定义属性按元素各自计算后继承：壳层取值不受后代卡槽覆写影响，媒体查询改 --card-w 时自动跟随）。
     卡高无需冻结副本：--card-h 在 main.css :root 以 :root 的 --card-w 代入计算后即冻结，
     本就免疫战斗屏各作用域的 --card-w 覆写（收缩只把卡做窄，卡高/行高纹丝不动） */
  --card-w-base: var(--card-w);
  --enemy-w: clamp(150px, 16vw, 210px);
  --avatar: clamp(110px, 14vw, 160px);
  display: flex;
  flex-direction: column;
  gap: var(--gap);
  height: auto;
  min-height: calc(100vh - 2 * var(--shell-pad) - env(safe-area-inset-bottom, 0px));
  min-height: calc(100dvh - 2 * var(--shell-pad) - env(safe-area-inset-bottom, 0px));
  transform-origin: top center; /* 整屏自适应缩放（fitCombat）的缩放原点 */
}
/* 战斗存续期无条件锁整页滚动/橡皮筋（2026-07-25 起与 fitCombat 缩放系数解耦：进战斗即加，
   换屏/终局由既有路径解除；ff≥1 时微信橡皮筋曾把整页拖上黑区）。
   三层叠加各管一段：
   ① html+body overflow hidden→clip 双写：手势滚动/橡皮筋全锁（旧内核回退 hidden 仍挡手势）；
   ② overscroll-behavior:none 双轴：关链式回弹（手牌 pan-x / 日志纵滚 / 弹层滚动由各自容器放行）；
   ③ body position:fixed+inset:0：桌面内核下根元素 clip 不阻断 window.scrollTo 等程序化滚动
      （ff<1 钉高产生的幻影区间实测可 scrollTo 45~88px），body 固顶后文档滚动区间恒为 0，
      程序化滚动一并锁死；body 盒与视口重合，fixed/absolute 后代包含块不受影响（非 transform） */
html:has(> body.cb-noscroll),
body.cb-noscroll { overflow: hidden; overflow: clip; overscroll-behavior: none; }
body.cb-noscroll { position: fixed; inset: 0; width: 100%; }

/* —— 顶部信息行 —— */
.cb-head {
  flex: none;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  flex-wrap: wrap;
  gap: var(--gap);
  padding-bottom: clamp(6px, 1vh, 8px);
  border-bottom: 1px solid var(--line);
  letter-spacing: .1em;
}
.cb-head-title { color: var(--phos); font-size: var(--fs-md); }
.cb-head-turn { color: var(--dim); font-size: var(--fs-sm); }
/* ASCEND.md §4：战斗标题区进阶 chip（视觉基类 .sc-ascend-chip 在 screens.css；此处只负责
   行内归位——margin-right:auto 与标题同簇居左，恒渲染+hidden 预留，出现/消失零位移） */
.cb-ascend-chip { margin-right: auto; align-self: center; }
/* 右侧组：回合计数 + 全局菜单齿轮（基类 .sc-gmenu-btn 在 screens.css，此处只负责行内对齐） */
.cb-head-side { display: inline-flex; align-items: center; gap: var(--gap); }
.cb-head-gmenu { align-self: center; }

/* —— §7.1 舞台：终端网格 + 中心径向磷光微光；≤1023 堆叠两行（矮屏除外），≥1024/矮屏改对垒横排 —— */
.cb-stage {
  position: relative;
  flex: 1 1 auto; /* 一屏预算：吃剩余空间；内容各档已紧凑化，不再用固定 min-height 撑高 */
  min-height: 180px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background:
    radial-gradient(ellipse 62% 58% at 50% 46%, color-mix(in srgb, var(--phos) 8%, transparent), transparent 72%),
    repeating-linear-gradient(0deg, color-mix(in srgb, var(--line) 70%, transparent) 0 1px, transparent 1px clamp(20px, 2.6vw, 30px)),
    repeating-linear-gradient(90deg, color-mix(in srgb, var(--line) 70%, transparent) 0 1px, transparent 1px clamp(20px, 2.6vw, 30px)),
    var(--panel);
  padding: clamp(10px, 2vh, 20px) clamp(12px, 1.8vw, 24px);
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  gap: clamp(8px, 1.6vh, 14px);
  transition: border-color .2s, box-shadow .2s;
}
.cb-vs {
  align-self: center;
  color: var(--dim);
  font-size: var(--fs-xs);
  letter-spacing: .3em;
  opacity: .75;
  white-space: nowrap;
  user-select: none;
}

/* —— §7.2 两侧（玩家/敌人）：聚光压暗过渡 200ms；--dim 兼容玩家侧/敌人侧两种挂法 —— */
.cb-side { position: relative; transition: filter .2s, opacity .2s, transform .2s; }
.cb-side--dim,
.cb-side--player--dim,
.cb-side--enemies--dim { filter: brightness(.55); }

/* 玩家侧：灵像 + 名称 + 血条 + 状态（桌面为左列） */
.cb-side--player {
  flex: 0 0 auto;
  width: clamp(190px, 21vw, 270px);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(6px, 1vh, 10px);
}
.cb-avatar {
  position: relative;
  width: var(--avatar);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(4px, .8vh, 8px);
}
.cb-avatar-core {
  position: relative;
  width: var(--avatar);
  height: var(--avatar);
  border-radius: 50%;
  border: 1px solid color-mix(in srgb, var(--phos) 55%, var(--line));
  background:
    radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--phos) 12%, transparent), transparent 68%),
    var(--panel2);
  box-shadow: 0 0 18px color-mix(in srgb, var(--phos) 14%, transparent),
    inset 0 0 14px color-mix(in srgb, var(--phos) 8%, transparent);
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 0;
}
.cb-avatar-core svg {
  width: 60%;
  height: 60%;
  color: var(--phos);
  filter: drop-shadow(0 0 8px color-mix(in srgb, var(--phos) 45%, transparent));
}
/* 能量满：磷光呼吸（.cb-avatar--full 挂容器 / .cb-avatar-core--full 挂本体，两种钩子等价兼容） */
.cb-avatar--full .cb-avatar-core,
.cb-avatar-core--full { animation: cb-avatar-breathe 2.4s ease-in-out infinite; }
/* 热量环：svg 套灵像外圈；rotate(-90deg) 令 dasharray 从 12 点方向起画（弧长由交互师内联注入） */
.cb-avatar-heat {
  position: absolute;
  top: calc(var(--avatar) * -0.075);
  left: 50%;
  width: calc(var(--avatar) * 1.15);
  height: calc(var(--avatar) * 1.15);
  transform: translateX(-50%) rotate(-90deg);
  pointer-events: none;
  overflow: visible;
}
.cb-avatar-heat circle { fill: none; }
.cb-avatar-heat-bg { stroke: color-mix(in srgb, var(--line) 85%, transparent); stroke-width: 2; }
.cb-avatar-heat-fg {
  stroke: var(--phos);
  stroke-width: 2;
  stroke-linecap: round;
  transition: stroke-dasharray .3s ease, stroke .3s;
  filter: drop-shadow(0 0 3px color-mix(in srgb, var(--phos) 50%, transparent));
}
/* heat≥7 转 amber（--hot 挂在 shell 上；--hot 挂环上是兼容挂法） */
.cb-shell--hot .cb-avatar-heat-fg,
.cb-avatar-heat--hot .cb-avatar-heat-fg {
  stroke: var(--amber);
  filter: drop-shadow(0 0 4px color-mix(in srgb, var(--amber) 55%, transparent));
}
/* heat≥10 红闪（交互师挂 .cb-avatar-heat--max） */
.cb-avatar-heat--max .cb-avatar-heat-fg {
  stroke: var(--red);
  animation: cb-heat-flash .5s steps(2, jump-none) infinite;
}
.cb-avatar-energy { display: flex; justify-content: center; }

.cb-unit-name { color: var(--phos); font-size: var(--fs-md); letter-spacing: .12em; text-align: center; }
/* D-010：行高钉到格挡徽标高度（line-height fs-sm+5 + 上下边框 2px）——
   徽标出现/消失（防御打出/回合清零）不再改变行高（桌面纵列实锤 +3.28px） */
.cb-unit-hp { width: 100%; display: flex; align-items: center; gap: clamp(4px, .6vw, 6px); min-height: calc(var(--fs-sm) + 7px); }
.cb-unit-hp > :first-child { flex: 1 1 auto; min-width: 0; }
/* D-010：min-height 恰一 pip 行高（pip 文本行 1.3 + 上下 padding/border 4px + 2px 余量），
   pip 行高同步钉死免疫平台字体差异——0↔1 个状态 pip 零位移（实锤 +1.7px） */
.cb-unit-status {
  min-height: calc(var(--fs-xs) * 1.3 + 6px);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 4px;
}
.cb-unit-status .sc-pip { line-height: 1.3; }

/* 格挡徽标：敌人用 .cb-block（位于 .cb-enemy-meta），玩家用 .cb-unit-block（位于 .cb-unit-hp） */
.cb-block,
.cb-unit-block {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 0 clamp(4px, .5vw, 5px);
  border-radius: 4px;
  border: 1px solid color-mix(in srgb, var(--amber) 50%, var(--line));
  color: var(--amber);
  font-size: var(--fs-sm);
  line-height: calc(var(--fs-sm) + 5px);
}
.cb-block svg,
.cb-unit-block svg { width: clamp(10px, 1vw, 12px); height: clamp(10px, 1vw, 12px); display: block; }
.cb-block i,
.cb-unit-block i { font-style: normal; font-weight: 700; }
/* D-010：敌人格挡徽标移出流——绝对定位贴卡左上（与 .cb-predict 右上镜像对称），
   出现/消失不再改变 .cb-enemy-meta 行内容；窄卡「徽标+多 pip 换行 +12.4px」实锤由此根除 */
.cb-enemy .cb-block {
  position: absolute;
  top: calc(-1 * var(--fs-lg));
  left: clamp(4px, .6vw, 8px);
  z-index: 6;
  pointer-events: none;
}

/* —— §7.3 敌人侧与敌人卡 —— */
.cb-side--enemies {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  align-items: flex-end;
  align-content: flex-end;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: var(--gap);
  /* D-010：堆叠档 overflow-x:auto 的经典滚动条同样占布局高度（3 敌窄屏溢出时），
     与手牌同法隐藏，高度与溢出状态解耦 */
  scrollbar-width: none;
}
.cb-side--enemies::-webkit-scrollbar { display: none; width: 0; height: 0; }
.cb-enemy {
  width: var(--enemy-w);
  position: relative;
  background: var(--panel2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: clamp(8px, 1vw, 10px) clamp(8px, 1vw, 10px) clamp(9px, 1.2vw, 12px);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(6px, .8vw, 8px);
  user-select: none; -webkit-user-select: none; /* 点选/长按敌人不选中名称与意图文本 */
  transition: transform .2s, filter .2s, opacity .2s, border-color .15s, box-shadow .15s;
}
.cb-enemy--targetable {
  cursor: crosshair;
  border-color: var(--amber);
  animation: cb-target-pulse 1.1s ease-in-out infinite;
}
@media (hover:hover) and (pointer:fine) {
  .cb-enemy--targetable:hover { box-shadow: 0 0 18px color-mix(in srgb, var(--amber) 28%, transparent); }
}
.cb-enemy--sel {
  border-color: var(--phos);
  transform: scale(1.03);
  box-shadow: 0 0 20px color-mix(in srgb, var(--phos) 30%, transparent);
  z-index: 2;
}
.cb-enemy--spot {
  filter: brightness(1.18);
  transform: scale(1.04);
  z-index: 2;
  border-color: color-mix(in srgb, var(--phos) 55%, var(--line));
  box-shadow: 0 0 24px color-mix(in srgb, var(--phos) 18%, transparent);
}
.cb-enemy--dim { filter: brightness(.55); transform: scale(.97); }
.cb-enemy--dead { opacity: .32; filter: grayscale(.85); }
.cb-enemy--dead .cb-predict,
.cb-enemy--dead .cb-hpghost { display: none; }

.cb-enemy-icon { line-height: 0; }
.cb-enemy-icon svg {
  width: clamp(48px, 6vw, 72px);
  height: clamp(48px, 6vw, 72px);
  color: var(--phos);
  filter: drop-shadow(0 0 8px color-mix(in srgb, var(--phos) 32%, transparent));
}
.cb-enemy--dead .cb-enemy-icon svg { color: var(--dim); filter: none; }

.cb-enemy-name {
  font-size: var(--fs-md);
  color: var(--ink);
  letter-spacing: .05em;
  text-align: center;
  line-height: 1.3;
  overflow-wrap: anywhere;
}

/* 意图条（大一号带图标；名称恒定两行高避免布局抖动）
   D-010 第三轮：min-height → 固定 height + 行高钉死 1.3——1 行/2 行名称、「离线」、「…」全等
   同高；旧版在 701~880h 档被压成 1 行高（fs-xs×1.5），意图重掷时 1↔2 行切换实锤 ±12~14px */
.cb-intent {
  --cb-intent-lh: 1.3;
  line-height: var(--cb-intent-lh);
  height: calc(var(--fs-md) * var(--cb-intent-lh) * 2 + 4px); /* 2 行文本 + 上下 padding/border */
  max-width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(3px, .5vw, 5px);
  padding: 1px clamp(6px, .8vw, 8px);
  border-radius: 4px;
  border: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 55%, transparent);
  font-size: var(--fs-md);
  color: var(--dim);
}
.cb-intent-icon { display: inline-flex; flex: 0 0 auto; }
.cb-intent-icon svg { width: clamp(13px, 1.4vw, 17px); height: clamp(13px, 1.4vw, 17px); display: block; }
.cb-intent-name {
  min-width: 0;
  overflow: hidden;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  overflow-wrap: anywhere;
}
.cb-intent-dmg { font-weight: 700; flex: 0 0 auto; }
.cb-intent--attack { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, var(--line)); }
.cb-intent--defend { color: var(--cyan); border-color: color-mix(in srgb, var(--cyan) 40%, var(--line)); }
.cb-intent--buff { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 40%, var(--line)); }
.cb-intent--debuff { color: var(--phos); border-color: color-mix(in srgb, var(--phos) 40%, var(--line)); }
.cb-intent--mixed { color: var(--ink); }
.cb-intent--none { opacity: .45; }

/* 血条行：仅 ghost + hpBar（格挡/状态移入 .cb-enemy-meta）；ghost 百分比以整行宽为基准 */
.cb-hp-wrap {
  position: relative;
  width: 100%;
  display: flex;
  align-items: center;
  gap: clamp(4px, .6vw, 6px);
  justify-content: center;
}
.cb-hp-wrap > :first-child { flex: 1 1 auto; min-width: 0; }
.cb-hp-wrap > .cb-hpghost + * { flex: 1 1 auto; min-width: 0; }
/* §7.4 预测生命损失琥珀段：left=当前 hp%、width=hpLoss%（由交互师内联注入） */
.cb-hpghost {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  width: 0;
  background: repeating-linear-gradient(-45deg,
    color-mix(in srgb, var(--amber) 55%, transparent) 0 4px,
    color-mix(in srgb, var(--amber) 28%, transparent) 4px 8px);
  border-right: 1px solid var(--amber);
  pointer-events: none;
  transition: width .15s ease, left .15s ease;
  z-index: 1;
}
.cb-enemy-meta {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: clamp(4px, .6vw, 6px);
  /* D-010：恰一 pip 行高（与 .cb-unit-status 同式）；格挡徽标已移出流（贴卡左上），
     本行只剩状态 pip——0↔1 pip 零位移（实锤 +1.68px） */
  min-height: calc(var(--fs-xs) * 1.3 + 6px);
}
.cb-enemy-meta .sc-pip { line-height: 1.3; }
.cb-status {
  min-height: calc(var(--fs-sm) * 1.6);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  flex-wrap: wrap;
}
.cb-enemy-meta .cb-status { min-height: 0; }

/* §7.4 预测徽章：敌人右上红底大字，弹出动画；空节点不占位 */
.cb-predict {
  position: absolute;
  top: calc(-1 * var(--fs-lg));
  right: clamp(4px, .6vw, 8px);
  z-index: 6;
  padding: 0 .38em;
  border-radius: 6px;
  background: color-mix(in srgb, var(--red) 85%, var(--bg));
  border: 1px solid color-mix(in srgb, var(--red) 65%, var(--ink));
  color: var(--bg);
  font-size: var(--fs-lg);
  font-weight: 700;
  letter-spacing: .04em;
  line-height: 1.35;
  box-shadow: 0 0 16px color-mix(in srgb, var(--red) 40%, transparent);
  pointer-events: none;
  animation: cb-predict-pop .18s cubic-bezier(.2, .9, .35, 1.35) both;
}
.cb-predict:empty { display: none; }

/* —— §7.5 拖拽瞄准线：铺满舞台、不吃指针、层级高于敌人；虚线流动=数据流 —— */
.cb-targetsvg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 5;
  overflow: visible;
}
.cb-targetline {
  fill: none;
  stroke: var(--phos);
  stroke-width: 2;
  stroke-dasharray: 6 6;
  animation: cb-dashflow .5s linear infinite;
  filter: drop-shadow(0 0 4px color-mix(in srgb, var(--phos) 45%, transparent));
}
.cb-targethead {
  fill: var(--phos);
  stroke: none;
  filter: drop-shadow(0 0 4px color-mix(in srgb, var(--phos) 55%, transparent));
}

/* —— §7.7 回合横幅挂载点：舞台中央覆盖层（.fx-banner 本体样式在 fx.css） —— */
.cb-banner-host {
  position: absolute;
  inset: 0;
  z-index: 8;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}

/* —— §7.8 热量≥7：屏边琥珀灼烧呼吸 —— */
.cb-shell--hot .cb-stage {
  border-color: color-mix(in srgb, var(--amber) 45%, var(--line));
  animation: cb-stage-burn 1.7s ease-in-out infinite;
}

/* —— 底部：牌堆 + 手牌 + 结束回合（允许 wrap，重排媒体查询全部沿用） —— */
.cb-bottom { flex: none; display: flex; align-items: flex-end; gap: var(--gap); flex-wrap: wrap; }
.cb-pilebox { display: flex; flex-direction: column; flex: 0 0 auto; gap: clamp(6px, .8vw, 8px); padding-bottom: clamp(6px, 1vh, 8px); }
.cb-hand {
  flex: 1 1 0; /* basis 0：手牌让出空间，结束回合/牌堆不被挤换行；溢出由自身横滑承担 */
  min-width: 0;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  justify-content: safe center; /* 溢出时不致首卡被裁（不支持则回退 center） */
  gap: var(--gap);
  overflow-x: auto;
  overscroll-behavior-x: contain;
  /* 顶部 16-22px / 底部 10-12px：hover/选中卡上抬 10px + scale 1.06 + 辉光 + 费用徽标(-10px)
     会顶到滚动容器的上下裁剪缘，留出余量防截断 */
  padding: clamp(16px, 2.4vh, 22px) var(--gap) clamp(10px, 1.4vh, 12px);
  /* D-010 第三轮：min-height 与有牌态精确同高（卡高+上下内边距）——打空手牌显占位行时高度零差。
     D-011 注：--card-h 在 :root 即冻结（不随卡槽 --card-w 收缩变动），桌面端收缩卡宽时本行高恒稳 */
  min-height: calc(var(--card-h) + clamp(16px, 2.4vh, 22px) + clamp(10px, 1.4vh, 12px));
  /* D-010 第三轮主链：隐藏自绘滚动条——经典滚动条（微信 X5 等内核）占布局高度，
     5 张溢出时 +~15px、打到 4 张消失，底排高度生灭经舞台 flex 重分配放大成整屏下移；
     隐藏后手牌区高度与手牌数彻底解耦。触屏 pan-x 滑动不受滚动条显隐影响 */
  scrollbar-width: none;
  touch-action: pan-x pan-y; /* 牌缝间（非卡槽区域）保留浏览器原生横滑手牌与纵向页面滚动 */
}
.cb-hand::-webkit-scrollbar { display: none; width: 0; height: 0; }
.cb-hand-empty { align-self: center; color: var(--dim); letter-spacing: .1em; }

/* —— 手牌高数量提示（2026-07-25 内容线移交项①：retain 连攥无上限的撑爆隐患） ——
   牌数上限属内容线平衡域，工程侧不动规则，只补「可发现性」：
   ①「共 N 张」角标（≥8 张由 combatScreen.js 渲染为流内末项）：sticky 钉右缘，
     right:28px 避开 24px 右渐变区，pointer-events:none 不挡出牌/拖拽；
     高度恒小于行高（行高由 --card-h 钉死，align-self:center 不撑行）→ 垂直零位移。
   ② 滚动位置感知边缘渐变：容器 mask-image 只淡入 24px 边缘，信息随滑随显、
     永不遮盖内容（不遮信息红线）；零布局占地（非流内元素，不产生 gap/位移）。
     --scr-l/--scr-r 类由 JS 按 scrollLeft 实时切换；未溢出时无类无渐变，
     桌面 5~7 收窄全入镜档视觉与旧版零差。
   mask-image 不支持的旧内核：渐变静默缺失，角标与横滚不受影响（优雅降级）。 */
.cb-hand-count {
  position: sticky;
  right: 28px;
  align-self: center;
  flex: 0 0 auto;
  z-index: 3;
  pointer-events: none;
  padding: .28em .6em;
  border-radius: 999px;
  font-size: var(--fs-xs);
  letter-spacing: .06em;
  white-space: nowrap;
  color: var(--cyan);
  background: color-mix(in srgb, var(--panel) 82%, transparent);
  border: 1px solid color-mix(in srgb, var(--cyan) 38%, transparent);
}
.cb-hand--scr-l {
  -webkit-mask-image: linear-gradient(to right, transparent, #000 24px);
  mask-image: linear-gradient(to right, transparent, #000 24px);
}
.cb-hand--scr-r {
  -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent);
  mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent);
}
.cb-hand--scr-l.cb-hand--scr-r {
  -webkit-mask-image: linear-gradient(to right, transparent, #000 24px, #000 calc(100% - 24px), transparent);
  mask-image: linear-gradient(to right, transparent, #000 24px, #000 calc(100% - 24px), transparent);
}

/* 手牌槽：三类型低饱和配色（attack=red / skill=cyan / power=amber）
   §5.3：hover/选中位移全部由 slot 负责（.sc-card--click:hover 不再 translate） */
.cb-card-slot {
  position: relative;
  flex: 0 0 auto; /* 手牌横排不许压扁卡牌（§2.3） */
  border-radius: 8px;
  scroll-snap-align: center; /* ≤720px 手牌横滑吸附 */
  touch-action: pan-x; /* 方向仲裁模型：浏览器只在手势开始瞬间采样本值——恒为 pan-x，
    卡上横向手势交给浏览器原生横滑手牌（接管后补 pointercancel），垂直手势浏览器不接管、
    事件持续送达，由 combatScreen.js 在首个 >10px 位移时仲裁（横让位 / 竖拖拽），全程不再动态改写 */
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; /* 拖拽期抑制文本选择/放大镜（行为属性） */
  transition: transform .12s ease, box-shadow .12s ease, opacity .15s, filter .15s;
}
@media (hover:hover) and (pointer:fine) {
  .cb-card-slot:hover { transform: translateY(-6px); }
}
.cb-card-slot--attack {
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--red) 50%, transparent),
    0 0 10px color-mix(in srgb, var(--red) 10%, transparent);
}
.cb-card-slot--skill {
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--cyan) 50%, transparent),
    0 0 10px color-mix(in srgb, var(--cyan) 10%, transparent);
}
.cb-card-slot--power {
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--amber) 50%, transparent),
    0 0 10px color-mix(in srgb, var(--amber) 10%, transparent);
}
.cb-card-slot--off { opacity: .45; filter: grayscale(.55); }
@media (hover:hover) and (pointer:fine) {
  .cb-card-slot--off:hover { transform: none; }
}
.cb-card-slot--sel {
  transform: translateY(-10px);
  box-shadow: inset 0 0 0 1px var(--amber),
    0 0 20px color-mix(in srgb, var(--amber) 32%, transparent);
}
@media (hover:hover) and (pointer:fine) {
  .cb-card-slot--sel:hover { transform: translateY(-10px); }
}
/* §7.6 悬停手牌（交互师 pointerenter 挂类）：上移 10px + 放大 1.06 + 辉光 + 层级提升 */
.cb-card-slot--hover {
  transform: translateY(-10px) scale(1.06);
  z-index: 5;
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--phos) 70%, transparent),
    0 0 24px color-mix(in srgb, var(--phos) 30%, transparent);
}
.cb-card-slot--off.cb-card-slot--hover { transform: none; box-shadow: none; }
/* §7.6 拖拽幻影：克隆卡面跟随指针，fixed + 轻旋转，最高层级 */
.cb-dragghost {
  position: fixed;
  z-index: 1000;
  transform: rotate(-4deg);
  opacity: .95;
  pointer-events: none;
  filter: drop-shadow(0 0 14px color-mix(in srgb, var(--phos) 35%, transparent));
}

/* 结束回合：字号/内边距流体化；endwrap 兼作提示/连击两个浮层的锚（position:relative） */
.cb-endwrap { position: relative; display: flex; flex-direction: column; align-items: flex-end; gap: clamp(6px, .8vw, 8px); }
/* endwrap 内按钮行（「?」词汇表 + 结束回合）：新骨架沿用类名，样式常驻 */
.cb-player-meters { display: flex; align-items: center; gap: var(--gap); flex-wrap: wrap; justify-content: flex-end; }
/* 提示/连击浮层化（方案 A，2026-07-25）：position:absolute 不参与布局——平时零占位，
   底排按钮与手牌之间不再留空地；出现/消失对布局贡献恒 0（位移红线语义不变）。
   两浮层 pointer-events:none 永不挡点击；z-index 10 高于卡牌(≤5)、低于 modal(9000)/tooltip(9500) */
.cb-hint {
  position: absolute;
  bottom: calc(100% + 12px); /* 锚在结束回合按钮上方，右缘对齐向左展开 */
  right: 0;
  max-width: calc(100vw - 24px);
  padding: .3em .85em;
  font-size: var(--fs-sm);
  color: var(--amber);
  letter-spacing: .03em;
  white-space: nowrap;
  background: color-mix(in srgb, var(--panel) 92%, transparent);
  border: 1px solid color-mix(in srgb, var(--amber) 45%, transparent);
  border-radius: 999px;
  box-shadow: 0 0 14px color-mix(in srgb, var(--amber) 16%, transparent);
  pointer-events: none;
  z-index: 10;
}
.cb-hint:empty { visibility: hidden; } /* 空提示不渲染；浮层本不占位，:empty 只管可见性 */
/* 连击徽标：贴在结束回合按钮右上角外缘（锚=endwrap 右上角），不遮按钮本体点击区。
   定位只用 top/right 偏移、禁用 transform——fx-combo-pop 动画改写 transform，静态 transform 会被覆盖 */
.cb-combo {
  position: absolute;
  top: -.55em;
  right: -.55em;
  padding: .08em .55em;
  line-height: 1.5;
  font-size: var(--fs-sm);
  font-weight: 700;
  letter-spacing: .08em;
  white-space: nowrap;
  color: var(--amber);
  background: var(--panel2);
  border: 1px solid color-mix(in srgb, var(--amber) 55%, transparent);
  border-radius: 999px;
  text-shadow: 0 0 12px color-mix(in srgb, var(--amber) 45%, transparent);
  box-shadow: 0 0 10px color-mix(in srgb, var(--amber) 22%, transparent);
  pointer-events: none;
  z-index: 10;
}
.cb-combo:empty { visibility: hidden; }
/* ≥1024 宽屏单行档：右侧 pilebox 双按钮竖堆高出 endwrap 顶 ~25px，+12 的药丸会压弃牌堆顶
   （1366×768 实测相交区 x928-1002×y569-583）；抬 34~44px 脱开按钮顶——药丸左缘 928 仍右于
   最右卡牌右缘 925，不上卡面（721~1023 矮屏横排实测 +12 无碰撞，维持基础值） */
@media (min-width: 1024px) {
  .cb-hint { bottom: calc(100% + clamp(34px, 5vh, 44px)); }
}
.cb-endturn {
  font-family: var(--font);
  font-size: var(--fs-lg);
  letter-spacing: .18em;
  padding: .72em 1.8em;
  cursor: pointer;
  touch-action: manipulation;
  color: var(--phos);
  background: var(--panel2);
  border: 1px solid var(--phos);
  border-radius: 8px;
  box-shadow: 0 0 16px color-mix(in srgb, var(--phos) 12%, transparent);
  transition: background .15s, box-shadow .15s, transform .1s;
}
@media (hover:hover) and (pointer:fine) {
  .cb-endturn:hover:not(:disabled) {
    background: color-mix(in srgb, var(--phos) 12%, var(--panel2));
    box-shadow: 0 0 24px color-mix(in srgb, var(--phos) 26%, transparent);
  }
}
.cb-endturn:active:not(:disabled) { transform: translateY(1px); }
.cb-endturn:disabled { opacity: .4; cursor: not-allowed; }
/* 尚有可打出卡牌时（交互师挂 .cb-endturn--pulse）：能量脉冲磷光呼吸 */
.cb-endturn--pulse { animation: cb-end-pulse 1.9s ease-in-out infinite; }
/* §2.6：触屏可点目标 ≥ 42px */
@media (pointer: coarse) {
  .cb-endturn { min-height: 42px; }
}

/* 战斗日志：高度按比例钉死（出牌不再带着画面走位）——历史上写死高度曾在预算紧张时把末行削在盒内，
   本次仍按 cap 公式 clamp(72px,14vh,152px) 钉死，再用 round(down,…,行高) 把内容区收整到恰好整数行
   （行高=--fs-sm×1.55 全局行高），任何视口都不削末行；不支持 round() 的旧浏览器回退纯 clamp
   （依然钉死，仅不收整）。下内边距必须为 0：滚动盒裁剪在 padding box 外缘，padB>0 时溢出内容的
   下一行会洇进下内边距露出半行（844×390 实测实锤）；底部视觉留白由末行行高自带的下 leading 提供。
   多视口削行/零位移验收矩阵见本次修复记录。 */
.cb-log {
  flex: none;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  --cb-log-pad-y: clamp(8px, 1vw, 10px);
  --cb-log-lh: calc(var(--fs-sm) * 1.55);
  /* 钉高收整扣减项：上下边框 2px + 上内边距 + 标题行(1 行) + 标题下边距 4px（矮屏档标题隐藏时另算） */
  --cb-log-extra: calc(2px + var(--cb-log-pad-y) + var(--cb-log-lh) + 4px);
  padding: var(--cb-log-pad-y) clamp(10px, 1.4vw, 14px) 0;
  font-size: var(--fs-sm);
  height: clamp(72px, 14vh, 152px);
  height: calc(round(down, clamp(72px, 14vh, 152px) - var(--cb-log-extra), var(--cb-log-lh)) + var(--cb-log-extra));
  overflow-y: auto;
  overscroll-behavior: contain;
}
.cb-log-title { color: var(--dim); letter-spacing: .12em; margin-bottom: 4px; }
.cb-log-line {
  color: var(--dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.cb-log-line--new { color: var(--ink); }

/* 结算横幅（§4.6 重设计：顶部胜/负色能量条 + 分色辉光） */
.cb-banner {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: flex;
  align-items: center;
  justify-content: center;
  background: color-mix(in srgb, var(--bg) 78%, transparent);
  animation: cb-banner-in .35s ease;
}
.cb-banner-box {
  position: relative;
  overflow: hidden;
  text-align: center;
  max-width: calc(100vw - 24px);
  padding: clamp(18px, 4vh, 30px) clamp(20px, 6vw, 64px);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
}
.cb-banner-box::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: var(--line);
}
.cb-banner--win .cb-banner-box {
  border-color: var(--phos);
  box-shadow: 0 0 30px color-mix(in srgb, var(--phos) 18%, transparent);
}
.cb-banner--win .cb-banner-box::before {
  background: var(--phos);
  box-shadow: 0 0 12px color-mix(in srgb, var(--phos) 60%, transparent);
}
.cb-banner--lose .cb-banner-box {
  border-color: var(--red);
  box-shadow: 0 0 30px color-mix(in srgb, var(--red) 16%, transparent);
}
.cb-banner--lose .cb-banner-box::before {
  background: var(--red);
  box-shadow: 0 0 12px color-mix(in srgb, var(--red) 60%, transparent);
}
.cb-banner-text { font-size: var(--fs-xl); letter-spacing: .22em; margin-bottom: clamp(6px, 1vh, 8px); }
.cb-banner--win .cb-banner-text { color: var(--phos); }
.cb-banner--lose .cb-banner-text { color: var(--red); }
.cb-banner-sub { color: var(--dim); font-size: var(--fs-md); letter-spacing: .08em; }

/* 牌堆列表弹窗 */
.cb-pile-modal { width: min(560px, calc(100vw - 24px)); }
.cb-pile-head { color: var(--phos); letter-spacing: .08em; margin-bottom: clamp(8px, 1vh, 10px); }
.cb-pile-grid {
  display: flex;
  flex-wrap: wrap;
  gap: var(--gap);
  max-height: 52vh;
  max-height: 52dvh;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 12px 0 0 12px; /* 费用徽标 -10px 外溢不再被裁 */
}
.cb-pile-empty { color: var(--dim); }

/* —— §7.2 横排对垒：≥1024 任意高度保持玩家左/敌人右；721~1023 矮屏（≤700h）堆叠放不下时也横排 —— */
@media (min-width: 1024px), (min-width: 721px) and (max-height: 700px) {
  .cb-stage { flex-direction: row; align-items: flex-end; justify-content: space-between; }
  .cb-side--player { align-self: flex-end; }
  .cb-side--enemies { align-self: flex-end; }
}
@media (min-width: 1024px) {
  .cb-vs { writing-mode: vertical-rl; letter-spacing: .4em; }
}

/* —— §7.9 堆叠档：≤720 全高度 + 721~1023 非矮屏——敌人上排横滑、玩家单行（灵像居左跨行、
     名称/血条/状态居右）、VS 隐藏省一行、底排手牌独占一行；组件尺寸按 vw 流体紧凑化 —— */
@media (max-width: 720px), (max-width: 1023px) and (min-height: 701px) {
  .cb-shell { --avatar: clamp(56px, 10vw, 96px); }
  .cb-stage { gap: clamp(6px, 1.2vh, 10px); padding: clamp(8px, 1.6vh, 12px) clamp(8px, 2vw, 12px); }
  .cb-vs { display: none; } /* 堆叠两行已自明敌我，省出一行预算 */
  /* 敌人行：按数量自适应铺满、无需滚动（契约：normal 1-3 只 / elite·boss 1 只）；
     overflow-x:auto 仅作极端兜底，safe center 防兜底溢出时首卡被裁（不支持回退 center） */
  .cb-side--enemies {
    order: -1;
    flex: 0 0 auto; /* 不许被舞台压矮：卡片顶对齐，杜绝底对齐+overflow 削顶（2026-07 顶裁修复） */
    align-items: flex-start;
    flex-wrap: nowrap;
    justify-content: center;
    justify-content: safe center;
    overflow-x: auto;
    overscroll-behavior-x: contain;
    /* 上下各留 16px：overflow-x:auto 会在两轴形成裁剪，--sel(scale 1.03)/--spot(1.04)
       放大与辉光会顶到容器上下缘被截断（含血条数字/意图图标出界），留出安全余量 */
    padding: 16px 2px;
  }
  /* :has() 计数感知宽度：恰 1 敌不被拉成细长条，3 敌窄宽同屏全显；flex-shrink 允许、
     min-width:0 保证 390px 下 3 敌可再压缩不截断；不支持 :has() 时回退 3 敌档（仍全显、仅偏小） */
  .cb-side--enemies .cb-enemy {
    flex: 0 1 auto;
    min-width: 0;
    width: min(30vw, 170px);
    padding: clamp(6px, 1.5vw, 8px);
    gap: clamp(4px, 1vw, 6px);
  }
  .cb-side--enemies:has(> .cb-enemy:only-child) .cb-enemy { width: min(58vw, 220px); }
  .cb-side--enemies:has(> .cb-enemy:nth-child(2):last-child) .cb-enemy { width: min(42vw, 190px); }
  /* 敌人卡内部同步紧凑化：图标降档、卡名 --fs-sm、血条更薄、意图徽章 --fs-xs */
  .cb-side--enemies .cb-enemy-icon svg { width: clamp(30px, 9vw, 44px); height: clamp(30px, 9vw, 44px); }
  .cb-side--enemies .cb-enemy-name { font-size: var(--fs-sm); }
  .cb-side--enemies .cb-intent { font-size: var(--fs-xs); height: calc(var(--fs-xs) * var(--cb-intent-lh) * 2 + 4px); }
  .cb-side--enemies .cb-intent-icon svg { width: clamp(11px, 3vw, 14px); height: clamp(11px, 3vw, 14px); }
  .cb-side--enemies .sc-hpbar { min-width: 0; height: clamp(12px, 3vw, 15px); }
  .cb-side--player {
    width: 100%;
    display: grid;
    grid-template-columns: auto 1fr;
    column-gap: var(--gap);
    align-items: center;
    justify-items: start;
  }
  .cb-avatar { grid-row: 1 / span 3; }
  .cb-unit-name { text-align: left; }
  .cb-unit-status { justify-content: flex-start; } /* D-010：min-height 占位全档保留（旧 min-height:0 已根除） */
  /* 底排：手牌独占一行横滑；两列牌堆与结束回合同占一行 */
  .cb-hand { order: 1; flex: 1 1 100%; }
  .cb-pilebox { display: contents; } /* 拍平两列：三个牌堆按钮直接参与底排，与结束回合整齐同行 */
  .cb-pilebox > * { order: 2; } /* 拍平后保持次序：手牌(1) → 牌堆按钮(2) → 结束区(3) */
  .cb-endwrap { order: 3; margin-left: auto; }
  /* 提示/连击已浮层化（absolute，见基础规则）：对 endwrap 宽度贡献恒 0，本档不再需要
     旧 width:0 + justify-end 钉右缘 hack（长提示撑宽 endwrap 致底排换行 -33.2px 一族随之根除） */
}

/* ≤720 追加：卡宽 46vw 上限横滑+吸附、牌堆/结束按钮收一档（行宽紧张不被裁） */
@media (max-width: 720px) {
  .cb-shell { --card-w: min(46vw, clamp(104px, 15vw, 158px)); }
  .cb-hand {
    justify-content: flex-start;
    scroll-snap-type: x proximity; /* 触屏轻滑不强制吸卡，降低误触位移 */
  }
  /* 窄屏打牌区不显示风味文本：定高内盒放不下时它被底线腰斩（右侧两卡实锤），
     与其切坏不如整块隐藏；奖励/商店/卡组等阅读场景由 components.guardFlavor 做"全显或全隐" */
  .cb-hand .sc-card-flavor { display: none; }
  .cb-bottom .sc-pilebtn { font-size: var(--fs-xs); padding: .5em .7em; }
  .cb-endturn { font-size: var(--fs-md); padding: .55em 1em; letter-spacing: .08em; }
}

/* 堆叠 × 高度紧张档（701~880px 有效视口：浏览器外框/系统缩放吃掉高度后的真实区间）：
   敌人卡与玩家行再压一档，保证被吃掉外框高度后依然一屏放下、任何元素不被削 */
@media (max-width: 1023px) and (min-height: 701px) and (max-height: 880px) {
  .cb-shell { --avatar: clamp(48px, 8vw, 64px); }
  .cb-side--enemies { padding: 10px 2px; }
  .cb-side--enemies .cb-enemy { padding: clamp(4px, 1vh, 6px); gap: 3px; }
  .cb-side--enemies .cb-enemy-icon svg { width: clamp(22px, 6vw, 30px); height: clamp(22px, 6vw, 30px); }
  .cb-side--enemies .cb-enemy-name { font-size: var(--fs-xs); }
  /* D-010：本档旧值 fs-xs×1.5（1 行高）是意图重掷 ±12~14px 实锤元凶——
     恒定两行高与全档对齐，多出的一行预算由 fitCombat 缩放吸收 */
  .cb-side--enemies .cb-intent { height: calc(var(--fs-xs) * var(--cb-intent-lh) * 2 + 4px); }
  .cb-side--enemies .sc-hpbar { height: clamp(10px, 2.4vw, 12px); }
  .cb-avatar-energy .sc-orb { width: clamp(34px, 7vw, 42px); height: clamp(34px, 7vw, 42px); }
}
@media (min-width: 721px) and (max-width: 1023px) and (min-height: 701px) and (max-height: 880px) {
  .cb-shell { --card-w: clamp(96px, 13vw, 132px); }
}

/* 1024~1599 单行档：--card-w 上限按实测收紧，全区间 5 张静止全显（≥1600 走宽屏档不受影响） */
@media (min-width: 1024px) and (max-width: 1599px) {
  .cb-shell { --card-w: clamp(96px, calc(20vw - 102px), 132px); }
}

/* —— D-011 桌面端（≥1024 + 精确指针）手牌计数感知收缩：5~7 张全入镜，8+ 回退横滚 ——
   背景：D-010 第三轮隐藏滚动条后，桌面端 5 张即轻微溢出、6+ 张最右卡明显被裁，
   且失去「还能往右拖」的滚动条线索。机制：.cb-hand 声明为 inline-size 查询容器，
   :has() 计数命中时只在卡槽作用域覆写 --card-w（卡牌尺寸唯一来源仍是变量，契约 §5.2）。
   垂直零位移天然成立：卡高来自 --card-h（main.css :root 以 :root 卡宽代入后即冻结），
   不随卡槽 --card-w 变动——收缩只把卡做窄，卡高/行高/底排/舞台/敌我区 y 全部纹丝不动
   （D-010 位移红线不破；空牌占位 min-height 同式引用 --card-h，本就免疫收缩）。
   收缩量按容器内容盒实测自适应（cqw），各档/各窗宽无需逐档算数；
   clamp 上限为壳层冻结的当档基准卡宽 --card-w-base（够放就不缩，5 张宽屏维持原宽）。
   下限 96/88/80px 对齐既有最矮档卡宽区间（矮屏档下限 80px），装不下时宁回 overflow-x 横滚
   不缩到不可读（桌面滚轮横移见 combatScreen.js D-011）。
   cqw/:has() 不支持的旧内核整组忽略：维持基准卡宽 + 横滚，行为与修复前一致（优雅降级）。
   触屏/窄屏不在本媒体查询命中范围：≤1023 各档与 coarse 指针行为零变化 */
@media (min-width: 1024px) and (hover: hover) and (pointer: fine) {
  .cb-hand { container-type: inline-size; }
  .cb-hand:has(> .cb-card-slot:nth-child(5):last-child) > .cb-card-slot {
    --card-w: clamp(96px, calc((100cqw - 4 * var(--gap)) / 5 - 1px), var(--card-w-base));
  }
  .cb-hand:has(> .cb-card-slot:nth-child(6):last-child) > .cb-card-slot {
    --card-w: clamp(88px, calc((100cqw - 5 * var(--gap)) / 6 - 1px), var(--card-w-base));
  }
  .cb-hand:has(> .cb-card-slot:nth-child(7):last-child) > .cb-card-slot {
    --card-w: clamp(80px, calc((100cqw - 6 * var(--gap)) / 7 - 1px), var(--card-w-base));
  }
}

/* (max-height:700px) 矮屏压缩：舞台下限再降、灵像/敌人图标降档、手牌卡再降一档、日志压到 ~48px */
@media (max-height: 700px) {
  .cb-shell { --card-w: clamp(80px, 11vw, 118px); --avatar: clamp(64px, 9vw, 104px); gap: clamp(3px, .6vh, 5px); }
  .cb-head { padding-bottom: clamp(2px, .5vh, 4px); }
  .cb-stage {
    min-height: 140px;
    gap: clamp(4px, 1vh, 8px);
    padding: clamp(6px, 1.2vh, 10px) clamp(10px, 1.4vw, 14px);
  }
  .cb-side--enemies { gap: clamp(6px, 1vw, 10px); }
  .cb-enemy { padding: clamp(5px, 1vh, 7px) clamp(6px, .9vw, 8px); gap: clamp(4px, .6vh, 5px); }
  .cb-enemy-icon svg { width: clamp(24px, 3.6vw, 34px); height: clamp(24px, 3.6vw, 34px); }
  .cb-intent { font-size: var(--fs-sm); height: calc(var(--fs-sm) * var(--cb-intent-lh) * 2 + 4px); }
  /* D-010：矮屏档同样保留 pip 行占位（旧 min-height:0 是 0↔1 pip 抖动源，已根除；
     占位成本 ~19px×2 由 fitCombat 缩放吸收） */
  /* 矮屏玩家列瘦身：能量球移到灵像右侧（免纵向叠加），容器宽度随行内容自适应，
     热量环圆心钉在灵像本体中心（左起第一个子件） */
  .cb-avatar { flex-direction: row; align-items: center; width: auto; }
  .cb-avatar-heat { left: calc(var(--avatar) / 2); }
  .cb-hand {
    /* D-010：与有牌态精确同高（卡高+本档上下内边距），打空手牌零位移（--card-h :root 冻结，收缩不动行高） */
    min-height: calc(var(--card-h) + clamp(14px, 2.2vh, 18px) + clamp(4px, .8vh, 6px));
    /* 上内边距须容纳费用角标凸出（cost-s/3 ≈ 8-10px）+ hover 上抬 10px：
       旧值 4-6px 会把角标圆圈顶部削掉（矮屏手机实锤），下限抬到 14px */
    padding-top: clamp(14px, 2.2vh, 18px);
    padding-bottom: clamp(4px, .8vh, 6px);
  }
  .cb-pilebox { padding-bottom: 0; }
  /* 提示/连击已浮层化（见基础规则）：absolute 不占布局，本档无需任何占位规则 */
  /* 矮屏档同步钉死：标题隐藏，扣减项仅剩边框+上内边距；下限从 48px 抬到 58px，
     保证最大行高组合下也收整出 ≥2 整行（extra≤10px 时 2×19.375px+10px=48.75px≤58px），避免收整塌成单行；
     下内边距同基础规则必须为 0（防溢出内容下一行洇进 padding 露半行） */
  .cb-log {
    --cb-log-pad-y: clamp(6px, .8vw, 8px);
    --cb-log-extra: calc(2px + var(--cb-log-pad-y));
    height: clamp(58px, 12vh, 120px);
    height: calc(round(down, clamp(58px, 12vh, 120px) - var(--cb-log-extra), var(--cb-log-lh)) + var(--cb-log-extra));
    padding: var(--cb-log-pad-y) clamp(10px, 1.4vw, 14px) 0;
  }
  .cb-log-title { display: none; }
}

/* —— 非指向卡拖放至打出区：玩家灵像磷光脉冲提示「松手打出」 —— */
.cb-avatar--dropok .cb-avatar-core { border-color: var(--phos); animation: cb-dropok-pulse .8s ease-in-out infinite; }
@keyframes cb-dropok-pulse {
  0%, 100% { box-shadow: 0 0 10px color-mix(in srgb, var(--phos) 18%, transparent); }
  50% { box-shadow: 0 0 22px color-mix(in srgb, var(--phos) 42%, transparent); }
}

/* —— 减弱动态偏好：脉冲/流动/呼吸一律压到近瞬发 —— */
@media (prefers-reduced-motion: reduce) {
  .cb-enemy--targetable,
  .cb-shell--hot .cb-stage,
  .cb-avatar--full .cb-avatar-core,
  .cb-avatar-core--full,
  .cb-avatar-heat--max .cb-avatar-heat-fg,
  .cb-endturn--pulse,
  .cb-predict,
  .cb-targetline { animation-duration: .01s; animation-iteration-count: 1; }
}

/* —— 动效关键帧 —— */
@keyframes cb-target-pulse {
  0%, 100% { box-shadow: 0 0 6px color-mix(in srgb, var(--amber) 12%, transparent); }
  50% { box-shadow: 0 0 18px color-mix(in srgb, var(--amber) 30%, transparent); }
}
@keyframes cb-dashflow {
  to { stroke-dashoffset: -12; }
}
@keyframes cb-predict-pop {
  0% { opacity: 0; transform: scale(.4) translateY(4px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}
@keyframes cb-stage-burn {
  0%, 100% {
    box-shadow: inset 0 0 22px color-mix(in srgb, var(--amber) 10%, transparent),
      inset 0 0 2px color-mix(in srgb, var(--amber) 30%, transparent);
  }
  50% {
    box-shadow: inset 0 0 44px color-mix(in srgb, var(--amber) 20%, transparent),
      inset 0 0 2px color-mix(in srgb, var(--amber) 55%, transparent);
  }
}
@keyframes cb-avatar-breathe {
  0%, 100% {
    box-shadow: 0 0 16px color-mix(in srgb, var(--phos) 14%, transparent),
      inset 0 0 12px color-mix(in srgb, var(--phos) 8%, transparent);
  }
  50% {
    box-shadow: 0 0 32px color-mix(in srgb, var(--phos) 34%, transparent),
      inset 0 0 20px color-mix(in srgb, var(--phos) 16%, transparent);
  }
}
@keyframes cb-heat-flash {
  0%, 100% { opacity: 1; }
  50% { opacity: .25; }
}
@keyframes cb-end-pulse {
  0%, 100% { box-shadow: 0 0 14px color-mix(in srgb, var(--phos) 12%, transparent); }
  50% { box-shadow: 0 0 30px color-mix(in srgb, var(--phos) 34%, transparent); }
}
@keyframes cb-banner-in {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* ==== styles/screens.css ==== */
/* 《零日协议》功能屏与通用构件（界面 UI 所有）
   命名空间 .sc-*；颜色只用 main.css 的设计变量；低饱和深色终端风
   响应式重写（RESPONSIVE.md）：尺寸只用 §3 令牌 / clamp 表达式，
   写死 px 仅保留在阴影、1-2px 边框与 ≤4px 微观修饰级别。 */

.sc-shell { padding: clamp(10px, 1.5vw, 16px) 0 clamp(28px, 4vw, 48px); }
.sc-center { display: flex; flex-direction: column; align-items: center; gap: clamp(12px, 2vw, 18px); }
.sc-ic { width: clamp(15px, 1.6vw, 18px); height: clamp(15px, 1.6vw, 18px); display: block; }
.sc-ic-wrap { display: inline-flex; align-items: center; }

/* ============ 顶部状态条（地图屏） ============ */
.sc-topbar {
  display: flex; align-items: center; gap: clamp(8px, 1.5vw, 18px); flex-wrap: wrap;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: clamp(6px, 1vw, 8px) clamp(10px, 1.6vw, 14px);
  margin-bottom: clamp(10px, 1.5vw, 14px);
}
.sc-topbar-cell { display: flex; align-items: center; gap: clamp(4px, .7vw, 6px); font-size: var(--fs-sm); }
.sc-topbar-act { gap: var(--gap); margin-right: auto; font-size: var(--fs-md); letter-spacing: .06em; }
.sc-topbar-btn {
  display: inline-flex; align-items: center; gap: clamp(4px, .7vw, 6px);
  font-family: var(--font); font-size: var(--fs-sm);
  background: var(--panel2); color: var(--ink);
  border: 1px solid var(--line); border-radius: 6px;
  padding: clamp(4px, .8vw, 6px) clamp(8px, 1.4vw, 12px); cursor: pointer;
  touch-action: manipulation;
  transition: border-color .15s, color .15s;
}
@media (hover:hover) and (pointer:fine) {
  .sc-topbar-btn:hover { border-color: var(--phos); color: var(--phos); }
}
.sc-topbar-relics { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }

/* ============ 地图 ============ */
.sc-map-wrap {
  max-height: min(68vh, 980px); overflow: auto; overscroll-behavior: contain;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
}
.sc-map-svg { display: block; margin: 0 auto; width: min(100%, 560px); height: auto; }
.sc-map-edge { stroke: var(--line); stroke-width: 2; }
.sc-map-edge--hot { stroke: var(--dim); }
.sc-map-node-ring { fill: var(--panel2); stroke: var(--line); stroke-width: 2; }
.sc-map-node-ic { color: var(--dim); }
.sc-map-node .sc-ic { width: 24px; height: 24px; }
.sc-map-node { touch-action: manipulation; }
.sc-map-node--avail { cursor: pointer; animation: sc-breathe 1.6s ease-in-out infinite; }
.sc-map-node--avail .sc-map-node-ring { stroke: var(--phos); fill: var(--panel); }
.sc-map-node--avail .sc-map-node-ic { color: var(--phos); }
@media (hover:hover) and (pointer:fine) {
  .sc-map-node--avail:hover .sc-map-node-ring { fill: var(--bg); stroke-width: 3; }
}
.sc-map-node--done { opacity: .7; }
.sc-map-node--done .sc-map-node-ring { stroke: var(--dim); }
.sc-map-node--dim { opacity: .32; }
.sc-map-node--cur .sc-map-node-ring { stroke: var(--amber); stroke-width: 3; }
.sc-map-node--cur .sc-map-node-ic { color: var(--amber); }
.sc-map-node-check { color: var(--phos); }
@keyframes sc-breathe {
  0%, 100% { filter: drop-shadow(0 0 2px rgba(143, 211, 160, .25)); }
  50% { filter: drop-shadow(0 0 11px rgba(143, 211, 160, .65)); }
}
.sc-legend {
  display: flex; gap: clamp(8px, 1.6vw, 16px); flex-wrap: wrap; justify-content: center;
  margin-top: clamp(6px, 1vw, 10px); color: var(--dim); font-size: var(--fs-sm);
}
.sc-legend-item { display: inline-flex; align-items: center; gap: 4px; flex: none; }
.sc-legend-item .sc-ic { width: clamp(13px, 1.4vw, 15px); height: clamp(13px, 1.4vw, 15px); }

/* ============ 卡牌构件（尺寸唯一来源，契约 §5.2） ============ */
.sc-card {
  position: relative; width: var(--card-w); height: var(--card-h);
  /* 固定高度：卡名折行曾把卡撑高（手牌"三矮两高"），统一尺寸；内容裁剪由内层 .sc-card-in
     负责——本卡不 overflow，费用徽标才能正常凸出卡面 */
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: clamp(10px, 1.4vw, 14px) clamp(8px, 1.2vw, 12px) clamp(6px, 1vw, 10px);
  display: flex; flex-direction: column; gap: clamp(4px, .7vw, 6px);
  user-select: none; -webkit-user-select: none; /* 触屏长按不选中卡面文字（阅读/输入区不在此类上） */
  transition: transform .12s, box-shadow .12s, border-color .12s, opacity .12s;
}
/* 内层裁剪盒：定高卡的内容在此统一裁剪（费用徽标在盒外，不受影响）；
   风味文本为弹性受害者（先收缩自裁），卡名/类型/描述/标记永不挤压 */
.sc-card-in { height: 100%; overflow: hidden; display: flex; flex-direction: column; gap: clamp(4px, .7vw, 6px); }
.sc-card-in .sc-card-name, .sc-card-in .sc-card-type, .sc-card-in .sc-card-desc, .sc-card-in .sc-card-flags { flex: none; }
.sc-card-in .sc-card-flavor { flex: 0 1 auto; min-height: 0; }
.sc-card--click { cursor: pointer; touch-action: manipulation; }
@media (hover:hover) and (pointer:fine) {
  .sc-card--click:hover {
    border-color: var(--phos);
    box-shadow: 0 6px 18px rgba(0, 0, 0, .4), 0 0 10px rgba(143, 211, 160, .18);
  }
}
.sc-card--off { opacity: .45; filter: saturate(.55); }
.sc-card--compact {
  width: var(--card-cw); height: calc(var(--card-cw) * 1.325);
  padding: clamp(9px, 1.2vw, 12px) clamp(7px, 1vw, 10px) clamp(6px, .9vw, 8px);
}
.sc-card--compact .sc-card-name { font-size: var(--fs-sm); }
.sc-card--compact .sc-card-desc { font-size: var(--fs-xs); -webkit-line-clamp: 4; line-clamp: 4; }
.sc-card-cost {
  --cost-s: clamp(24px, 2.6vw, 30px);
  position: absolute; top: calc(var(--cost-s) / -3); left: calc(var(--cost-s) / -3);
  width: var(--cost-s); height: var(--cost-s);
  border-radius: 50%; background: var(--panel2); border: 1px solid var(--cyan);
  color: var(--cyan); display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: var(--fs-md);
  box-shadow: 0 0 8px rgba(127, 196, 189, .18);
}
.sc-card-name {
  font-size: var(--fs-lg); letter-spacing: .04em; padding-left: clamp(10px, 1.2vw, 12px);
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden;
}
.sc-card-plus { color: var(--amber); margin-left: 2px; }
.sc-card-type { display: flex; justify-content: space-between; min-width: 0; overflow: hidden; font-size: var(--fs-xs); color: var(--dim); }
.sc-card-type > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sc-card--attack .sc-card-type { color: var(--red); }
.sc-card--skill .sc-card-type { color: var(--phos); }
.sc-card--power .sc-card-type { color: var(--amber); }
.sc-card-rarity { color: var(--dim); flex: none; white-space: nowrap; }
.sc-card-desc {
  font-size: var(--fs-sm); line-height: 1.55; overflow: hidden;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; line-clamp: 4;
}
.sc-card-flavor {
  /* 底部锚定改回普通流式：定高内盒溢出时 margin-top:auto 会变负值，风味块被吸上去压住卡名
     （"冲"字被虚线拦腰的实锤根因）；改由 .sc-card-in 底缘统一裁剪 */
  padding-top: clamp(4px, .7vw, 6px);
  border-top: 1px dashed var(--line);
  font-size: var(--fs-xs); color: var(--dim); line-height: 1.5;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden;
}
.sc-card-flags { display: flex; gap: 4px; flex-wrap: wrap; }
.sc-card-flag {
  font-size: var(--fs-xs); color: var(--cyan);
  border: 1px solid var(--line); border-radius: 3px; padding: 0 4px;
}
/* 稀有度边框（只用设计变量） */
.sc-card--r-starter { border-style: dashed; border-color: var(--dim); }
.sc-card--r-common { border-color: var(--line); }
.sc-card--r-uncommon { border-color: var(--cyan); box-shadow: 0 0 8px rgba(127, 196, 189, .10); }
.sc-card--r-rare { border-color: var(--amber); box-shadow: 0 0 10px rgba(221, 176, 105, .14); }
/* 已升级高亮 */
.sc-card--up { border-color: var(--amber); }
.sc-card--up .sc-card-name { color: var(--amber); }
.sc-card--up .sc-card-cost { border-color: var(--amber); color: var(--amber); }

/* ============ 血条 / 状态 / 热量 / 能量 ============ */
.sc-hpbar {
  position: relative; height: clamp(13px, 2vw, 16px); min-width: clamp(72px, 14vw, 120px);
  background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
}
.sc-hpbar-fill { height: 100%; background: var(--red); opacity: .7; transition: width .3s; }
.sc-hpbar-text {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: var(--fs-xs); letter-spacing: .05em;
}
.sc-pips { display: flex; gap: 4px; flex-wrap: wrap; }
.sc-pip {
  display: inline-flex; align-items: center; gap: 3px;
  background: var(--panel2); border: 1px solid var(--line); border-radius: 4px;
  padding: 1px clamp(4px, .7vw, 6px) 1px 3px; font-size: var(--fs-xs); cursor: default;
}
.sc-pip .sc-ic { width: clamp(11px, 1.2vw, 13px); height: clamp(11px, 1.2vw, 13px); }
.sc-pip--shield { color: var(--cyan); }
.sc-pip--st-poison { color: var(--phos); }
.sc-pip--st-regen { color: var(--phos); }
.sc-pip--st-weak { color: var(--dim); }
.sc-pip--st-vulnerable { color: var(--red); }
.sc-pip--st-strength { color: var(--amber); }
.sc-pip--st-dexterity { color: var(--cyan); }
.sc-pip--st-thorns { color: var(--amber); }
.sc-pip--st-cache { color: var(--cyan); }
.sc-pip--st-charge { color: var(--amber); }
.sc-heatbar { display: flex; align-items: center; gap: clamp(4px, .7vw, 6px); }
.sc-heatbar .sc-ic { width: clamp(13px, 1.4vw, 15px); height: clamp(13px, 1.4vw, 15px); color: var(--amber); }
.sc-heat-segs { display: flex; gap: 2px; }
.sc-heat-seg {
  width: clamp(7px, .9vw, 8px); height: clamp(12px, 1.5vw, 14px); border-radius: 2px;
  background: var(--panel2); border: 1px solid var(--line);
}
.sc-heat-seg--on { background: var(--amber); border-color: var(--amber); }
.sc-heatbar--hot .sc-ic { color: var(--red); }
.sc-heatbar--hot .sc-heat-seg--on { background: var(--red); border-color: var(--red); }
.sc-heatbar--hot .sc-heat-n { color: var(--red); }
.sc-heat-n { font-size: var(--fs-xs); color: var(--dim); }
.sc-orb {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  width: clamp(44px, 6vw, 58px); height: clamp(44px, 6vw, 58px); border-radius: 50%;
  background: var(--panel2); border: 2px solid var(--cyan);
  box-shadow: 0 0 12px rgba(127, 196, 189, .15);
}
.sc-orb .sc-ic { width: clamp(10px, 1.1vw, 12px); height: clamp(10px, 1.1vw, 12px); color: var(--cyan); margin-bottom: 1px; }
.sc-orb-n { font-size: var(--fs-lg); font-weight: 700; line-height: 1.05; }
.sc-orb-max { font-size: var(--fs-xs); color: var(--dim); font-weight: 400; margin-left: 1px; }

/* ============ 遗物 / 牌堆按钮 / 提示 / 模态 ============ */
.sc-relic {
  display: inline-flex; align-items: center; justify-content: center;
  width: clamp(26px, 3.4vw, 30px); height: clamp(26px, 3.4vw, 30px); border-radius: 6px;
  background: var(--panel2); border: 1px solid var(--line); color: var(--amber);
  cursor: default; flex: none;
}
.sc-relic .sc-ic { width: clamp(15px, 2vw, 18px); height: clamp(15px, 2vw, 18px); }
.sc-relic--uncommon { border-color: var(--cyan); color: var(--cyan); }
.sc-relic--rare { border-color: var(--amber); }
.sc-relic--boss { border-color: var(--red); color: var(--red); }
.sc-pilebtn {
  display: inline-flex; align-items: center; gap: clamp(4px, .7vw, 6px);
  font-family: var(--font); font-size: var(--fs-sm);
  background: var(--panel2); color: var(--ink);
  border: 1px solid var(--line); border-radius: 6px;
  padding: clamp(4px, .8vw, 6px) clamp(7px, 1.2vw, 10px); cursor: pointer;
  touch-action: manipulation;
  transition: border-color .15s, color .15s;
}
@media (hover:hover) and (pointer:fine) {
  .sc-pilebtn:hover { border-color: var(--phos); color: var(--phos); }
}
.sc-pilebtn-count {
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 0 clamp(4px, .7vw, 6px); font-size: var(--fs-xs); color: var(--dim);
}
.sc-tooltip {
  position: fixed; z-index: 9500; max-width: min(260px, 80vw);
  background: var(--panel2); border: 1px solid var(--phos); border-radius: 6px;
  padding: clamp(6px, 1vw, 8px) clamp(8px, 1.2vw, 10px);
  font-size: var(--fs-sm); line-height: 1.5;
  pointer-events: none; box-shadow: 0 8px 24px rgba(0, 0, 0, .5);
}
.sc-modal-back {
  position: fixed; inset: 0; z-index: 9000;
  background: rgba(0, 0, 0, .62);
  display: flex; align-items: center; justify-content: center;
  padding: clamp(8px, 2vw, 24px);
}
.sc-modal {
  position: relative; width: min(900px, calc(100vw - 24px)); max-height: min(85vh, 920px);
  position: relative; width: min(900px, calc(100vw - 24px)); max-height: min(85dvh, 920px);
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  display: flex; flex-direction: column;
}
.sc-modal-x {
  position: absolute; top: clamp(6px, 1vw, 8px); right: clamp(8px, 1.4vw, 12px); z-index: 1;
  background: none; border: none; color: var(--dim);
  font-size: var(--fs-lg); font-family: var(--font); cursor: pointer;
  touch-action: manipulation;
}
@media (hover:hover) and (pointer:fine) {
  .sc-modal-x:hover { color: var(--red); }
}
.sc-modal-body { padding: clamp(12px, 2vw, 20px); overflow-y: auto; overscroll-behavior: contain; }
.sc-modal-title { font-size: var(--fs-lg); color: var(--phos); letter-spacing: .1em; margin-bottom: clamp(10px, 1.5vw, 14px); }

/* ============ 屏通用 ============ */
.sc-screen-head { display: flex; align-items: center; gap: var(--gap); margin: 6px 0 4px; }
.sc-screen-head .sc-ic { width: clamp(20px, 2.4vw, 24px); height: clamp(20px, 2.4vw, 24px); color: var(--phos); }
.sc-screen-title { font-size: var(--fs-xl); letter-spacing: .12em; }
.sc-screen-sub { color: var(--dim); font-size: var(--fs-sm); margin-top: 2px; }
.sc-card-row {
  display: flex; gap: var(--gap); row-gap: calc(var(--gap) + 6px);
  flex-wrap: wrap; justify-content: center; padding-top: 12px; padding-left: 12px;
  max-width: 100%;
}
.sc-skip-btn { margin-top: 4px; }
.sc-stats { display: flex; gap: var(--gap); flex-wrap: wrap; justify-content: center; max-width: 100%; margin: clamp(6px, 1.2vw, 10px) 0 clamp(4px, .8vw, 6px); }
.sc-stats-item {
  min-width: clamp(72px, 20vw, 96px); text-align: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: clamp(7px, 1.2vw, 10px) clamp(10px, 1.6vw, 14px);
}
.sc-stats-v { font-size: var(--fs-lg); color: var(--phos); }
.sc-stats-k { font-size: var(--fs-xs); color: var(--dim); margin-top: 2px; }

/* ============ 标题屏 ============ */
.sc-title-shell {
  min-height: calc(100vh - 2 * var(--shell-pad));
  min-height: calc(100dvh - 2 * var(--shell-pad));
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center; gap: var(--gap);
}
.sc-title-logo-ic {
  width: clamp(48px, 8vw, 72px); height: clamp(48px, 8vw, 72px); color: var(--phos);
  filter: drop-shadow(0 0 12px rgba(143, 211, 160, .35));
}
.sc-glitch {
  position: relative; margin: 0;
  font-size: var(--fs-title); font-weight: 700; letter-spacing: .2em; color: var(--ink);
}
.sc-glitch::before, .sc-glitch::after {
  content: attr(data-text); position: absolute; inset: 0; overflow: hidden; pointer-events: none;
}
.sc-glitch::before { color: var(--cyan); opacity: .6; animation: sc-glitch-a 2.6s infinite steps(1); }
.sc-glitch::after { color: var(--red); opacity: .6; animation: sc-glitch-b 3.4s infinite steps(1); }
@keyframes sc-glitch-a {
  0%, 88% { clip-path: inset(0 0 100% 0); transform: none; }
  89% { clip-path: inset(12% 0 62% 0); transform: translate(-3px, 1px); }
  92% { clip-path: inset(58% 0 18% 0); transform: translate(3px, -1px); }
  95% { clip-path: inset(30% 0 44% 0); transform: translate(-2px, 0); }
  98%, 100% { clip-path: inset(0 0 100% 0); transform: none; }
}
@keyframes sc-glitch-b {
  0%, 82% { clip-path: inset(0 0 100% 0); transform: none; }
  84% { clip-path: inset(66% 0 8% 0); transform: translate(3px, 0); }
  89% { clip-path: inset(8% 0 72% 0); transform: translate(-3px, 1px); }
  94%, 100% { clip-path: inset(0 0 100% 0); transform: none; }
}
.sc-title-sub {
  color: var(--dim);
  letter-spacing: clamp(.2em, 1vw, .55em); text-indent: clamp(.2em, 1vw, .55em);
  font-size: var(--fs-sm);
}
.sc-title-intro { color: var(--dim); max-width: min(480px, 90vw); margin: 4px 0 0; line-height: 1.8; }
.sc-title-menu { display: flex; gap: var(--gap); margin-top: clamp(10px, 1.5vw, 14px); flex-wrap: wrap; justify-content: center; max-width: 100%; }
.sc-title-btn {
  min-width: clamp(140px, 40vw, 190px);
  padding: clamp(8px, 1.4vw, 12px) clamp(14px, 2.4vw, 22px);
  font-size: var(--fs-lg); letter-spacing: .08em;
}
.sc-title-meta {
  display: flex; gap: clamp(16px, 3vw, 30px); flex-wrap: wrap; justify-content: center;
  max-width: 100%;
  margin-top: clamp(16px, 3vw, 28px); padding-top: clamp(10px, 1.8vw, 16px);
  border-top: 1px solid var(--line);
}
.sc-title-meta-item { text-align: center; }
.sc-title-meta-v { color: var(--phos); font-size: var(--fs-lg); }
.sc-title-meta-k { color: var(--dim); font-size: var(--fs-xs); margin-top: 2px; }
/* 构建版本戳：标题屏/游戏菜单底部小字（--fs-xs 档、--dim 色、居中、半透明不抢戏） */
.sc-buildstamp {
  margin-top: clamp(8px, 1.4vw, 14px);
  color: var(--dim); font-size: var(--fs-xs); text-align: center; opacity: .6;
}

/* ============ 奖励屏 ============ */
.sc-reward-gold {
  display: flex; align-items: center; gap: var(--gap);
  font-size: var(--fs-xl); color: var(--amber); letter-spacing: .05em;
}
.sc-reward-gold .sc-ic { width: clamp(18px, 2.2vw, 22px); height: clamp(18px, 2.2vw, 22px); }
.sc-reward-hint { font-size: var(--fs-sm); }
.sc-reward-relic {
  display: flex; align-items: center; gap: var(--gap);
  background: var(--panel); border: 1px solid var(--amber); border-radius: 8px;
  padding: clamp(8px, 1.2vw, 10px) clamp(12px, 2vw, 18px);
}
.sc-reward-relic-d { font-size: var(--fs-sm); margin-top: 2px; }

/* ============ 商店屏 ============ */
.sc-shop-top { display: flex; align-items: center; gap: var(--gap); flex-wrap: wrap; margin: clamp(6px, 1vw, 8px) 0 clamp(4px, .7vw, 6px); }
.sc-shop-gold {
  display: flex; align-items: center; gap: clamp(4px, .7vw, 6px); margin-right: auto;
  font-size: var(--fs-lg); color: var(--amber);
}
.sc-shop-section { margin: clamp(10px, 1.8vw, 16px) 0; }
.sc-shop-section-t {
  color: var(--dim); font-size: var(--fs-sm); letter-spacing: .2em;
  border-bottom: 1px solid var(--line);
  padding-bottom: clamp(4px, .7vw, 6px); margin-bottom: clamp(10px, 1.5vw, 14px);
}
.sc-shop-grid {
  display: flex; gap: var(--gap); row-gap: calc(var(--gap) + 6px);
  flex-wrap: wrap; justify-content: center; padding-top: 12px; padding-left: 12px;
  max-width: 100%;
}
.sc-shop-item { display: flex; flex-direction: column; align-items: center; gap: var(--gap); }
.sc-shop-item--sold .sc-card { opacity: .3; filter: saturate(.4); }
.sc-shop-buy {
  min-width: clamp(96px, 22vw, 124px); font-size: var(--fs-sm);
  padding: clamp(4px, .8vw, 6px) clamp(8px, 1.2vw, 10px);
  touch-action: manipulation;
}
.sc-shop-buy--sale { border-color: var(--amber); color: var(--amber); }
.sc-shop-relics { display: flex; gap: clamp(10px, 1.8vw, 18px); flex-wrap: wrap; justify-content: center; max-width: 100%; }
.sc-shop-relic {
  display: flex; flex-direction: column; align-items: center; gap: var(--gap);
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: clamp(10px, 1.5vw, 14px) clamp(12px, 2vw, 18px);
  user-select: none; -webkit-user-select: none;
}
.sc-shop-relic .sc-relic { width: clamp(32px, 4vw, 40px); height: clamp(32px, 4vw, 40px); }
.sc-shop-relic .sc-relic .sc-ic { width: clamp(20px, 3vw, 24px); height: clamp(20px, 3vw, 24px); }
.sc-shop-relic-n { font-size: var(--fs-sm); }
.sc-shop-service {
  display: flex; align-items: center; gap: var(--gap); flex-wrap: wrap;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: clamp(8px, 1.4vw, 12px) clamp(10px, 1.8vw, 16px);
}
.sc-shop-service .sc-ic { width: clamp(18px, 2.2vw, 22px); height: clamp(18px, 2.2vw, 22px); }
.sc-shop-service-d { margin-right: auto; font-size: var(--fs-sm); }
.sc-shop-service-hint { font-size: var(--fs-xs); color: var(--dim); }

/* ============ 休息屏 ============ */
.sc-rest-opts { display: flex; gap: clamp(10px, 2vw, 20px); flex-wrap: wrap; justify-content: center; max-width: 100%; }
.sc-rest-opt {
  width: clamp(220px, 60vw, 320px); text-align: center; cursor: pointer;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: clamp(16px, 3vw, 26px) clamp(14px, 2.4vw, 20px);
  touch-action: manipulation;
  transition: transform .15s, border-color .15s, box-shadow .15s;
}
@media (hover:hover) and (pointer:fine) {
  .sc-rest-opt:hover {
    border-color: var(--phos); transform: translateY(-3px);
    box-shadow: 0 6px 18px rgba(0, 0, 0, .35), 0 0 10px rgba(143, 211, 160, .15);
  }
}
.sc-rest-opt .sc-ic { width: clamp(26px, 4vw, 34px); height: clamp(26px, 4vw, 34px); color: var(--phos); }
.sc-rest-opt-t { font-size: var(--fs-lg); margin: clamp(8px, 1.4vw, 12px) 0 clamp(4px, .7vw, 6px); letter-spacing: .06em; }
.sc-rest-opt-d { color: var(--dim); font-size: var(--fs-sm); }
.sc-rest-done { display: flex; flex-direction: column; align-items: center; gap: clamp(10px, 2vw, 18px); }
.sc-rest-result {
  border-left: 2px solid var(--phos);
  padding: clamp(8px, 1.2vw, 10px) clamp(10px, 1.8vw, 16px);
  color: var(--phos); line-height: 1.7;
}

/* ============ 事件屏 ============ */
.sc-event-panel {
  max-width: 720px; margin: clamp(12px, 2.5vw, 24px) auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: clamp(16px, 3vw, 28px);
}
.sc-event-ic { width: clamp(32px, 5vw, 44px); height: clamp(32px, 5vw, 44px); color: var(--amber); }
.sc-event-title { font-size: var(--fs-xl); letter-spacing: .1em; margin: clamp(6px, 1.2vw, 10px) 0; }
.sc-event-text { line-height: 1.9; margin-bottom: clamp(14px, 2.4vw, 22px); }
.sc-event-choices { display: flex; flex-direction: column; gap: var(--gap); }
.sc-event-choice {
  display: flex; flex-direction: column; gap: 4px; text-align: left;
  font-family: var(--font); font-size: var(--fs-md);
  background: var(--panel2); color: var(--ink);
  border: 1px solid var(--line); border-radius: 8px;
  padding: clamp(8px, 1.4vw, 12px) clamp(10px, 1.8vw, 16px); cursor: pointer;
  touch-action: manipulation;
  transition: border-color .15s, color .15s;
}
@media (hover:hover) and (pointer:fine) {
  .sc-event-choice:hover:not(:disabled) { border-color: var(--phos); color: var(--phos); }
}
.sc-event-choice:disabled { opacity: .45; cursor: not-allowed; }
.sc-event-choice-req { font-size: var(--fs-xs); color: var(--red); }
.sc-event-result {
  border-left: 2px solid var(--phos);
  padding: clamp(8px, 1.2vw, 10px) clamp(10px, 1.8vw, 16px);
  color: var(--phos); line-height: 1.8; margin-bottom: clamp(12px, 2vw, 18px);
}

/* ============ 宝箱屏 ============ */
.sc-treasure-panel {
  display: flex; flex-direction: column; align-items: center; gap: var(--gap);
  background: var(--panel); border: 1px solid var(--amber); border-radius: 10px;
  padding: clamp(20px, 4vw, 34px) clamp(18px, 5vw, 46px); text-align: center;
}
.sc-treasure-logo { width: clamp(40px, 6vw, 56px); height: clamp(40px, 6vw, 56px); color: var(--amber); }
.sc-treasure-name { font-size: var(--fs-lg); letter-spacing: .08em; }
.sc-treasure-desc { font-size: var(--fs-sm); max-width: min(380px, 90vw); line-height: 1.7; }
.sc-treasure-btn { margin-top: clamp(6px, 1.2vw, 10px); }

/* ============ 失败 / 胜利屏 ============ */
.sc-end-shell {
  min-height: calc(100vh - 2 * var(--shell-pad));
  min-height: calc(100dvh - 2 * var(--shell-pad));
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: var(--gap); text-align: center;
}
.sc-end-logo { width: clamp(44px, 7vw, 64px); height: clamp(44px, 7vw, 64px); }
.sc-end-title { font-size: var(--fs-xl); letter-spacing: .22em; margin: 0; }
.sc-end-flavor { color: var(--dim); max-width: min(440px, 90vw); line-height: 1.8; }
.sc-end-btn { margin-top: clamp(8px, 1.4vw, 12px); min-width: clamp(140px, 40vw, 180px); }

/* ============ 卡组查看 ============ */
.sc-deck-filters { display: flex; gap: var(--gap); margin-bottom: clamp(10px, 1.5vw, 14px); flex-wrap: wrap; max-width: 100%; }
.sc-deck-filter {
  font-family: var(--font); font-size: var(--fs-sm);
  background: var(--panel2); color: var(--dim);
  border: 1px solid var(--line); border-radius: 5px;
  padding: clamp(3px, .6vw, 4px) clamp(10px, 1.5vw, 14px); cursor: pointer;
  touch-action: manipulation;
  transition: border-color .15s, color .15s;
}
@media (hover:hover) and (pointer:fine) {
  .sc-deck-filter:hover { border-color: var(--phos); color: var(--phos); }
}
.sc-deck-filter--on { border-color: var(--phos); color: var(--phos); }
.sc-deck-grid {
  display: flex; gap: var(--gap); row-gap: calc(var(--gap) + 6px);
  flex-wrap: wrap; justify-content: center; padding-top: 12px; padding-left: 12px;
  max-width: 100%;
}
.sc-deck-empty { padding: clamp(12px, 2.4vw, 20px); }

/* ============ 响应式断点（§3） ============ */
/* (max-height:700px) 矮屏压缩：垂直节奏收紧一档、卡宽降一档，
   奖励屏（标题+金币+卡排+跳过钮）在 500px 高度内完整可见；事件/商店/休息屏同享压缩红利 */
@media (max-height: 700px) {
  .sc-shell {
    --card-w: clamp(112px, 11vw, 140px);
    padding: clamp(6px, 1.2vh, 8px) 0 clamp(12px, 2vh, 16px);
  }
  .sc-center { gap: clamp(6px, 1.2vh, 10px); }
  .sc-screen-head { margin: 0 0 2px; }
  .sc-screen-head .sc-ic { width: clamp(16px, 2vw, 20px); height: clamp(16px, 2vw, 20px); }
  .sc-screen-title { font-size: clamp(18px, 2.2vw + 12px, 26px); }
  .sc-card-row, .sc-shop-grid, .sc-deck-grid { padding-top: 10px; }
  .sc-skip-btn { margin-top: 0; }
  .sc-reward-gold { font-size: clamp(18px, 2vw + 12px, 24px); }
  .sc-reward-relic { padding: clamp(6px, 1vw, 8px) clamp(10px, 1.6vw, 14px); }
  .sc-event-panel { margin: clamp(6px, 1.2vh, 10px) auto; padding: clamp(12px, 2vh, 20px); }
  .sc-event-text { margin-bottom: clamp(10px, 1.8vh, 16px); }
  .sc-rest-opt { padding: clamp(12px, 2vh, 18px) clamp(12px, 2vw, 16px); }
  .sc-shop-section { margin: clamp(6px, 1.2vh, 10px) 0; }
  .sc-shop-section-t { margin-bottom: clamp(6px, 1vh, 10px); }
  /* modal 垂直节奏同步收紧（卡组/删卡/升级弹窗在矮屏多露一行） */
  .sc-modal-body { padding: clamp(10px, 1.6vh, 14px); }
  .sc-modal-title { margin-bottom: clamp(8px, 1.2vh, 10px); }
  .sc-deck-filters { margin-bottom: clamp(8px, 1.2vh, 10px); }
}
/* 矮屏（≤800px 高）卡组弹窗：可视高度对齐到整卡行，静止时裁切线落在卡间隙 */
@media (max-height: 800px) {
  .sc-modal-body:has(.sc-deck-grid) {
    max-height: calc(2.65 * var(--card-cw) + var(--gap) + 132px);
  }
}
/* 手机 ≤720px：遗物栏整行横滑、图例横滑 */
@media (max-width: 720px) {
  .sc-topbar-relics {
    flex-basis: 100%; flex-wrap: nowrap; overflow-x: auto; overscroll-behavior-x: contain;
    padding-bottom: 2px; scrollbar-width: thin;
  }
  .sc-legend {
    flex-wrap: wrap; justify-content: center; row-gap: 2px;
  }
}
/* 宽屏 ≥1600px：地图 SVG 上限放宽 */
@media (min-width: 1600px) {
  .sc-map-svg { width: min(100%, 680px); }
}
/* 触屏：可点目标 ≥42px（§2.6） */
@media (pointer: coarse) {
  .sc-topbar-btn, .sc-pilebtn, .sc-shop-buy, .sc-deck-filter {
    min-height: clamp(42px, 6vw, 46px);
  }
  .sc-event-choice { min-height: clamp(42px, 6vw, 46px); justify-content: center; }
  .sc-modal-x {
    width: clamp(42px, 6vw, 46px); height: clamp(42px, 6vw, 46px);
    display: inline-flex; align-items: center; justify-content: center;
  }
}

/* ============ 感想反馈 ============ */
/* 结算屏双按钮行：wrap 居中，与标题菜单同一节奏 */
.sc-end-actions { display: flex; gap: var(--gap); flex-wrap: wrap; justify-content: center; max-width: 100%; }
/* modal 内：桌面三题横排三列，共用 --gap */
.sc-fb-ctx { font-size: var(--fs-xs); color: var(--dim); margin-bottom: clamp(10px, 1.5vw, 14px); }
.sc-fb-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); margin-bottom: clamp(10px, 1.5vw, 14px); }
.sc-fb-label { font-size: var(--fs-sm); color: var(--dim); margin-bottom: clamp(4px, .7vw, 6px); }
.sc-fb-ta {
  width: 100%; box-sizing: border-box; resize: vertical;
  font-family: var(--font); font-size: max(16px, var(--fs-sm)); line-height: 1.6; /* ≥16px 防 iOS 聚焦自动放大 */
  background: var(--panel2); color: var(--ink);
  border: 1px solid var(--line); border-radius: 6px;
  padding: clamp(6px, 1vw, 8px) clamp(8px, 1.2vw, 10px);
}
.sc-fb-ta:focus { outline: none; border-color: var(--phos); }
/* 剪贴板降级框：默认隐藏，复制失败时显示并全选 */
.sc-fb-fallback { display: none; margin-bottom: clamp(10px, 1.5vw, 14px); }
.sc-fb-fallback--on { display: block; }
.sc-fb-actions { display: flex; align-items: center; gap: var(--gap); flex-wrap: wrap; }
.sc-fb-copy { flex: none; }
.sc-fb-hint { font-size: var(--fs-xs); color: var(--dim); }
/* 手机 ≤720px：三题纵排、复制按钮全宽 */
@media (max-width: 720px) {
  .sc-fb-grid { grid-template-columns: 1fr; }
  .sc-fb-copy { width: 100%; }
}

/* ============ 设置 modal（EXPAND.md §4） ============ */
.sc-set-row {
  display: flex; align-items: center; gap: var(--gap); flex-wrap: wrap;
  padding: clamp(8px, 1.4vw, 12px) 0;
  border-bottom: 1px dashed var(--line);
}
.sc-set-row:last-child { border-bottom: none; }
.sc-set-label { margin-right: auto; font-size: var(--fs-sm); }
.sc-set-label-d { font-size: var(--fs-xs); color: var(--dim); margin-top: 2px; }
.sc-set-range {
  flex: 1 1 clamp(130px, 36vw, 200px); min-width: clamp(110px, 28vw, 150px);
  accent-color: var(--phos); touch-action: manipulation;
}
.sc-set-val { min-width: 3.2em; text-align: right; color: var(--phos); font-size: var(--fs-sm); }
.sc-set-toggle { min-width: clamp(64px, 18vw, 84px); flex: none; }
.sc-set-toggle--on { border-color: var(--phos); color: var(--phos); }
@media (pointer: coarse) { .sc-set-toggle { min-height: 42px; } }

/* ============ 成就屏 ============ */
.sc-ach-count { color: var(--dim); font-size: var(--fs-sm); }
.sc-ach-list { display: flex; flex-direction: column; gap: var(--gap); width: 100%; max-width: 720px; }
.sc-ach-item {
  display: flex; align-items: center; gap: var(--gap); text-align: left;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: clamp(8px, 1.4vw, 12px) clamp(10px, 1.8vw, 16px);
}
.sc-ach-item .sc-ic { width: clamp(20px, 2.6vw, 26px); height: clamp(20px, 2.6vw, 26px); color: var(--amber); flex: none; }
.sc-ach-item--dim { opacity: .45; filter: saturate(.5); }
.sc-ach-item--dim .sc-ic { color: var(--dim); }
.sc-ach-main { min-width: 0; }
.sc-ach-name { font-size: var(--fs-md); }
.sc-ach-desc { font-size: var(--fs-xs); color: var(--dim); margin-top: 2px; }
.sc-ach-loading { text-align: center; padding: clamp(12px, 2.4vw, 20px); }

/* ============ 图鉴屏 ============ */
.sc-gal-counts {
  display: flex; flex-direction: column; gap: 2px; align-items: center;
  color: var(--dim); font-size: var(--fs-sm);
}
.sc-gal-tabs { display: flex; gap: var(--gap); justify-content: center; flex-wrap: wrap; max-width: 100%; }
.sc-gal-grid { display: flex; gap: var(--gap); flex-wrap: wrap; justify-content: center; max-width: 100%; }
.sc-gal-item {
  width: clamp(96px, 26vw, 132px);
  display: flex; flex-direction: column; align-items: center; gap: clamp(4px, .7vw, 6px);
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: clamp(10px, 1.6vw, 14px) clamp(6px, 1vw, 10px); text-align: center;
}
.sc-gal-item .sc-ic { width: clamp(24px, 4vw, 32px); height: clamp(24px, 4vw, 32px); color: var(--phos); }
.sc-gal-item--dim { border-style: dashed; }
.sc-gal-item--dim .sc-ic { color: var(--dim); opacity: .55; }
.sc-gal-name { font-size: var(--fs-sm); }
.sc-gal-item--dim .sc-gal-name { color: var(--dim); }
.sc-gal-sub { font-size: var(--fs-xs); color: var(--dim); }

/* ============ 角色选择屏 ============ */
.sc-char-row { display: flex; gap: clamp(12px, 2.4vw, 24px); flex-wrap: wrap; justify-content: center; max-width: 100%; }
.sc-char-card {
  width: clamp(240px, 72vw, 320px); cursor: pointer; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: clamp(6px, 1vw, 10px);
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: clamp(16px, 3vw, 26px) clamp(14px, 2.4vw, 20px);
  touch-action: manipulation; user-select: none; -webkit-user-select: none;
  transition: transform .15s, border-color .15s, box-shadow .15s;
}
@media (hover:hover) and (pointer:fine) {
  .sc-char-card:hover {
    border-color: var(--phos); transform: translateY(-3px);
    box-shadow: 0 6px 18px rgba(0, 0, 0, .35), 0 0 10px rgba(143, 211, 160, .15);
  }
}
.sc-char-ic { width: clamp(34px, 5vw, 44px); height: clamp(34px, 5vw, 44px); color: var(--phos); }
.sc-char-name { font-size: var(--fs-lg); letter-spacing: .08em; }
.sc-char-epithet { color: var(--amber); font-size: var(--fs-sm); }
.sc-char-desc { color: var(--dim); font-size: var(--fs-sm); line-height: 1.7; }
.sc-char-passive {
  margin-top: auto; width: 100%;
  border-top: 1px dashed var(--line); padding-top: clamp(6px, 1vw, 8px);
  font-size: var(--fs-xs); color: var(--cyan); line-height: 1.6;
}
/* 手机窄屏（≤480px）：四角色时代纵向压缩一档——卡距/卡内距/图标/行高各收，
   390×844 首屏四卡（含蠕虫母体）完整可见，不再顶破视口底边 */
@media (max-width: 480px) {
  .sc-char-row { gap: clamp(8px, 1.6vw, 10px); }
  .sc-char-card {
    padding: clamp(10px, 2vw, 14px) clamp(12px, 2.2vw, 16px);
    gap: clamp(4px, .8vw, 6px);
  }
  .sc-char-ic { width: clamp(24px, 4vw, 30px); height: clamp(24px, 4vw, 30px); }
  .sc-char-desc { line-height: 1.5; }
  .sc-char-passive { padding-top: clamp(4px, .8vw, 6px); line-height: 1.5; }
}

/* ============ 结算屏新解锁成就 ============ */
.sc-unlock {
  background: var(--panel); border: 1px solid var(--amber); border-radius: 8px;
  padding: clamp(8px, 1.4vw, 12px) clamp(12px, 2vw, 18px);
  max-width: 100%;
}
.sc-unlock-t { color: var(--amber); font-size: var(--fs-sm); letter-spacing: .1em; margin-bottom: clamp(6px, 1vw, 8px); }
.sc-unlock-row { display: flex; gap: var(--gap); flex-wrap: wrap; justify-content: center; }
.sc-unlock-chip {
  display: inline-flex; align-items: center; gap: clamp(4px, .7vw, 6px);
  font-size: var(--fs-sm); color: var(--phos);
  border: 1px solid var(--line); border-radius: 2em;
  padding: 2px clamp(8px, 1.4vw, 12px);
}
.sc-unlock-chip .sc-ic { width: clamp(13px, 1.4vw, 15px); height: clamp(13px, 1.4vw, 15px); }

/* ============ 每日挑战屏（DAILY.md §5，挑战界面代理增量） ============ */
.sc-daily-shell {
  display: flex; flex-direction: column; align-items: center;
  gap: clamp(12px, 2vw, 18px);
}
.sc-daily-card, .sc-daily-section {
  width: 100%; max-width: 720px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: clamp(14px, 2.4vw, 22px) clamp(14px, 2.6vw, 24px);
}
/* 今日挑战卡 */
.sc-daily-card {
  display: flex; flex-direction: column; align-items: center;
  gap: clamp(8px, 1.4vw, 12px); text-align: center;
  border-color: var(--phos);
  box-shadow: 0 0 12px rgba(143, 211, 160, .10);
}
.sc-daily-date { font-size: var(--fs-lg); letter-spacing: .1em; }
.sc-daily-badge {
  font-size: var(--fs-sm); color: var(--amber); letter-spacing: .18em; text-indent: .18em;
  border: 1px dashed var(--amber); border-radius: 4px;
  padding: 2px clamp(8px, 1.4vw, 12px);
}
.sc-daily-record { font-size: var(--fs-sm); color: var(--dim); line-height: 1.8; }
.sc-daily-best { color: var(--phos); }
.sc-daily-start { min-width: clamp(150px, 42vw, 200px); }
/* 分区标题（与同种子赛 / 自定义种子共用） */
.sc-daily-section-t {
  display: flex; align-items: center; gap: clamp(6px, 1vw, 8px);
  color: var(--dim); font-size: var(--fs-sm); letter-spacing: .2em;
  border-bottom: 1px solid var(--line);
  padding-bottom: clamp(4px, .7vw, 6px); margin-bottom: clamp(10px, 1.5vw, 14px);
}
.sc-daily-section-t .sc-ic { width: clamp(15px, 1.8vw, 18px); height: clamp(15px, 1.8vw, 18px); color: var(--phos); }
/* 输入行：输入框弹性占满，按钮不缩，窄屏自然换行 */
.sc-daily-row { display: flex; gap: var(--gap); flex-wrap: wrap; }
.sc-daily-input {
  flex: 1 1 clamp(170px, 46vw, 280px); min-width: 0;
  font-family: var(--font); font-size: max(16px, var(--fs-sm)); /* ≥16px 防 iOS 聚焦自动放大 */
  background: var(--panel2); color: var(--ink);
  border: 1px solid var(--line); border-radius: 6px;
  padding: clamp(6px, 1vw, 8px) clamp(8px, 1.2vw, 10px);
}
.sc-daily-input:focus { outline: none; border-color: var(--phos); }
.sc-daily-input::placeholder { color: var(--dim); }
.sc-daily-btn { flex: none; }
/* 行内提示（错误态变红）；banner toast 之外的可读兜底 */
.sc-daily-hint { font-size: var(--fs-xs); color: var(--dim); margin-top: clamp(6px, 1vw, 8px); min-height: 1.2em; }
.sc-daily-hint--err { color: var(--red); }
/* 对手榜 */
.sc-daily-rivals { display: flex; flex-direction: column; gap: var(--gap); margin-top: clamp(10px, 1.5vw, 14px); }
.sc-daily-rivals-t { font-size: var(--fs-xs); color: var(--dim); letter-spacing: .1em; }
.sc-daily-rival {
  display: flex; align-items: center; gap: var(--gap); flex-wrap: wrap;
  background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
  padding: clamp(7px, 1.2vw, 10px) clamp(10px, 1.6vw, 14px);
}
.sc-daily-rival > .sc-ic-wrap .sc-ic { width: clamp(16px, 2vw, 20px); height: clamp(16px, 2vw, 20px); color: var(--red); }
.sc-daily-rival-main { margin-right: auto; min-width: 0; }
.sc-daily-rival-score { font-size: var(--fs-lg); color: var(--phos); }
.sc-daily-rival-meta { font-size: var(--fs-xs); color: var(--dim); margin-top: 1px; }
.sc-daily-rival-btn { flex: none; font-size: var(--fs-sm); }
.sc-daily-empty { text-align: center; padding: clamp(10px, 2vw, 16px); font-size: var(--fs-sm); }
/* 覆盖确认 modal 正文 */
.sc-daily-confirm-t { font-size: var(--fs-sm); line-height: 1.8; margin-bottom: clamp(12px, 2vw, 18px); }
/* 触屏：可点目标 ≥42px（§2.6） */
@media (pointer: coarse) {
  .sc-daily-input { min-height: 42px; }
  .sc-daily-rival-btn { min-height: 42px; }
}
/* 矮屏压缩（≤800px 高）：垂直节奏收紧一档——覆盖 1366×768，保证挑战屏整屏无截断 */
@media (max-height: 800px) {
  .sc-daily-shell { gap: clamp(8px, 1.4vh, 14px); }
  .sc-daily-card, .sc-daily-section { padding: clamp(10px, 2vh, 16px) clamp(12px, 2vw, 18px); }
  .sc-daily-card { gap: clamp(6px, 1vh, 10px); }
  .sc-daily-record { line-height: 1.55; }
  .sc-daily-section-t { padding-bottom: clamp(3px, .6vh, 5px); margin-bottom: clamp(6px, 1.2vh, 10px); }
  .sc-daily-rivals { margin-top: clamp(6px, 1.2vh, 10px); }
  .sc-daily-empty { padding: clamp(4px, 1vh, 10px); }
}

/* ============ 全局游戏菜单（gameMenuButton/openGameMenu，组件代理交付） ============ */
/* 齿轮小按钮：磷绿描边低调风（常态半透、hover/聚焦提亮），固定小尺寸 inline-flex 不占布局 */
.sc-gmenu-btn {
  display: inline-flex; align-items: center; justify-content: center; flex: none;
  width: clamp(30px, 3.4vw, 34px); height: clamp(30px, 3.4vw, 34px);
  background: var(--panel2); color: var(--dim);
  border: 1px solid var(--phos); border-radius: 6px; opacity: .75;
  cursor: pointer; touch-action: manipulation;
  transition: color .15s, opacity .15s, box-shadow .15s;
}
.sc-gmenu-btn .sc-ic { width: clamp(15px, 1.8vw, 17px); height: clamp(15px, 1.8vw, 17px); }
@media (hover:hover) and (pointer:fine) {
  .sc-gmenu-btn:hover { color: var(--phos); opacity: 1; box-shadow: 0 0 8px rgba(143, 211, 160, .18); }
}
.sc-gmenu-btn:focus-visible { outline: 1px solid var(--phos); outline-offset: 2px; opacity: 1; }
/* 菜单本体：竖排按钮列，宽度钳制不顶满 modal */
.sc-gmenu-list {
  display: flex; flex-direction: column; gap: var(--gap);
  min-width: min(280px, 72vw);
}
.sc-gmenu-item {
  font-family: var(--font); font-size: var(--fs-md); letter-spacing: .08em; text-align: center;
  background: var(--panel2); color: var(--ink);
  border: 1px solid var(--line); border-radius: 6px;
  padding: clamp(8px, 1.2vw, 10px) clamp(12px, 2vw, 18px);
  cursor: pointer; touch-action: manipulation;
  transition: border-color .15s, color .15s, box-shadow .15s;
}
@media (hover:hover) and (pointer:fine) {
  .sc-gmenu-item:hover { border-color: var(--phos); color: var(--phos); box-shadow: 0 0 10px rgba(143, 211, 160, .15); }
  .sc-gmenu-item--danger:hover { border-color: var(--red); color: var(--red); box-shadow: none; }
}
/* 返回标题二次确认 */
.sc-gmenu-confirm-t { font-size: var(--fs-sm); line-height: 1.8; margin-bottom: clamp(12px, 2vw, 18px); }
.sc-gmenu-actions { display: flex; gap: var(--gap); flex-wrap: wrap; justify-content: center; }
/* 菜单内版本戳：复用 .sc-buildstamp，仅收一点上间距贴合按钮列 */
