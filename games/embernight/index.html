.chain-chip.lit{ color:${PAL.ABYSS}; background:${PAL.EMBER_CORE}; border-color:${PAL.GOLD};
  box-shadow:0 0 14px ${PAL.EMBER_MID}; opacity:1; }
@keyframes chipPop{ 0%{ transform:scale(.6);} 60%{ transform:scale(1.25);} 100%{ transform:scale(1);} }
.evoburst{ position:fixed; inset:-20%; mix-blend-mode:screen; opacity:0;
  background:radial-gradient(closest-side,${PAL.HERO_HI},${PAL.EMBER_CORE} 35%,${PAL.EMBER_EDGE} 60%,transparent 72%);
  animation:evoGo .7s ease-out forwards; will-change:transform,opacity; }
@keyframes evoGo{ 0%{ transform:scale(.15); opacity:.95; } 100%{ transform:scale(1.4); opacity:0; } }
.dawnwarm{ position:fixed; inset:-25%; mix-blend-mode:screen; opacity:0;
  background:radial-gradient(closest-side,${PAL.HERO_HI},${PAL.EMBER_CORE} 30%,${PAL.GOLD} 55%,transparent 75%);
  animation:dawnGo 1.6s ease-in-out forwards; will-change:transform,opacity; }
@keyframes dawnGo{ 0%{ transform:scale(.5); opacity:0; } 30%{ opacity:.85; } 100%{ transform:scale(1.25); opacity:0; } }
.jburn{ border-radius:2px; }`;
  document.head.appendChild(style);
  const layer = document.createElement('div');
  layer.className = 'dmg-layer';
  document.body.appendChild(layer);
  const w2s = (x, y) => (renderer && renderer.worldToScreen) ? renderer.worldToScreen(x, y) : { x, y };
  const restartAnim = el => { el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; };

  /* ---------------- 伤害数字:池化 ≤40,easeOutBack 放大,同目标 0.3s 聚合 ---------------- */
  const numPool = [], numActive = [], aggMap = new Map();
  for (let i = 0; i < BUDGET.numbers; i++) {
    const el = document.createElement('div');
    el.className = 'jnum'; el.style.display = 'none';
    el.addEventListener('animationend', () => { if (el._entry) releaseNum(el._entry); });
    layer.appendChild(el); numPool.push(el);
  }
  function releaseNum(en) {
    const i = numActive.indexOf(en); if (i >= 0) numActive.splice(i, 1);
    if (en.target && aggMap.get(en.target) === en) aggMap.delete(en.target);
    en.el.style.display = 'none'; en.el._entry = null; numPool.push(en.el);
  }
  function spawnNumber(x, y, amount, target) {
    const now = performance.now() / 1000;
    const agg = target && aggMap.get(target);
    if (agg && now < agg.until) { // 同目标 0.3s 聚合:累加并重弹
      agg.amount += amount; agg.until = now + P.kill.number.mergeWindow;
      agg.el.textContent = agg.amount; restartAnim(agg.el);
      return;
    }
    if (!numPool.length) { if (numActive.length) releaseNum(numActive[0]); else return; } // 池满复用最旧
    const el = numPool.pop(), pt = w2s(x, y);
    const en = { el, amount, until: now + P.kill.number.mergeWindow, target, bornAt: now };
    el._entry = en;
    el.textContent = amount;
    el.style.left = pt.x + 'px'; el.style.top = pt.y + 'px';
    el.style.display = 'block'; restartAnim(el);
    numActive.push(en);
    if (target) aggMap.set(target, en);
  }

  /* ---------------- 粒子 burst / 光柱 / 飞出条(DOM,transform/opacity) ---------------- */
  let aliveParts = 0;
  function spawnParticles(x, y, count) {
    const K = P.kill.particles, pt = w2s(x, y);
    const n = Math.min(count, BUDGET.particles - aliveParts); // 高密度降级
    for (let i = 0; i < n; i++) {
      const el = document.createElement('div');
      el.className = 'jpart';
      const ang = Math.random() * Math.PI * 2;
      const sp = K.speed[0] + Math.random() * (K.speed[1] - K.speed[0]);
      const life = K.life * (0.7 + Math.random() * 0.6);
      const size = K.size[0] + Math.random() * (K.size[1] - K.size[0]);
      el.style.cssText = `left:${pt.x}px;top:${pt.y}px;width:${size}px;height:${size}px;`
        + `--dx:${F(Math.cos(ang) * sp * life, 1)}px;--dy:${F(Math.sin(ang) * sp * life, 1)}px;`
        + `background:${K.colors[(Math.random() * K.colors.length) | 0]};animation-duration:${F(life, 2)}s;`;
      aliveParts++;
      el.addEventListener('animationend', () => { el.remove(); aliveParts--; }, { once: true });
      layer.appendChild(el);
    }
  }
  function spawnBeam() {
    const el = document.createElement('div');
    el.className = 'jbeam';
    el.addEventListener('animationend', () => el.remove(), { once: true });
    layer.appendChild(el);
  }
  function spawnStreak(card) {
    const el = document.createElement('div');
    el.className = 'jstreak';
    el.textContent = (card && card.icon) || '';   // 卡图标同飞,读得懂"它进了构筑栏"
    el.addEventListener('animationend', () => el.remove(), { once: true });
    layer.appendChild(el);
  }

  /* ---------------- enemy.fx* 瞬态(闪白/squash/击退),juice rAF 内逐帧推进 ---------------- */
  const fxMap = new Map(); // enemy -> {flash, sT, kvx, kvy};条目均 ≤0.3s 自然消亡,Map 不泄漏
  const fxOf = e => { let f = fxMap.get(e); if (!f) { f = { flash: 0, sT: Infinity, kvx: 0, kvy: 0 }; fxMap.set(e, f); } return f; };

  /* ---------------- trauma 震屏:trauma²×Perlin 位移 + ±2° 旋转,线性衰减 ---------------- */
  let traumaVal = 0, vignette = 0, shakeT = 0;
  const nX = makePerlin(11), nY = makePerlin(37), nR = makePerlin(83);

  /* ---------------- 事件→反馈映射(全部走 bus 订阅) ---------------- */
  function onEnemyHit(p) {
    const e = p.enemy; if (!e) return;
    const f = fxOf(e);
    f.flash = 1; e.fxFlash = 1;              // 受击闪白 80ms(gameplay 用 lit 覆盖消费)
    f.sT = 0;                                // squash 重启
    const ang = (p.dir !== undefined) ? p.dir : Math.random() * Math.PI * 2; // 契约载荷无方向,缺省随机
    f.kvx = Math.cos(ang) * P.enemyHit.kickDist * P.enemyHit.kickDecay; // 指数衰减位移,总行程≈kickDist
    f.kvy = Math.sin(ang) * P.enemyHit.kickDist * P.enemyHit.kickDecay;
  }
  const tierOf = e => (e && e.boss) ? 'boss' : (e && e.elite) ? 'elite' : 'normal';
  let lastNormalStop = -9;   // 普通击杀顿帧共享窗口计时(Time.now 游戏时间口径,与 magnetUntil 等一致)
  function onKill(p) {
    const t = tierOf(p.enemy), K = P.kill;
    spawnParticles(p.x, p.y, K.particles[t]);
    const amount = Math.round(p.overkill || (p.enemy && p.enemy.lastDmg) || 0); // kill 载荷无 dmg,取 overkill/lastDmg
    if (amount > 0) spawnNumber(p.x, p.y, amount, p.enemy);
    if (t === 'normal') {
      if (Time.now - lastNormalStop >= K.normalShareMs / 1000) {   // 普通击杀:250ms 窗口共享一次顿帧
        lastNormalStop = Time.now;
        Time.hitStop(K.hitstop[t]);
      }                                                     // 窗内击杀:粒子/数字照常,仅免顿帧
    } else {
      Time.hitStop(K.hitstop[t]);                           // 精英/Boss:完整分级顿帧(节奏高潮)
      if (t === 'boss') { Time.slowMo(K.bossSlowMo.sec, K.bossSlowMo.scale); Input.rumble(0.8, 0.3, 220); }
      else Input.rumble(0.5, 0.3, 100);                     // 精英击杀:轻震(普通击杀不震,防刷屏)
    }
    if (p.enemy) fxMap.delete(p.enemy);
  }
  function onPlayerHit() {
    vignette = P.playerHit.vignette;                  // 红脉冲,rAF 内回落写 renderer
    api.trauma.add(P.playerHit.trauma);
    api.playerFlashUntil = Time.now + P.playerHit.iframeBlinkSec; // i-frame 闪烁标志,gameplay 拉取
    if (audio && audio.play) audio.play('hit');
    Input.rumble(1.0, 0.5, 160);                          // 受击:强震短促
  }
  function onLevelUp() {
    Time.slowMo(P.levelUp.slowMoSec, P.levelUp.slowMoScale); // 慢动作 0.1×/300ms
    spawnBeam();                                             // 升级光柱(additive 观感竖条)
    api.magnetUntil = Time.now + P.levelUp.magnetSec;        // 全屏磁吸标志,gameplay 拉取
    Input.rumble(0.2, 0.5, 80);                              // 升级:弱强轻震(正反馈)
  }
  function onDraftPick({ card } = {}) {
    spawnStreak(card);                                       // 选中卡图标飞回构筑栏(替代金色飞条)
    if (audio && audio.play) audio.play('ui');
  }
  bus.on('enemyHit', onEnemyHit);
  bus.on('kill', onKill);
  bus.on('playerHit', onPlayerHit);
  bus.on('levelUp', onLevelUp);
  bus.on('draftPick', onDraftPick);

  /* ---------------- Phase 3:连锁跳数 / 黎明演出 / bossDown ---------------- */
  // 径向全屏爆发(evolution / dawn 共用;additive 观感 = mix-blend screen)
  function spawnRadialBurst(cls, sec) {
    const el = document.createElement('div');
    el.className = cls;
    el.style.animationDuration = sec + 's';
    el.addEventListener('animationend', () => el.remove(), { once: true });
    layer.appendChild(el);
  }
  // 燃尽粒子(黎明用):向上飘的余烬,共享 aliveParts 预算(高密度降级)
  function spawnBurn(x, y, count) {
    const pt = w2s(x, y);
    const n = Math.min(count, BUDGET.particles - aliveParts);
    for (let i = 0; i < n; i++) {
      const el = document.createElement('div');
      el.className = 'jpart jburn';
      const life = 0.55 + Math.random() * 0.45;
      const size = 2.5 + Math.random() * 4;
      el.style.cssText = `left:${pt.x}px;top:${pt.y}px;width:${size}px;height:${size}px;`
        + `--dx:${F((Math.random() - 0.5) * 60, 1)}px;--dy:${F(-40 - Math.random() * 90, 1)}px;`
        + `background:${P.kill.particles.colors[(Math.random() * 3) | 0]};animation-duration:${F(life, 2)}s;`;
      aliveParts++;
      el.addEventListener('animationend', () => { el.remove(); aliveParts--; }, { once: true });
      layer.appendChild(el);
    }
  }
  /* chainPop(items, onDone):图标 120ms 序逐个高亮弹跳(scale easeOutBack),每跳 play('pickup')
   * (audio 内部连捡爬升 0.8s 窗 >> 120ms 间隔,自然形成上行音阶),末跳 play('evolution')
   * Shepard 扫频 + 全屏 radial 爆发。items:[{icon,role?}] 或字符串数组;重入取消上一场。 */
  let chainTimer = null;
  function chainPop(items, onDone) {
    const list = (items || []).map(it => typeof it === 'string' ? { icon: it } : it);
    if (chainTimer) { clearTimeout(chainTimer); chainTimer = null; }
    const old = layer.querySelector('.chain-layer'); if (old) old.remove();
    if (!list.length) { // 无图标:仍保证演化音 + 爆发 + 回调
      if (audio && audio.play) audio.play('evolution');
      spawnRadialBurst('evoburst', 0.7);
      if (onDone) onDone();
      return;
    }
    const row = document.createElement('div');
    row.className = 'chain-layer';
    const chips = list.map(it => {
      const c = document.createElement('div');
      c.className = 'chain-chip' + (it.role === 'passive' ? ' pas' : '');
      c.textContent = it.icon || '·';
      row.appendChild(c); return c;
    });
    layer.appendChild(row);
    let i = 0;
    const step = () => {
      if (i < chips.length) {
        chips[i].classList.add('pop', 'lit');
        if (audio && audio.play) audio.play('pickup');   // 每跳:五声爬升 +1 步
        i++; chainTimer = setTimeout(step, P.chainPop.interval * 1000);
      } else {
        if (audio && audio.play) audio.play('evolution'); // 末跳:Shepard,与链时序兼容(即触发)
        spawnRadialBurst('evoburst', 0.7);
        chainTimer = setTimeout(() => {
          row.classList.add('out');
          chainTimer = setTimeout(() => { row.remove(); chainTimer = null; }, 260);
          if (onDone) onDone();
        }, P.chainPop.tailSec * 1000);
      }
    };
    step();
  }
  /* dawnSequence(onDone):victory 黎明演出。slowMo 0.3×/1.2s → setColorScript(1) 终局金
   * + 全屏暖光爆发 + 场上敌人 0.8s 逐批燃尽(只读经 api.getEnemies,粒子表现,不直接杀)→ onDone。
   * 演出中重入忽略(bus 自动触发与集成者直调不双演)。 */
  let dawnPlaying = false;
  function dawnSequence(onDone) {
    if (dawnPlaying) return;
    dawnPlaying = true;
    const D = P.dawn;
    Time.slowMo(D.slowMoSec, D.slowMoScale);
    if (renderer && renderer.setColorScript) renderer.setColorScript(1); // 接口已确认存在(renderer.js:520)
    spawnRadialBurst('dawnwarm', D.warmSec);
    const src = api.getEnemies ? api.getEnemies() : null; // 只读钩子,集成者注入
    const list = [];
    if (src) {
      if (typeof src.each === 'function') src.each(e => { if (e && !e.dead) list.push(e); });
      else if (Array.isArray(src)) for (const e of src) if (e && !e.dead) list.push(e);
    }
    const per = Math.max(2, Math.min(6, Math.floor(160 / Math.max(1, list.length))));
    for (let b = 0; b < D.batches; b++)
      setTimeout(() => {
        for (let j = b; j < list.length; j += D.batches) spawnBurn(list[j].x, list[j].y, per);
      }, (D.burnSec / D.batches) * b * 1000);
    setTimeout(() => { dawnPlaying = false; if (onDone) onDone(); }, D.slowMoSec * 1000 + 150);
  }
  bus.on('evolution', () => { // 自动连锁跳数;图标经 api.getBuildIcons 拉取,缺省通用三枚
    const icons = api.getBuildIcons ? (api.getBuildIcons() || []) : [];
    chainPop(icons.length ? icons : [{ icon: '火' }, { icon: '芯' }, { icon: '烛' }]);
  });
  bus.on('victory', () => dawnSequence());
  bus.on('snufferDone', () => {                  // E8 熄灯台成功:小顿帧 0.08s + trauma 0.25 + 烛焰拔高 0.4s
    Time.hitStop(0.08);
    api.trauma.add(0.25);
    api.flameBoostUntil = Time.now + 0.4;
    Input.rumble(0.5, 0.3, 120);                 // 点亮震感(对齐精英档)
  });
  bus.on('snufferFail', () => {                  // E8 熄灯台失败:烛光骤暗脉冲 0.4s(经 renderer 脉冲口)
    if (renderer && renderer.pulseCandle) renderer.pulseCandle(0.4);
  });
  bus.on('bossDown', () => {
    Time.hitStop(P.bossDown.hitstop);              // 大顿帧 0.15s
    api.trauma.add(P.bossDown.trauma);             // trauma 0.6
    if (audio && audio.play) audio.play('burst');  // 大爆音
    Input.rumble(1.0, 1.0, 400);                   // Boss 倒下:双马达满档长震(全场最高档)
  });

  /* ---------------- 自建 rAF:每帧写 renderer.shake / 暗角回落 / enemy.fx* ----------------
   * 工厂时装配,注册先于主循环 rAF → 同帧内先于 renderer.begin 写完,无滞后。 */
  // 暂停门(审计③):pauseToggle 期间冻结敌人 fx(击退位移/squash/tint 不再推,敌人不漂移);
  // trauma 震屏与受击暗角继续衰减归零(画面安定),DOM 伤害数字 CSS 动画允许跑完。
  let juicePaused = false;
  bus.on('pauseToggle', ({ paused }) => { juicePaused = !!paused; });
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    shakeT += dt;
    // trauma 线性衰减,位移=trauma²×Perlin
    traumaVal = Math.max(0, traumaVal - BUDGET.shake.decay * dt);
    const mag = traumaVal * traumaVal * (reducedMotion ? 0.3 : 1);
    const S = BUDGET.shake;
    if (renderer) {
      renderer.shake = renderer.shake || { x: 0, y: 0, rot: 0 };
      renderer.shake.x = nX(shakeT * S.freq) * S.maxShift * mag;
      renderer.shake.y = nY(shakeT * S.freq) * S.maxShift * mag;
      renderer.shake.rot = nR(shakeT * S.freq) * S.maxRotRad * mag; // 弧度,±2°
      if (vignette > 0) {
        vignette = Math.max(0, vignette - P.playerHit.vignetteDecay * dt);
        if (renderer.setVignettePulse) renderer.setVignettePulse(vignette);
      }
    }
    // enemy.fx* 推进(暂停时冻结)
    if (!juicePaused) for (const [e, f] of fxMap) {
      if (f.flash > 0) { f.flash = Math.max(0, f.flash - dt / P.enemyHit.flashSec); e.fxFlash = f.flash; }
      if (f.sT < P.enemyHit.squashSec) {
        f.sT += dt;
        const p01 = Math.min(1, f.sT / P.enemyHit.squashSec);
        const q = 1 - easeOutBack(p01); // 1→0,带回弹过冲
        e.fxScaleX = 1 + (P.enemyHit.squashX - 1) * q;
        e.fxScaleY = 1 - (1 - P.enemyHit.squashY) * q;
        if (p01 >= 1) { e.fxScaleX = 1; e.fxScaleY = 1; }
      }
      if (f.kvx || f.kvy) {
        e.x += f.kvx * dt; e.y += f.kvy * dt;
        const d = Math.exp(-P.enemyHit.kickDecay * dt);
        f.kvx *= d; f.kvy *= d;
        if (Math.abs(f.kvx) < 1 && Math.abs(f.kvy) < 1) { f.kvx = f.kvy = 0; }
      }
      if (!f.flash && f.sT >= P.enemyHit.squashSec && !f.kvx && !f.kvy) fxMap.delete(e);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  const api = {
    onKill(x, y, opts = {}) { onKill({ x, y, enemy: opts.enemy, overkill: opts.overkill }); }, // 仅供不便走 bus 的场合
    chainPop,           // Phase 3:连锁跳数(items:[{icon,role?}]|字符串数组, onDone)
    dawnSequence,       // Phase 3:黎明演出(bus 'victory' 自动触发;重入忽略)
    getEnemies: null,   // 【集成补充】注入:() => 敌人列表(Pool 或数组,只读),dawnSequence 燃尽用
    getBuildIcons: null,// 【集成补充】注入:() => 构筑图标数组,evolution 自动连锁跳数用
    trauma: {
      add(v) { traumaVal = Math.min(BUDGET.shake.maxTrauma, traumaVal + Math.max(0, v || 0)); },
      get value() { return traumaVal; },
    },
    budget: BUDGET,

      if (magnetAllT > 0) magnetAllT -= dt;
      if (warmT > 0) warmT -= dt;              // 「余温」倒计时(独立计时态,到期自然失效)
      // 分焰 debuff(契约 P4 §3):逐帧读 timeline.snuffer;判空防御——getter 缺失整段 no-op
      const _sn = director && director.timeline ? director.timeline.snuffer : null;
      if (_sn && _sn.channeling) { snuffLightF = 1 - (_sn.debuffLight !== undefined ? _sn.debuffLight : 0.40);   // director 字段是「削减量」(0.40=-40%)
                                   snuffDmgF  = 1 - (_sn.debuffDmg   !== undefined ? _sn.debuffDmg   : 0.15); }  // → 乘区 ×0.60/×0.85(契约 P4 §3)
      else { snuffLightF = 1; snuffDmgF = 1; }                                        // channeling 消失即复原
      if (phase === 'run' && xp >= xpNext) doLevelUp();
    }
    draw();
  }

  // ===================== 玩家 =====================
  function stepPlayer(dt) {
    const mv = Input.state.move;
    const sp = CFG.player.speed * mods.speed;
    player.x += mv.x * sp * dt;
    player.y += mv.y * sp * dt;
    if (mv.x !== 0 || mv.y !== 0) player.rot = Math.atan2(mv.y, mv.x);
    if (player.iframes > 0) player.iframes -= dt;
  }
  // 演示波自走:缓慢漫游(契约 v3 §5 玩家 AI 自走)
  function stepPlayerDemo(dt) {
    const t = Time.now;
    const tx = Math.cos(t * 0.35) * 220, ty = Math.sin(t * 0.5) * 150;
    const dx = tx - player.x, dy = ty - player.y;
    const d = Math.hypot(dx, dy) || 1;
    const sp = CFG.player.speed * 0.5;
    player.x += dx / d * sp * dt;
    player.y += dy / d * sp * dt;
    player.rot = Math.atan2(dy, dx);
  }

  function damagePlayer(dmg) {
    if (phase !== 'run' || player.iframes > 0) return;
    const d = Math.max(1, dmg * mods.takenMult - mods.armor);   // 代价·灼 ×1.15;蜡甲 -2/级,最低 1
    player.hp -= d;
    player.iframes = CFG.player.iframes;
    bus.emit('playerHit', { dmg: d });
    if (player.hp <= 0) { player.hp = 0; doGameOver(); }
  }

  // ===================== 武器系统(槽 ≤4,每武器独立 cd) =====================
  function stepWeapons(dt) {
    for (const [id, w] of wInst) {
      const S = weaponStats(id), m = dmgOf(id);
      if (id === 'firebolt') stepFirebolt(w, S, m, dt);
      else if (id === 'emberring') stepRing(w, S, m, dt);
      else if (id === 'waxtear') stepWaxtear(w, S, m, dt);
      else if (id === 'starfall') stepStarfall(w, S, m, dt);
      else if (id === 'wickbloom') stepFirebolt(w, S, m, dt, PAL.GOLD, true);   // 灯花弹 GOLD #D9A441+加大拖尾(店主 22:59 裁定改表现形式)
    }
  }
  function nearestEnemy(maxD) {
    let best = null, bd = maxD ? maxD * maxD : Infinity;   // BUG 修复:dd 为平方距离,阈值同平方(旧代码 560 实为 23.7 半径,烛泪哑火)
    enemies.each(e => {
      if (e.dead) return;
      const dd = (e.x - player.x) ** 2 + (e.y - player.y) ** 2;
      if (dd < bd) { bd = dd; best = e; }
    });
    return best;
  }
  // 火矢:直线弹道,count 扇发,pierce 穿透;重燃 meteor:穿透一切+余烬灼烧
  function stepFirebolt(w, S, m, dt, tint, flower) {
    w.cd -= dt;
    if (w.cd > 0) return;
    const t = nearestEnemy();
    if (!t) { w.cd = CFG.arrow.retry; return; }
    const base = Math.atan2(t.y - player.y, t.x - player.x);
    const n = S.count || 1;
    for (let i = 0; i < n; i++) {
      const a = base + (i - (n - 1) / 2) * CFG.arrow.spread;
      shots.spawn({ x: player.x, y: player.y,
                    vx: Math.cos(a) * CFG.arrow.speed, vy: Math.sin(a) * CFG.arrow.speed,
                    r: CFG.arrow.r, dmg: S.dmg * m, life: CFG.arrow.life,
                    frame: 'proj', tint: tint || PAL.EMBER_MID, additive: true, hostile: false,
                    pierce: 1 + (S.pierce || 0), burn: S.burnDps || 0, flower: !!flower });
    }
    w.cd = S.cd;
  }
  // 焰环:火珠环绕玩家,接触伤害(每敌 0.5s 冷却);重燃 corona:火珠+2、半径+40
  // P4 反馈:火珠带短拖尾(w.trails 环形队列)
  function stepRing(w, S, m, dt) {
    w.ang += S.spin * dt;
    const n = S.orbs;
    const radius = S.radius * CFG.ring.radiusScale;   // 有效半径(覆盖贴脸抱敌层)
    w.orbs.length = 0;
    w.trails = w.trails || [];
    for (let i = 0; i < n; i++) {
      const a = w.ang + i * (Math.PI * 2 / n);
      const ox = player.x + Math.cos(a) * radius, oy = player.y + Math.sin(a) * radius;
      w.orbs.push({ x: ox, y: oy });
      const tr = w.trails[i] || (w.trails[i] = []);
      tr.push({ x: ox, y: oy });
      if (tr.length > 5) tr.shift();
      hash.queryCircle(ox, oy, CFG.ring.orbR + 24, e => {   // hash 为上一帧重建,容忍 1 帧误差
        if (e.dead || (e.ringT && Time.now - e.ringT < CFG.ring.hitCd)) return;
        const rr = CFG.ring.orbR + e.r;
        if ((e.x - ox) ** 2 + (e.y - oy) ** 2 > rr * rr) return;
        e.ringT = Time.now;
        hitEnemy(e, S.dmg * m, {});
      });
    }
    // 贴脸焰域:扑心堆积敌(轨道擦不到)持续灼烧
    hash.queryCircle(player.x, player.y, CFG.ring.auraR + 24, e => {
      if (e.dead || (e.ringT && Time.now - e.ringT < CFG.ring.hitCd)) return;
      const rr = CFG.ring.auraR + e.r;
      if ((e.x - player.x) ** 2 + (e.y - player.y) ** 2 > rr * rr) return;
      e.ringT = Time.now;
      hitEnemy(e, S.dmg * m * CFG.ring.auraDmg, {});
    });
    if (w.trails.length > n) w.trails.length = n;
  }
  // 烛泪:落点成潭(持续伤害区);重燃 molten:潭径+45、slow 0.45 锁足
  function stepWaxtear(w, S, m, dt) {
    w.cd -= dt;
    if (w.cd > 0) return;
    const t = nearestEnemy(560);
    if (!t) { w.cd = CFG.arrow.retry; return; }
    zones.spawn({ x: t.x, y: t.y, r: S.poolR, dps: S.dmg * m, slow: S.slow || 0,
                  until: Time.now + S.poolSec, bob: rng.range(0, 6) });
    w.cd = S.cd;
  }
  // 星芒:周期径向多目标打击 + 射向每个目标的可见光束(P4 反馈重做);重燃 nova:范围+80、击退 220
  function stepStarfall(w, S, m, dt) {
    w.cd -= dt;
    if (w.beams) for (let i = w.beams.length - 1; i >= 0; i--) {
      w.beams[i].t -= dt;
      if (w.beams[i].t <= 0) w.beams.splice(i, 1);
    }
    if (w.cd > 0) return;
    const max = S.targets || CFG.star.targetsDefault, r2 = S.range * S.range;
    const list = [];
    enemies.each(e => {
      if (e.dead) return;
      const dd = (e.x - player.x) ** 2 + (e.y - player.y) ** 2;
      if (dd <= r2) list.push([dd, e]);
    });
    list.sort((a, b) => a[0] - b[0]);
    if (!list.length) { w.cd = CFG.arrow.retry; return; }
    w.beams = w.beams || [];
    for (let i = 0; i < Math.min(max, list.length); i++) {
      const e = list[i][1];
      const d = Math.sqrt(list[i][0]) || 1;
      hitEnemy(e, S.dmg * m, S.knockback ? { kx: (e.x - player.x) / d * S.knockback,
                                             ky: (e.y - player.y) / d * S.knockback } : {});
      w.beams.push({ x1: player.x, y1: player.y, x2: e.x, y2: e.y, t: 0.16, max: 0.16 });  // 光矛一瞬
    }
    w.flashT = CFG.star.flashSec;              // 径向闪光(draw 消费)
    w.cd = S.cd;
  }

  function hitEnemy(e, dmg, opts) {
    if (e.dead) return;
    dmg *= burnHuntF(e);                         // 焚膏(D-035):灼烧中承伤加成;点火首击 burnT=0 不吃,伤害数字显示加成后值
    e.hp -= dmg;
    dmgDealt += dmg;                           // A 区审计:伤害量累计(台架断言用)
    e.lastDmg = dmg;                           // juice 伤害数字取 overkill||lastDmg
    if (opts.burn) { e.burnDps = opts.burn; e.burnT = 2; }
    if (opts.kx) { e.kbx = (e.kbx || 0) + opts.kx; e.kby = (e.kby || 0) + opts.ky; }
    bus.emit('enemyHit', { x: e.x, y: e.y, dmg, enemy: e });
    if (e.hp <= 0) killEnemy(e);
  }
  function killEnemy(e) {
    if (e.dead) return;
    e.dead = true;
    kills++;
    bus.emit('kill', { x: e.x, y: e.y, enemy: e, overkill: -e.hp });
  }

  // ===================== 统一弹道(friendly 火矢 / hostile 敌弹) =====================
  function stepShots(dt) {
    _dead.length = 0;
    shots.each(b => {
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      if (b.life <= 0) { _dead.push(b); return; }
      if (b.hostile) {                           // 敌弹 → 打玩家(无敌帧+蜡甲)
        const rr = b.r + player.r;
        if ((b.x - player.x) ** 2 + (b.y - player.y) ** 2 <= rr * rr) {
          _dead.push(b);
          damagePlayer(b.dmg);
        }
        return;
      }
      // 玩家弹 → 空间哈希粗筛+精判。穿透命中记忆(D-027 折中):
      // pierce 只对「新接触的敌人」扣减;同一敌人重叠期间伤害连帧照旧(meteor 对 Boss 倍率不动);
      // 记忆挂子弹侧(b.hits),弹亡即弃,敌侧零长期键(bossWhich 事故教训)。
      if (!b.hits) b.hits = new Set();
      let hit = null;                              // 先找新敌
      hash.queryCircle(b.x, b.y, b.r + 24, o => {
        if (hit || o.dead || b.hits.has(o)) return;
        const rr = b.r + o.r;
        if ((o.x - b.x) ** 2 + (o.y - b.y) ** 2 <= rr * rr) hit = o;
      });
      if (hit) {                                   // 新敌:全结算 + 记记忆 + 扣 pierce
        hitEnemy(hit, b.dmg, { burn: b.burn });
        b.hits.add(hit);
        b.pierce = (b.pierce || 1) - 1;
        if (b.pierce <= 0) _dead.push(b);
        return;
      }
      hash.queryCircle(b.x, b.y, b.r + 24, o => {  // 无新敌:旧敌重叠,只结算伤害(连帧照旧)
        if (hit || o.dead) return;
        const rr = b.r + o.r;
        if ((o.x - b.x) ** 2 + (o.y - b.y) ** 2 <= rr * rr) hit = o;
      });
      if (hit) hitEnemy(hit, b.dmg, { burn: b.burn });
    });
    for (const b of _dead) shots.despawn(b);
  }

  // ===================== 敌人(AI 全走 enemies.js;hostile 弹经 ctx.spawnBullet) =====================
  const aiCtx = { player: null, spawnBullet: null, summon: null, bus: null, Time: null, rng: null };
  function stepEnemies(dt) {
    enemies.each(e => { if (!e.dead) e.slowF = 0; });           // 减速标记由烛泪潭写入
    enemies.each(e => {
      if (e.dead) return;
      const sdt = e.slowF ? dt * (1 - e.slowF) : dt;            // molten 锁足
      e.ai.update(e, aiCtx, sdt);
      if (e.kbx || e.kby) {                                     // 击退(nova/通用),指数衰减
        e.x += e.kbx * dt; e.y += e.kby * dt;
        const d = Math.exp(-8 * dt);
        e.kbx *= d; e.kby *= d;
        if (Math.abs(e.kbx) < 1 && Math.abs(e.kby) < 1) e.kbx = e.kby = 0;
      }
      if (e.burnT > 0) {                                        // meteor 余烬灼烧(静默持续伤害)
        e.burnT -= dt;
        { const dd = e.burnDps * dt; e.hp -= dd; dmgDealt += dd; }
      }
    });
    if (player.iframes <= 0) {                                  // 玩家接触判定
      hash.queryCircle(player.x, player.y, player.r + 24, o => {
        if (o.dead || player.iframes > 0) return;
        const rr = player.r + o.r;
        if ((o.x - player.x) ** 2 + (o.y - player.y) ** 2 <= rr * rr) damagePlayer(o.dmg);
      });
    }
    // 青烛光环(契约 v3 §5):光圈内的敌人 auraDps×dt 灼烧(静默,sweep 统一结算)
    if (auraDpsCur > 0) {
      enemies.each(e => {
        if (e.dead) return;
        const rr = lightRCur + e.r * 0.5;
        if ((e.x - player.x) ** 2 + (e.y - player.y) ** 2 <= rr * rr) { const dd = auraDpsCur * dt * burnHuntF(e); e.hp -= dd; dmgDealt += dd; }   // 焚膏(D-035):灼烧中光环承伤加成
      });
    }
  }
  function stepZones(dt) {
    _dead.length = 0;
    zones.each(z => {
      if (Time.now >= z.until) { _dead.push(z); return; }
      hash.queryCircle(z.x, z.y, z.r + 24, e => {               // 持续伤害(静默,sweep 统一结算)
        if (e.dead) return;
        const rr = z.r + e.r * 0.5;
        if ((e.x - z.x) ** 2 + (e.y - z.y) ** 2 > rr * rr) return;
        { const dd = z.dps * dt * burnHuntF(e); e.hp -= dd; dmgDealt += dd; }   // 焚膏(D-035):灼烧中潭域承伤加成
        if (z.slow) e.slowF = Math.max(e.slowF || 0, z.slow);
      });
    });
    for (const z of _dead) zones.despawn(z);
  }

  // ===================== 星火 / 拾取实体(宝箱/火种) =====================
  function stepGems(dt) {
    _dead.length = 0;
    gems.each(g => {
      const dx = player.x - g.x, dy = player.y - g.y;
      const d = Math.hypot(dx, dy) || 1;
      if (!g.mag && (d < mods.pickup * (warmT > 0 ? 1.15 : 1) || magnetAllT > 0)) { g.mag = true; g.mt = 0; }   // 「余温」拾取 +15%(构筑外加区)
      if (g.mag) {
        g.mt += dt;
        const sp = CFG.magnet.base + CFG.magnet.boost * Ease.easeInQuad(Math.min(g.mt / CFG.magnet.ramp, 1));
        g.x += dx / d * sp * dt;
        g.y += dy / d * sp * dt;
        if (d < player.r + 8) {
          _dead.push(g);
          xp += g.val || 1;
          bus.emit('xpPickup', { x: g.x, y: g.y });   // audio tick+爬升(契约 §7)
        }
      }
    });
    for (const g of _dead) gems.despawn(g);
  }
  function stepPickups(dt) {
    _dead.length = 0;
    pickups.each(p => {
      p.bob += dt;
      if (p.kind === 'flame') {                        // 火种全程磁吸(稀有且关键,不让人漏)
        const dx = player.x - p.x, dy = player.y - p.y;
        const d = Math.hypot(dx, dy) || 1;
        if (d > player.r + p.r) { p.x += dx / d * 260 * dt; p.y += dy / d * 260 * dt; }
      }
      const rr = player.r + p.r;
      if ((p.x - player.x) ** 2 + (p.y - player.y) ** 2 <= rr * rr) {
        _dead.push(p);
        if (p.kind === 'flame') {
          cstate.flames += 1;                          // 火种记账(evolveReady 消耗 1)
          bus.emit('xpPickup', { x: p.x, y: p.y });    // 拾取反馈复用 tick
        } else openChest();
      }
    });
    for (const p of _dead) pickups.despawn(p);
  }
  function openChest() {                               // 宝箱:随机未持有被动或神器(一局限 2 件)
    const artPool = Object.keys(ARTIFACTS).filter(id => !cstate.artifacts.includes(id));
    const pasPool = Object.keys(PASSIVES).filter(id => (cstate.passives[id] | 0) < 3);
    let card = null;
    if (artPool.length && cstate.artifacts.length < 2 && (rng.next() < 0.4 || !pasPool.length))
      card = { kind: 'artifact', id: rng.pick(artPool) };
    else if (pasPool.length) card = { kind: 'passiveNew', id: rng.pick(pasPool) };
    if (card) { cstate = applyCard(cstate, card); syncBuild(); }
  }

  // ===================== 空间哈希 / 清扫 =====================
  function rebuildHash() {
    hash.clear();
    enemies.each(e => { if (!e.dead) hash.insert(e); });
  }
  function sweepDead() {
    _dead.length = 0;
    enemies.each(e => { if (!e.dead && e.hp <= 0) killEnemy(e); });   // 潭/灼烧致死统一走 kill(Boss 掉落经此)
    enemies.each(e => { if (e.dead) _dead.push(e); });
    for (const e of _dead) enemies.despawn(e);
  }

  // ===================== 升级 / 三选一(全走 content) =====================
  function doLevelUp() {
    xp -= xpNext;
    cstate.level += 1;
    xpNext = CFG.xp.need(cstate.level);            // D-037:新等级的下一级阈值(与 startRun/init 同源)
    phase = 'draft';
    magnetAllT = CFG.magnet.allSec;
    bus.emit('levelUp', { level: cstate.level });
    if (Input.releaseStick) Input.releaseStick();      // 开三选一前放杆(摇杆死锁修复③)
    syncBuild();                                     // wickPlus 按等级重算
    ui.openDraft(getDraftCards(cstate, rng), onDraftPick);
  }
  function onDraftPick(card) {
    const prevW = { ...cstate.weapons }, prevP = { ...cstate.passives };   // B1:构筑 diff 用
    const hadEvo = cstate.evolutions.length;
    cstate = applyCard(cstate, card);                // 替换/弃置/重燃消耗火种均在此结算
    syncBuild();
    // B1 新武器觉醒/升级反馈:新增与升级的图标飞入/跳动(经 bus,ui 订阅)
    const pulses = [];
    for (const id of Object.keys(cstate.weapons)) {
      if (!(id in prevW)) pulses.push({ icon: WEAPONS[id].icon, name: WEAPONS[id].name, role: 'weapon', kind: 'new' });
      else if (cstate.weapons[id] > prevW[id]) pulses.push({ icon: WEAPONS[id].icon, name: WEAPONS[id].name, role: 'weapon', kind: 'up' });
    }
    for (const id of Object.keys(cstate.passives)) {
      if (!(id in prevP)) pulses.push({ icon: PASSIVES[id].icon, name: PASSIVES[id].name, role: 'passive', kind: 'new' });
      else if (cstate.passives[id] > prevP[id]) pulses.push({ icon: PASSIVES[id].icon, name: PASSIVES[id].name, role: 'passive', kind: 'up' });
    }
    if (pulses.length) bus.emit('buildChanged', { pulses });
    bus.emit('draftPick', { card });
    if (cstate.evolutions.length > hadEvo) {         // 重燃触发(契约 v2 §4)
      const evoId = cstate.evolutions[cstate.evolutions.length - 1];
      const wi = wInst.get(EVOLUTIONS[evoId].from);  // 防御:极端时序下实例未建不许崩
      if (wi) wi.cd = 0;
      bus.emit('evolution', { evoId });
    }
    ui.closeDraft();
    phase = 'run';
  }

  // ===================== 死亡 =====================
  // 暂停菜单【回烛台】退场口:玩法层退出 run(不 emit gameOver;结算语义由 main 驱动)
  function quitRun() {
    if (paused) {
      paused = false; ui.showPause(false);
      bus.emit('pauseToggle', { paused: false });
    }
    if (phase === 'run') phase = 'over';
  }

  function doGameOver() {    phase = 'over';
    const t = director ? Math.floor(director.t) : 0;
    const stats = { time: t, kills, level: cstate.level, snufferLit };   // snufferLit 透传:meta.recordRun 读 0-2(契约 P4 §5)
    try {
      const best = Platform.storage.get('embernight.best', null);
      if (!best || stats.time > best.time) Platform.storage.set('embernight.best', stats);
    } catch (e) { /* storage 不可用时静默 */ }
    bus.emit('gameOver', { stats });
  }

  // ===================== 渲染 =====================
  function draw() {
    if (phase === 'title') return;
    const t = director ? director.t : 0;
    const tl = director ? director.timeline : null;
    renderer.setCamera(player.x, player.y);
    renderer.setPlayerLight(player.x, player.y, lightRCur * snuffLightF);   // 青烛光圈 ×1.4(meta 注入)× 分焰 debuff ×0.60(最小挂点,不改 lightRCur 基础值)
    renderer.setColorScript(Math.min(t / CFG.run.length, 1));

    // 敌足下红圈预警(tri 蓄力 / Boss 冲刺;renderer 无红圈基元:BLOOD spark + 内暗盘合成环)
    enemies.each(e => {
      if (e.dead || !(e.telegraphT > 0)) return;

  }));
}

/* ---- 触屏摇杆可视化(P4:半透明底盘圆环+摇杆球,transform-only 无布局抖动) ---- */
const stickRing = document.createElement('div'), stickKnob = document.createElement('div');
const _stickCss = 'position:fixed;left:0;top:0;z-index:5;pointer-events:none;border-radius:50%;'
  + 'opacity:0;transition:opacity .18s ease;will-change:transform,opacity;';
// 样式纪律:ink 描边 + ember-mid 低透明填充(12 色 token)
stickRing.style.cssText = _stickCss + 'width:112px;height:112px;box-sizing:border-box;'
  + 'border:2px solid rgba(42,30,20,.9);background:rgba(255,158,79,.07);';
stickKnob.style.cssText = _stickCss + 'width:48px;height:48px;box-sizing:border-box;'
  + 'border:2px solid rgba(42,30,20,.85);background:rgba(255,158,79,.28);';
document.body.append(stickRing, stickKnob);
function drawStick(){
  const sk = Input.stick;
  if (sk && sk.active){
    const R = Input.stickRadius;
    const dx = sk.x - sk.ox, dy = sk.y - sk.oy;
    const len = Math.hypot(dx, dy), cl = len > R ? R / len : 1;   // 摇杆球限制在环内
    const rt = `translate(${sk.ox - R}px, ${sk.oy - R}px)`;
    const kt = `translate(${sk.ox + dx * cl - 24}px, ${sk.oy + dy * cl - 24}px)`;
    if (_stickVis.on !== true){ stickRing.style.opacity = '1'; stickKnob.style.opacity = '1'; _stickVis.on = true; }
    if (_stickVis.ringT !== rt){ stickRing.style.transform = rt; _stickVis.ringT = rt; }   // 脏标记:值变才写(2026-07-27 修复单③,静止持握零样式写入)
    if (_stickVis.knobT !== kt){ stickKnob.style.transform = kt; _stickVis.knobT = kt; }
  } else if (_stickVis.on !== false){
    stickRing.style.opacity = '0';
    stickKnob.style.opacity = '0';
    _stickVis.on = false;
  }
}
const _stickVis = { on: null, ringT: '', knobT: '' };   // drawStick 脏标记缓存(drawStick 首调在 loop 内,模块求值完成后,无 TDZ)

/* ---- 触屏暂停按钮(P4:仅 touch 设备显示,半透明;键盘 Esc 路径不动) ---- */
const pauseBtn = document.createElement('button');
pauseBtn.type = 'button';
pauseBtn.textContent = '‖';
pauseBtn.setAttribute('aria-label', '暂停');
pauseBtn.style.cssText = 'position:fixed;top:calc(64px + env(safe-area-inset-top));'
  + 'right:calc(14px + env(safe-area-inset-right));z-index:11;width:40px;height:40px;border-radius:50%;'
  + 'border:1px solid rgba(42,30,20,.9);background:rgba(11,8,6,.55);color:#FF9E4F;font-size:16px;'
  + 'display:none;align-items:center;justify-content:center;cursor:pointer;';
pauseBtn.addEventListener('click', () => { Input.state.pause = true; });   // 边沿触发,gameplay 消费
document.body.appendChild(pauseBtn);

/* ---- F3 性能 HUD(默认隐藏) ---- */
const perf = document.createElement('div');
perf.style.cssText = 'position:fixed;top:8px;left:8px;z-index:20;pointer-events:none;'
  + 'font:12px/1.5 Consolas,Menlo,monospace;color:#FFD9A0;white-space:pre;'
  + 'background:rgba(11,8,6,.72);border:1px solid #2A1E14;border-radius:6px;padding:6px 9px;display:none;';
document.body.appendChild(perf);
let perfOn = false;
if (new URLSearchParams(location.search).has('f3')) { perfOn = true; perf.style.display = 'block'; }   // ?f3=1:真机无 F3 键,诊断盒参数常开(2026-07-27 修复单验收用)
window.addEventListener('keydown', e => {
  if (e.key === 'F3'){ e.preventDefault(); perfOn = !perfOn; perf.style.display = perfOn ? 'block' : 'none'; }
});
function perfTick(){
  if (!perfOn) return;
  const s = renderer.stats, st = game.state;
  const f = (v, d) => (Number.isFinite(v) ? v : 0).toFixed(d);   // 空值兜底(统计重置窗内字段可能瞬时空)
  perf.textContent =
    `fps ${f(s.fps, 1)}  avg ${f(s.avg, 2)}ms  p95 ${f(s.p95, 2)}ms  L${s.level}\n` +
    `draw ${s.drawCalls}  ${s.api} ${s.hdr}  帧异常 ${s.frameErrors}  重建 ${s.rebuilds}\n` +
    `敌 ${st.enemies.alive}  弹 ${st.shots.alive}  星火 ${st.gems.alive}  ${appPhase}`
    // 诊断探针(仅 debug 版,__EMBER 存在时):硬重建计数/触发源/画质/dpr/构建版本
    + (window.__EMBER ? `\nhard ${s.layerRebuilds}(${s.lastRebuildSrc || '-'})  画质 ${renderer.quality}  dpr ${f(s.dprEff, 2)}  ${buildVer}\nbg ${s.bgMode || '-'}  hp ${s.fragHighpPrec ?? '-'}  hfLin ${s.halfFloatLinear ? 1 : 0}  gpu ${(s.gpu || '-').slice(0, 40)}` : '')
    // [XP] 真机经验曲线(仅 debug 版):[秒/级] 序列,末 16 条,跑完一局截图回传即可
    + (window.__EMBER && window.__xpLog && window.__xpLog.length
       ? `\nxp 共${window.__xpLog.length}级 ` + (window.__xpLog.length > 16 ? '…' : '')
         + window.__xpLog.slice(-16).map(e => e[0] + '/' + e[1]).join(' ') : '');
}
const buildVer = (document.querySelector('meta[name="build-ver"]') || {}).content || '';

/* ---- 主循环 ---- */
let last = performance.now(), hudAcc = 0;
let frameLoop = requestAnimationFrame;      // 正式产物恒 rAF;debug 版 ?hz=N 可换 setTimeout 节拍(60Hz 降级台架测试钩)
function loop(tms){
  frameLoop(loop);
  const rawDt = Math.min(0.1, (tms - last) / 1000);
  last = tms;
  Input.update();
  drawStick();                 // 摇杆可视化(每帧跟手)
  Time.update(rawDt);
  renderer.begin(Time.dt);     // 帧开始:清屏+清实例队列+uCandle 推进(必须先于精灵入队)
  game.update();               // 玩法/演示波(内部读 Time.dt,色彩脚本在 draw 内每帧推进)
  renderer.end();
  hudAcc += rawDt;
  if (hudAcc >= 0.1){
    hudAcc = 0;
    if (appPhase === 'run'){
      ui.updateHUD(game.state);
      ui.updateTimeline(Math.min(1, director.t / 600), tlMarkers());   // 烛泪刻度
      ui.updateSnuffer(director.timeline ? director.timeline.snuffer : null, renderer.worldToScreen);   // E2 熄灯台指示
      pauseBtn.style.display = Input.state.device === 'touch' ? 'flex' : 'none';  // 触屏暂停入口
    } else {
      pauseBtn.style.display = 'none';
    }
    audio.setIntensity(Math.min(1, game.state.enemies.alive / 120));
    perfTick();
  }
  Input.lateUpdate();
}

/* ---- 启动:进 title(演示波背景) ---- */
goTitle();
frameLoop(loop);
})();
</script>
