const _listeners = new Map();

  on(evt, fn){
    let s = _listeners.get(evt);
    if (!s){ s = new Set(); _listeners.set(evt, s); }
    s.add(fn);
    return fn;
  },
  off(evt, fn){

    if (s) s.delete(fn);
  },
  emit(evt, payload){

    if (!s) return;

  }

/* ---------- Time:全局时间总线(顿帧/慢动作;plan §4 juice timeScale 总线) ----------

const _fx = [];            // {scale, until(rawNow)}

  dt: 0,                   // 本帧逻辑 dt(已乘 timeScale)
  raw: 0,                  // 本帧真实 dt(UI/输入专用,不吃顿帧)
  now: 0,                  // 游戏累计时间(秒,乘 timeScale)
  timeScale: 1,
  hitStop(sec, scale = 0.1){ _fx.push({ scale, until: _rawNow + sec }); },
  slowMo(sec, scale){ _fx.push({ scale, until: _rawNow + sec }); },
  update(rawDt){
    _rawNow += rawDt;
    if (_fx.length){
      for (let i = _fx.length - 1; i >= 0; i--) if (_fx[i].until <= _rawNow) _fx.splice(i, 1);
    }
    let ts = 1;
    for (let i = 0; i < _fx.length; i++) if (_fx[i].scale < ts) ts = _fx[i].scale;

    this.raw = rawDt;
    this.dt = rawDt * ts;
    this.now += this.dt;

/* ---------- Pool:定容对象池(swap-pop,零 GC) ----------
 * spawn 满容返回 null(由调用方决策);each(fn) 中 fn 返回 true 可安全 despawn 当前项。 */
class Pool {
  constructor(factory, capacity){
    this._items = new Array(capacity);
    for (let i = 0; i < capacity; i++){
      this._items[i] = factory(i);
      this._items[i].__pi = i;          // 池内槽位索引(随 swap 维护)
    }
    this._n = 0;
    this._cap = capacity;
  }
  spawn(initObj){
    if (this._n >= this._cap) return null;
    const obj = this._items[this._n++];
    if (initObj) Object.assign(obj, initObj);
    return obj;
  }
  despawn(obj){
    const i = obj.__pi;
    if (i == null || i >= this._n || this._items[i] !== obj) return;   // 非活跃/已回收
    const last = this._items[--this._n];
    this._items[i] = last; last.__pi = i;
    this._items[this._n] = obj; obj.__pi = this._n;
  }
  each(fn){
    for (let i = 0; i < this._n; i++){
      if (fn(this._items[i], i) === true){ this.despawn(this._items[i]); i--; }
    }
  }
  get alive(){ return this._n; }
  clear(){ this._n = 0; }
}

/* ---------- SpatialHash:空间哈希(insert 需 obj 有 x,y,r;queryCircle 精确距离复核) ---------- */
class SpatialHash {
  constructor(cellSize){
    this.cs = cellSize;
    this._map = new Map();              // key -> obj[](数组复用,clear 不释放)
  }
  _key(cx, cy){ return (cx + 4096) * 8192 + (cy + 4096); }   // 覆盖 ±4096 格,远超局内范围
  clear(){ for (const a of this._map.values()) a.length = 0; }
  insert(obj){
    const k = this._key(Math.floor(obj.x / this.cs), Math.floor(obj.y / this.cs));
    let a = this._map.get(k);
    if (!a){ a = []; this._map.set(k, a); }
    a.push(obj);
  }
  queryCircle(x, y, r, cb){
    const cs = this.cs;
    const x0 = Math.floor((x - r) / cs), x1 = Math.floor((x + r) / cs);
    const y0 = Math.floor((y - r) / cs), y1 = Math.floor((y + r) / cs);
    for (let cy = y0; cy <= y1; cy++){
      for (let cx = x0; cx <= x1; cx++){
        const a = this._map.get(this._key(cx, cy));
        if (!a) continue;
        for (let i = 0; i < a.length; i++){
          const o = a[i], rr = r + (o.r || 0);
          const dx = o.x - x, dy = o.y - y;
          if (dx * dx + dy * dy <= rr * rr) cb(o);
        }
      }
    }
  }
}

/* ---------- RNG:mulberry32 种子随机 ---------- */
class RNG {
  constructor(seed){ this._s = (seed >>> 0) || 0x9E3779B9; }
  next(){
    let t = this._s += 0x6D2B79F5;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);

  }
  range(a, b){ return a + (b - a) * this.next(); }
  int(a, b){ return Math.floor(this.range(a, b + 1)); }   // 含两端
  pick(arr){ return arr[this.int(0, arr.length - 1)]; }
}

//   配 e.telegraphMax 可算进度;renderer 无红圈基元,表现由集成层决定)。
// =============================================================================



// ===================== 参数表(置顶可改) =====================
// 契约已定数值一律走下方 ENEMY/BOSSES 表;本表只收契约未定的节奏/表现参数。
const TUNE = {
  tri:  { trigger: 240, rest: 0.8 },
  // TODO-CONTRACT:tri 冲锋触发距离与后摇契约 v1/v2 均未定,沿用 Phase 1 实测值
  limb: { band: 25, range: 560 },
  // TODO-CONTRACT:limb 保距带宽与射程契约未定;band 沿用 Phase 1 语义,range 沿用 560 防隔屏狙击
  bullet: { r: 7, life: 6 },
  // TODO-CONTRACT:敌弹形状契约未定义(见 shoot() 与报告);r=7 略大于火矢 6 保证可读,life 6s(≈840 射程,超视野半高 360)
  boss: {
    restBetween: 1.3,   // 机制项之间的追逐间隔(契约只定序列,未定时序)
    fanWaveGap: 0.65,   // 扇形 3 波间隔
    fanSpread: 50 * Math.PI / 180,
    // TODO-CONTRACT:fanShot 扇形张角契约未定,取 50°(5 发均布 ±25°,横向走位可穿缝)
    ringWaveGap: 0.75,  // 环形 2 波间隔
    summonCast: 1.0,    // 召唤施展停顿(召唤在进阶段瞬间生效)
    dashRecover: 0.5,   // 冲刺后摇;nyct2 二连 dash 之间不插追逐间隔(见 advance)
  },
  // BOSSES 表无 summon 字段;数量按契约注释钉死(nyct1→6 blob,nyct2→4 tri),环布 Boss 周围
  summonRing: { nyct1: { id: 'blob', n: 6, r: 96 }, nyct2: { id: 'tri', n: 4, r: 120 } },
};

// ===================== 契约 v2 §2 数据表(原样,勿改) =====================
const ENEMY = {
  blob: { frame:'blob', hp:20, speed:45, r:13, dmg:8,  xp:1 },
  tri:  { frame:'tri',  hp:14, speed:40, r:11, dmg:10, xp:1, telegraph:0.5, charge:{ windup:0.6, speed:260, dur:0.5 } },
  limb: { frame:'limb', hp:30, speed:30, r:9,  dmg:6,  xp:2, keepDist:200, shotCd:2.5, shotSpeed:120, shotDmg:8 },
  boss: { frame:'boss', hp:60, speed:36, r:22, dmg:14, xp:5 },   // 精英基座(普通巨型怪)
};

// Boss 数值锚(对照 analysis/dps-budget.xlsx 终局 DPS~200)
const BOSSES = {
  nyct1: { name:'瞳魇',     hp:900,  r:34, speed:46, contact:16, xp:50,
           cycle:['fanShot','dash','summon'],            // 3×扇形暗弹(5 发/扇)→ 扑光冲刺 → 召唤 6 blob
           dash:{ telegraph:1.0, speed:600, dur:0.4 },   // 预警:地面红圈 + bus.emit('bossTelegraph') → juice 令玩家烛焰闪烁
           fan:{ waves:3, per:5, speed:140, dmg:10 } },
  nyct2: { name:'夜瞳君主', hp:1800, r:42, speed:52, contact:20, xp:120,
           cycle:['ringShot','dash','dash','summon'],    // 环形弹幕×2 → 冲刺二连 → 召唤 4 tri
           dash:{ telegraph:0.8, speed:680, dur:0.45 },
           ring:{ waves:2, per:14, speed:150, dmg:12 },
           enrage:{ below:0.5, telegraphMult:0.6, speedMult:1.4 } },  // 半血狂暴:预警更短更快
};

// ===================== 内部工具 =====================
let _uid = 0;   // enemy 自增 id(模块内私有,工厂内状态,非顶层副作用)

// 敌弹统一出口。TODO-CONTRACT:契约未定 spawnBullet(b) 的 b 形状,本模块约定:
// { x,y,vx,vy, r, dmg, life, frame:'proj', tint, additive:false, hostile:true }
// hostile 标记敌弹(与玩家火矢区分);dmg 随来源不同(limb 8 / nyct1 10 / nyct2 12)必须随弹携带。
function shoot(e, ctx, ang, speed, dmg) {
  const sx = e.x + Math.cos(ang) * (e.r + 4);          // 从体表发射,避免弹从体内凭空出现
  const sy = e.y + Math.sin(ang) * (e.r + 4);
  ctx.spawnBullet({
    x: sx, y: sy,
    vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed,
    r: TUNE.bullet.r, dmg, life: TUNE.bullet.life,
    frame: 'proj', tint: PAL.VENOM, additive: false, hostile: true,
  });
}

// 朝向玩家人间单位向量(写闭包外供多阶段复用)
function aimAt(e, p) {
  const dx = p.x - e.x, dy = p.y - e.y;
  const d = Math.hypot(dx, dy) || 1;
  return { ux: dx / d, uy: dy / d, d };
}

// ===================== 三族基础 AI =====================
// blob / boss 基座(普通巨型):径直扑光(影魅趋光性)
function makeChaseAI() {
  return { update(e, ctx, dt) {
    const { ux, uy } = aimAt(e, ctx.player);
    e.vx = ux * e.speed; e.vy = uy * e.speed;
    e.x += e.vx * dt; e.y += e.vy * dt;
    e.rot = Math.atan2(e.vy, e.vx);
  } };
}

// tri:追踪 → 蓄力 0.6s(含 0.5s 地面红圈预告 telegraphT)→ 冲锋 260×0.5s(锁向)→ 后摇
function makeTriAI(def) {
  let st = 'chase', t = 0, cdx = 1, cdy = 0;
  return { update(e, ctx, dt) {
    const { ux, uy, d } = aimAt(e, ctx.player);
    if (st === 'chase') {
      e.vx = ux * e.speed; e.vy = uy * e.speed;
      e.x += e.vx * dt; e.y += e.vy * dt;
      e.rot = Math.atan2(e.vy, e.vx);
      if (d < TUNE.tri.trigger) {
        st = 'windup'; t = def.charge.windup;
        e.telegraphT = def.telegraph; e.telegraphMax = def.telegraph;  // 0.5s 地面红圈预告
      }
    } else if (st === 'windup') {
      e.vx = 0; e.vy = 0;                       // 原地震颤(渲染层),朝向持续跟踪
      e.rot = Math.atan2(uy, ux);
      t -= dt;
      e.telegraphT = Math.max(0, e.telegraphT - dt);
      if (t <= 0) {
        st = 'charge'; t = def.charge.dur;
        cdx = ux; cdy = uy;                     // 冲锋启动瞬间锁定方向(玩家横移可躲)
        e.telegraphT = 0;
      }
    } else if (st === 'charge') {
      e.vx = cdx * def.charge.speed; e.vy = cdy * def.charge.speed;
      e.x += e.vx * dt; e.y += e.vy * dt;
      e.rot = Math.atan2(cdy, cdx);
      t -= dt;
      if (t <= 0) { st = 'rest'; t = TUNE.tri.rest; }
    } else {                                    // rest 后摇
      e.vx = 0; e.vy = 0;
      t -= dt;
      if (t <= 0) st = 'chase';
    }
  } };
}

// limb:保持 200 距离开外(带内环绕漂移),每 2.5s 一发慢速暗弹(玩家可走位躲)
function makeLimbAI(def) {
  let shotT = -1;                               // -1 = 首帧惰性初始化(用 id 黄金比散列错开齐射)
  return { update(e, ctx, dt) {
    if (shotT < 0) shotT = def.shotCd * (0.4 + 0.6 * ((e.id * 0.6180339887) % 1));
    const { ux, uy, d } = aimAt(e, ctx.player);
    let mx, my;
    if (d < def.keepDist - TUNE.limb.band)      { mx = -ux;       my = -uy;      }  // 太近则退
    else if (d > def.keepDist + TUNE.limb.band) { mx = ux;        my = uy;       }  // 太远则进
    else                                        { mx = -uy * 0.6; my = ux * 0.6; }  // 带内环绕漂移
    e.vx = mx * e.speed; e.vy = my * e.speed;
    e.x += e.vx * dt; e.y += e.vy * dt;
    e.rot = Math.atan2(uy, ux);                 // 瘦长多肢始终面向玩家(瞄准姿态)
    shotT -= dt;
    if (shotT <= 0 && d < TUNE.limb.range) {
      shotT = def.shotCd;
      shoot(e, ctx, Math.atan2(uy, ux), def.shotSpeed, def.shotDmg);
    }
  } };
}

function makeAI(id) {
  const def = ENEMY[id];
  if (id === 'tri') return makeTriAI(def);
  if (id === 'limb') return makeLimbAI(def);
  return makeChaseAI();                          // blob / boss 基座共用追踪
}

// ===================== Boss 机制状态机 =====================
// 通用 cycle 驱动:chase(间隔)→ cycle[i] → chase → cycle[i+1] → … 循环。
// 阶段:fanShot / ringShot(站定按波发弹)、dash(dashTele 预警锁向 → dash 冲刺 → recover 后摇)、
//      summon(进阶段即召唤,随后施展停顿)。例外:相邻两个 dash 之间不插 chase(冲刺二连)。
function makeBossAI(which, def) {
  let phase = 'chase', phaseT = TUNE.boss.restBetween;   // 出场先追逐一小段,不突兀进机制
  let cycleIdx = 0;
  let wave = 0, waveT = 0;
  let dashDx = 1, dashDy = 0;
  let lastUx = 1, lastUy = 0;
  let enraged = false;

  function enterMove(e, ctx) {
    const move = def.cycle[cycleIdx];
    if (move === 'fanShot' || move === 'ringShot') {
      phase = move; wave = 0; waveT = 0;                 // waveT=0:进阶段当帧发第一波
    } else if (move === 'dash') {
      const tel = def.dash.telegraph * (enraged ? def.enrage.telegraphMult : 1);
      phase = 'dashTele'; phaseT = tel;
      dashDx = lastUx; dashDy = lastUy;                  // 预警即锁向:红圈方向=冲刺方向
      e.rot = Math.atan2(dashDy, dashDx);
      e.telegraphT = tel; e.telegraphMax = tel;          // 地面红圈(渲染层消费)
      ctx.bus.emit('bossTelegraph', { boss: e, kind: 'dash' });   // 契约 v2 §2:juice 令玩家烛焰闪烁
    } else if (move === 'summon') {
      phase = 'summon'; phaseT = TUNE.boss.summonCast;
      const cfg = TUNE.summonRing[which];
      const off = ctx.rng ? ctx.rng.range(0, Math.PI * 2) : 0;
      for (let i = 0; i < cfg.n; i++) {
        const a = off + i * (Math.PI * 2 / cfg.n);       // 环布 Boss 周围
        ctx.summon(cfg.id, e.x + Math.cos(a) * cfg.r, e.y + Math.sin(a) * cfg.r);
      }
    }
  }

  function advance(e, ctx) {
    const cur = def.cycle[cycleIdx];
    cycleIdx = (cycleIdx + 1) % def.cycle.length;
    if (cur === 'dash' && def.cycle[cycleIdx] === 'dash') { enterMove(e, ctx); return; }  // 冲刺二连
    phase = 'chase'; phaseT = TUNE.boss.restBetween;
  }

  return { update(e, ctx, dt) {
    // 狂暴(nyct2,契约 BOSSES.enrage):半血一次性触发——移动/冲刺 ×1.4、预警 ×0.6;
    // 弹速不变(契约钉死 140-150 慢速可走位弹,提速会破坏走位窗口)。
    if (def.enrage && !enraged && e.hp <= e.maxHp * def.enrage.below) {
      enraged = true;
      e.speed *= def.enrage.speedMult;
    }
    const { ux, uy } = aimAt(e, ctx.player);
    lastUx = ux; lastUy = uy;

    if (phase === 'chase') {                             // 机制间追踪(扑光)
      e.vx = ux * e.speed; e.vy = uy * e.speed;
      e.x += e.vx * dt; e.y += e.vy * dt;
      e.rot = Math.atan2(e.vy, e.vx);
      phaseT -= dt;
      if (phaseT <= 0) enterMove(e, ctx);
    } else if (phase === 'fanShot') {                    // 3 波×5 发扇形暗弹(站定施法,每波重新瞄准)
      e.vx = 0; e.vy = 0;
      waveT -= dt;
      if (waveT <= 0) {
        const fan = def.fan, base = Math.atan2(lastUy, lastUx);
        for (let i = 0; i < fan.per; i++) {
          const a = base + (i / (fan.per - 1) - 0.5) * TUNE.boss.fanSpread;
          shoot(e, ctx, a, fan.speed, fan.dmg);
        }
        e.rot = base;
        wave++; waveT = TUNE.boss.fanWaveGap;
        if (wave >= fan.waves) advance(e, ctx);
      }
    } else if (phase === 'ringShot') {                   // 2 波×14 发环形弹幕(第二波错半格,可穿缝)
      e.vx = 0; e.vy = 0;
      waveT -= dt;
      if (waveT <= 0) {
        const ring = def.ring, off = wave * (Math.PI / ring.per);
        for (let i = 0; i < ring.per; i++) {
          shoot(e, ctx, off + i * (Math.PI * 2 / ring.per), ring.speed, ring.dmg);
        }
        wave++; waveT = TUNE.boss.ringWaveGap;
        if (wave >= ring.waves) advance(e, ctx);
      }
    } else if (phase === 'dashTele') {                   // 扑光预警:原地锁向,红圈倒数
      e.vx = 0; e.vy = 0;
      phaseT -= dt;
      e.telegraphT = Math.max(0, phaseT);
      if (phaseT <= 0) { phase = 'dash'; phaseT = def.dash.dur; e.telegraphT = 0; }
    } else if (phase === 'dash') {                       // 扑光冲刺:直线高速,方向预警期已锁
      const sp = def.dash.speed * (enraged ? def.enrage.speedMult : 1);
      e.vx = dashDx * sp; e.vy = dashDy * sp;
      e.x += e.vx * dt; e.y += e.vy * dt;
      phaseT -= dt;
      if (phaseT <= 0) { phase = 'recover'; phaseT = TUNE.boss.dashRecover; }
    } else if (phase === 'recover' || phase === 'summon') {
      e.vx = 0; e.vy = 0;                                // 后摇 / 召唤施展停顿
      phaseT -= dt;
      if (phaseT <= 0) advance(e, ctx);
    }
  } };
}

// ===================== 契约导出:工厂三件套 =====================
// opts:{ elite:false, hpMult, sizeMult } → enemy(契约 v2 §2)
function spawnEnemy(id, x, y, opts) {
  const def = ENEMY[id];
  if (!def) throw new Error('enemies.spawnEnemy: unknown id "' + id + '"');
  const o = opts || {};
  const elite = !!o.elite;
  const hpMult   = (o.hpMult   || 1) * (elite ? 4   : 1);   // 精英 ×4HP
  const sizeMult = (o.sizeMult || 1) * (elite ? 1.6 : 1);   // 精英 ×1.6 体型
  const hp = Math.round(def.hp * hpMult);
  return {
    id: ++_uid, type: id,
    x, y,
    r: def.r * sizeMult,
    hp, maxHp: hp,
    speed: def.speed,
    dmg: def.dmg,                       // 接触伤害(limb 弹伤害在 shotDmg,随弹携带)
    xp: def.xp,
    frame: def.frame,
    tint: elite ? PAL.VENOM : PAL.GHOUL,  // 精英 venom 描边(renderer 仅整体 tint 通道,见报告)
    elite, boss: false,
    vx: 0, vy: 0,
    rot: 0,                             // 扩展:朝向(renderer 消费)
    sizeMult,                           // 扩展:体型倍率(renderer scale 消费;FRAME_SIZE 与 r 脱钩)
    telegraphT: 0,                      // >0 表预警中(tri 蓄力 / Boss dash)
    lastDmg: 0,
    ai: makeAI(id),
  };
}

// 任意族精英化:×4HP ×1.6 体型,venom 描边;击杀掉宝箱由 director 监听 eliteDown 发放(契约 v2 §2/§3)
// TODO-CONTRACT:签名无坐标——返回 x=0,y=0,摆位由调用方(director)负责;
// baseId 省略或传 'random' 时用 rng 随机选族(契约签名含 rng 的落地语义)。
function makeElite(baseId, rng) {
  let id = baseId;
  if (!id || id === 'random' || !ENEMY[id]) {
    const keys = Object.keys(ENEMY);
    id = rng ? rng.pick(keys) : keys[0];
  }
  return spawnEnemy(id, 0, 0, { elite: true });
}

// Boss 工厂:which = 'nyct1' | 'nyct2'(契约 v2 §2)
function makeBoss(which, x, y) {
  const def = BOSSES[which];
  if (!def) throw new Error('enemies.makeBoss: unknown boss "' + which + '"');
  return {
    id: ++_uid, type: 'boss',
    bossId: which,                      // 扩展:Boss 标识(director 事件载荷/结算可用)
    name: def.name,                     // 扩展:中文名(HUD 可用)
    x, y,
    r: def.r,
    hp: def.hp, maxHp: def.hp,
    speed: def.speed,
    dmg: def.contact,                   // 统一形状 dmg = 接触伤害(BOSSES 表字段名 contact)
    xp: def.xp,
    frame: 'boss',                      // renderer 帧集仅四帧(契约 v1 §2),Boss 复用 'boss'
    tint: PAL.GHOUL,
    elite: false, boss: true,
    vx: 0, vy: 0,
    rot: 0, sizeMult: 1,
    telegraphT: 0,
    lastDmg: 0,
    ai: makeBossAI(which, def),
  };
}
return { ENEMY, BOSSES, spawnEnemy, makeElite, makeBoss };
})();

};

// 怪组随时间切换(契约 §3:0–2 blob 主,2–4 加 tri,4+ 加 limb,6+ 加 boss 族普通巨型)
// TODO-CONTRACT #3:契约只定切换点未定族内配比,以下为自定默认权重,待补约。
const GROUPS = [
  { until: 120,      w: [['blob', 1]] },
  { until: 240,      w: [['blob', 0.70], ['tri', 0.30]] },
  { until: 360,      w: [['blob', 0.55], ['tri', 0.30], ['limb', 0.15]] },
  { until: Infinity, w: [['blob', 0.45], ['tri', 0.25], ['limb', 0.15], ['boss', 0.15]] },
];

// ===================== 节奏表(写死常量,与 plan.md §2 对齐) =====================
// warp 快进路径上事件按序照常 emit(契约 §3);同一时刻多条目按数组顺序触发。
const TIMELINE = [
  { t: 45,  kind: 'sparkGuard' },              // 0:45 首升保障:未升则补一波星火
  { t: 60,  kind: 'elite', n: 1 },             // 1:00 精英① → 宝箱
  { t: 180, kind: 'hordeStart', n: 1 },        // 3:00 尸潮①(60s,rate×3,环形围攻)
  { t: 240, kind: 'hordeEnd', n: 1 },          // 4:00 尸潮①结束 → 掉聚火
  { t: 240, kind: 'lull', on: true },          // 4:00 喘息(rate×0.4)
  { t: 300, kind: 'lull', on: false },
  { t: 300, kind: 'boss', which: 'nyct1' },    // 5:00 Boss①瞳魇 → 火种①+余烬之门
  { t: 360, kind: 'elite', n: 2 },             // 6:00 精英②
  { t: 420, kind: 'elite', n: 3 },             // 7:00 精英③
  { t: 480, kind: 'hordeStart', n: 2 },        // 8:00 尸潮②
  { t: 540, kind: 'hordeEnd', n: 2 },          // 9:00 结束 → 聚火
  { t: 540, kind: 'lull', on: true },          // 9:00 喘息
  { t: 570, kind: 'lull', on: false },
  { t: 570, kind: 'boss', which: 'nyct2' },    // 9:30 Boss②夜瞳君主 → 火种②
  { t: 600, kind: 'victory' },                 // 10:00 黎明:发事件+停刷(演出 Phase 3)
];

const GOLDEN_ANGLE = 2.399963229728653;        // 环形围攻布点:黄金角均匀散布

function createDirector({ bus, Time, rng, spawnEnemy, summon, player, grant }) {
  void summon;                                 // 契约签名固定;增援由敌人 AI 经此出口,导演不直调

  // ===================== 内部状态 =====================
  let t = 0, evIdx = 0, acc = 0;               // 导演时钟 / 节奏表游标 / 刷怪累加器
  let horde = null;                            // {n, endsAt} 尸潮进行中
  let lull = false;                            // 喘息段
  let flowT = 0;                               // 心流反拍剩余秒
  let victoryFired = false;
  let sawLevelUp = false;                      // 0:45 首升保障判定
  let gate = null;                             // 余烬之门 {x,y,r,until,reward}
  let demo = false;                            // P3 演示波:title 背景(≤60 实体,时钟不走,事件不发)
  let rateBias = 1;                            // P3:lure/长夜敌量加成(集成者注入)
  const magnets = [];                          // 聚火拾取点 {x,y,r}(无时限,拾取为止)
  let spawned = 0, killsSeen = 0;              // 存活软上限估计(池满时 spawnEnemy 返回 null 双保险)
  let ringAngle = 0;                           // 环形围攻角度游标
  const bossWhich = new Map();                 // enemy → 'nyct1'|'nyct2'(火种序号判定)

  // ===================== bus 订阅:死亡感知(契约 §7 kill 载荷 {x,y,enemy,overkill}) =====================
  bus.on('kill', ({ x, y, enemy }) => {
    killsSeen++;
    if (!enemy) return;
    if (enemy.boss || bossWhich.has(enemy)) onBossDown(enemy, x, y);
    else if (enemy.elite) onEliteDown(enemy, x, y);
  });
  bus.on('levelUp', () => { sawLevelUp = true; });

  // ===================== 节奏表事件处理 =====================
  function handle(ev) {
    switch (ev.kind) {
      case 'sparkGuard':                       // 0:45 首升保障
        if (!sawLevelUp) grant({ kind: 'sparkWave', n: CFG.sparkWave.n, x: player.x, y: player.y });
        break;
      case 'elite': {
        const id = pickGroup();                // 任意族基座(契约 §2)
        const a = rng.range(0, Math.PI * 2);
        const x = player.x + Math.cos(a) * CFG.elite.dist;
        const y = player.y + Math.sin(a) * CFG.elite.dist;
        const e = spawnEnemy(id, x, y, { elite: true, hpMult: CFG.elite.hpMult, sizeMult: CFG.elite.sizeMult });
        if (!e) break;                         // 池满跳过(实体不存在则不 emit)
        spawned++;
        bus.emit('eliteSpawn', { e });
        break;
      }
      case 'hordeStart':
        horde = { n: ev.n, endsAt: ev.t + CFG.horde.dur };
        bus.emit('hordeStart', { n: ev.n });
        break;
      case 'hordeEnd':
        horde = null;
        bus.emit('hordeEnd', { n: ev.n });
        dropMagnet();                          // 尸潮结束必掉聚火
        break;
      case 'lull':
        lull = ev.on;
        break;
      case 'boss': {
        const a = rng.range(0, Math.PI * 2);
        const x = player.x + Math.cos(a) * CFG.bossDist;
        const y = player.y + Math.sin(a) * CFG.bossDist;
        // TODO-CONTRACT #2:契约 §3 仅注入 spawnEnemy/summon 两个实体出口,未明确 Boss 专用入口;
        // 此处以 spawnEnemy('nyct1'|'nyct2', x, y, {boss:true}) 创建,集成者请将该 id 路由至 enemies.makeBoss(which,x,y)。
        const e = spawnEnemy(ev.which, x, y, { boss: true });
        if (!e) break;
        spawned++;
        bossWhich.set(e, ev.which);
        bus.emit('bossSpawn', { boss: e });
        break;
      }
      case 'victory':
        victoryFired = true;                   // 停刷怪;场上残敌由 gameplay 收尾
        bus.emit('victory', {});
        break;
    }
  }

  function fireDue(to) {                       // 触发全部到点事件(warp 共用同一路径,保证照常 emit)
    while (evIdx < TIMELINE.length && TIMELINE[evIdx].t <= to) handle(TIMELINE[evIdx++]);
  }

  // ===================== 精英/Boss 死亡:宝箱 / 火种 / 余烬之门 / 心流反拍 =====================
  function onEliteDown(e, x, y) {
    bus.emit('eliteDown', { e, x, y });
    grant({ kind: 'chest', x, y });            // 宝箱:随机未持有被动或神器(上限裁决在 content/gameplay)
    flowT = CFG.flow.dur;
  }

  function onBossDown(boss, x, y) {
    const which = bossWhich.get(boss) || boss.type || 'nyct1';
    const n = which === 'nyct2' ? 2 : 1;       // 烛芯火种序号
    bus.emit('bossDown', { boss, x, y });
    flowT = CFG.flow.dur;
    bus.emit('wickFlameDrop', { n, x, y });
    grant({ kind: 'wickFlame', n, x, y });
    if (n === 1) openGate(x, y);               // 仅 Boss① 开余烬之门(契约 §3)
  }

  function openGate(x, y) {
    // TODO-CONTRACT #4:「神器一件或 +2 级经验量」的选择权契约未定,暂由导演 rng 二选一;
    // 神器一局限 2 件的上限由 content/gameplay 裁决,溢出时请降级为 levels2。
    const reward = rng.next() < 0.5 ? 'artifact' : 'levels2';
    gate = { x, y, r: CFG.gate.r, until: t + CFG.gate.sec, reward };
    bus.emit('gateOpen', { x, y, sec: CFG.gate.sec });
  }

  function dropMagnet() {
    const a = rng.range(0, Math.PI * 2), d = CFG.magnet.dropDist;
    const x = player.x + Math.cos(a) * d, y = player.y + Math.sin(a) * d;
    magnets.push({ x, y, r: CFG.magnet.r });
    bus.emit('magnetDrop', { x, y });
  }

  // ===================== 基础刷怪曲线 + 怪组 =====================
  function rateMult() {
    let m = 1;
    if (horde) m *= CFG.horde.rateMult;
    if (lull) m *= CFG.lull.rateMult;
    if (flowT > 0) m *= CFG.flow.rateMult;     // 心流反拍:rate×0.4(与喘息乘算叠加)
    return m;
  }

  function stepSpawn(dt) {
    const rate = CFG.spawn.base + (t / 60) * CFG.spawn.perMin;   // rate(t)=0.8+t/60×0.9 只/s
    acc = Math.min(acc + rate * rateMult() * rateBias * dt, CFG.spawn.accCap);
    const cap = demo ? 60 : CFG.spawn.cap;                 // 演示波 ≤60 实体(契约 v3 §5)
    while (acc >= 1) {
      if (spawned - killsSeen >= cap) { acc = 0; break; }  // 存活上限(软估计)
      acc -= 1;
      spawnOne();
    }
  }

  function spawnOne() {
    const id = pickGroup();
    let x, y;
    if (horde) {                               // 环形围攻:黄金角逐点均匀围困玩家
      ringAngle += GOLDEN_ANGLE;
      const d = CFG.horde.ringR + rng.range(-CFG.horde.ringJitter, CFG.horde.ringJitter);
      x = player.x + Math.cos(ringAngle) * d;
      y = player.y + Math.sin(ringAngle) * d;
    } else {                                   // 常规:视野外环带(口径同 Phase 1)
      const a = rng.range(0, Math.PI * 2);
      const d = CFG.spawn.distMin + rng.range(0, CFG.spawn.distVar);
      x = player.x + Math.cos(a) * d;
      y = player.y + Math.sin(a) * d;
    }
    const e = spawnEnemy(id, x, y);
    if (e) spawned++;
  }

  function pickGroup() {                       // 按当前 t 选怪组,再按权重抽族
    let g = GROUPS[GROUPS.length - 1];
    for (const gg of GROUPS) if (t < gg.until) { g = gg; break; }
    let total = 0;
    for (const [, w] of g.w) total += w;
    let r = rng.next() * total;
    for (const [id, w] of g.w) { r -= w; if (r <= 0) return id; }
    return g.w[0][0];
  }

  // ===================== 拾取判定:聚火 / 余烬之门(玩家接触半径) =====================
  function stepPickups() {
    const pr = player.r || 14;
    for (let i = magnets.length - 1; i >= 0; i--) {
      const m = magnets[i];
      const rr = pr + m.r;
      if ((m.x - player.x) ** 2 + (m.y - player.y) ** 2 <= rr * rr) {
        magnets.splice(i, 1);
        bus.emit('magnetPickup', {});
        grant({ kind: 'magnet', x: m.x, y: m.y });   // 全屏星火磁吸 + 额外 +1 级经验量
      }
    }
    if (gate) {
      const rr = pr + gate.r;
      if ((gate.x - player.x) ** 2 + (gate.y - player.y) ** 2 <= rr * rr) {
        const g = gate; gate = null;
        bus.emit('gateEnter', { reward: g.reward });
        grant({ kind: 'gateReward', reward: g.reward, x: g.x, y: g.y });
      } else if (t >= gate.until) {
        gate = null;                           // 30s 超时静默消失(契约无 gateClose 事件)
      }
    }
  }

  // ===================== 对外 API(契约 §3 签名) =====================
  function update() {
    const dt = Time.dt;                        // 逻辑 dt(顿帧/慢动作自动生效)
    if (demo) {                                // 演示波:只刷怪+拾取,时钟不走、节奏表/尸潮不发
      if (dt > 0) stepSpawn(dt);
      stepPickups();
      return;
    }
    if (dt > 0) {
      t += dt;
      fireDue(t);
      if (flowT > 0) flowT -= dt;
      if (!victoryFired) stepSpawn(dt);        // victory 后停刷(契约 §3)
    }
    stepPickups();                             // 拾取判定即使 dt=0 也检查(贴脸生成即拾取)
  }

  // P3 集成补丁:演示波开关 / 开局重置 / 敌量加成(lure×长夜,由集成者算好给入)
  function setDemo(on) { demo = !!on; }
  function setRateBias(m) { rateBias = Math.max(0, m || 1); }
  function reset() {
    t = 0; evIdx = 0; acc = 0;
    horde = null; lull = false; flowT = 0;
    victoryFired = false; sawLevelUp = false;
    gate = null; magnets.length = 0;
    spawned = 0; killsSeen = 0; ringAngle = 0;
    bossWhich.clear();
  }


  return {
    update,
    setDemo, setRateBias, reset,
    get t() { return t; },
    get dropMult() { return flowT > 0 ? CFG.flow.dropMult : 1; },   // P4:gameplay 星火掉落直读(免 timeline 分配)
    // TODO-CONTRACT #5:timeline 载荷形状契约未定;自定如下,供 Phase 3 烛泪刻度/HUD 标记
    // 与 gameplay 渲染聚火/余烬之门拾取点;掉落×1.5 无契约事件通道,经 dropMult 暴露给 gameplay。
    get timeline() {
      return {
        t,
        markers: TIMELINE.map((ev, i) => ({
          t: ev.t, kind: ev.kind,
          n: ev.n != null ? ev.n : null,
          which: ev.which != null ? ev.which : null,
          fired: i < evIdx,
        })),
        rateMult: rateMult(),
        dropMult: flowT > 0 ? CFG.flow.dropMult : 1,   // 心流反拍:掉落率 ×1.5
        flowT, lull,
        horde: horde ? { n: horde.n, endsAt: horde.endsAt } : null,
        magnets: magnets.slice(),
        gate: gate ? { x: gate.x, y: gate.y, r: gate.r, until: gate.until, reward: gate.reward } : null,
        victory: victoryFired,
      };
    },
  };
}
return { createDirector };
})();

    // 统一:场 f(>0 在形内)→ alpha/加粗描边带
    function shapeOf(f, lumFn){
      const a = Math.min(1, Math.max(0, f * 8));
      const rim = a * Math.max(0, 1 - Math.abs(f - 0.055) * 11);   // 描边加粗(风格纪律)
      return [a, a * lumFn(), rim];
    }
    for (let cell = 0; cell < 8; cell++){
      const ox = (cell % 4) * C, oy = (cell >> 2) * C;
      for (let y = 0; y < C; y++) for (let x = 0; x < C; x++){
        const u = (x + 0.5) / C * 2 - 1, v = (y + 0.5) / C * 2 - 1;   // -1..1,y 向下
        let lum = 0, a = 0, rim = 0, core = 0, f = -9, s;
        if (cell === 0){          // blob 团块:主圆 + 左右凸包(多凸包剪影)
          f = Math.max(0.62 - Math.hypot(u, v - 0.10),
                       0.32 - Math.hypot(u + 0.44, v + 0.34),
                       0.32 - Math.hypot(u - 0.46, v + 0.38));
          s = shapeOf(f, () => 0.5 + 0.5 * Math.max(0, 0.85 - Math.hypot(u, v - 0.05)));
          a = s[0]; lum = s[1]; rim = s[2];
        } else if (cell === 1){   // tri 尖三角:顶点 (0.98,0),底边 x=-0.72(更长更尖)
          f = Math.min(u + 0.72, (0.98 - u) * 0.44 - Math.abs(v));
          s = shapeOf(f, () => 0.88);
          a = s[0]; lum = s[1]; rim = s[2];
        } else if (cell === 2){   // limb 瘦长多肢:竖椭圆躯干 + 四足可见
          f = 1 - Math.hypot(u / 0.32, (v + 0.08) / 0.74);
          f = Math.max(f, 0.055 - segDist(u, v, -0.15, 0.20, -0.50, 0.98));
          f = Math.max(f, 0.055 - segDist(u, v, 0.15, 0.20, 0.50, 0.98));
          f = Math.max(f, 0.05 - segDist(u, v, -0.12, 0.42, -0.40, 1.05));
          f = Math.max(f, 0.05 - segDist(u, v, 0.12, 0.42, 0.40, 1.05));
          s = shapeOf(f, () => 0.82);
          a = s[0]; lum = s[1]; rim = s[2];
          core = Math.min(1, Math.max(0, (0.10 - Math.hypot(u, v + 0.30)) * 12));  // venom 眼
        } else if (cell === 3){   // boss 巨形复眼:圆盘 + 双角 + 三眼(venom 高亮)
          f = 0.76 - Math.hypot(u, v - 0.06);
          f = Math.max(f, 0.17 - Math.hypot((u + 0.40) * 1.5, v + 0.88));
          f = Math.max(f, 0.17 - Math.hypot((u - 0.40) * 1.5, v + 0.88));
          s = shapeOf(f, () => 0.48 + 0.3 * Math.max(0, 0.85 - Math.hypot(u, v)));
          a = s[0]; lum = s[1]; rim = s[2];
          core = Math.min(1, Math.max(0, (0.13 - Math.hypot(u, v + 0.10)) * 10),
                          Math.max(0, (0.095 - Math.hypot(u - 0.30, v - 0.02)) * 10),
                          Math.max(0, (0.095 - Math.hypot(u + 0.30, v - 0.02)) * 10));
        } else if (cell === 4){   // gem 星火(经验宝石,沿用)
          const dd = Math.abs(u) + Math.abs(v);
          a = Math.min(1, Math.max(0, (0.62 - dd) * 6));
          lum = a * (0.7 + 0.3 * Math.max(0, 1 - dd * 2));
          core = Math.max(0, 1 - dd * 3.5);
        } else if (cell === 5){   // proj 弹道长菱形(沿用)
          const dd = Math.abs(u) * 2.2 + Math.abs(v) * 0.75;
          a = Math.min(1, Math.max(0, (1 - dd) * 5));
          lum = a * (0.6 + 0.4 * Math.max(0, 1 - dd));
          core = Math.max(0, 1 - dd * 1.6);
        } else if (cell === 6){   // player 烛焰泪滴:下圆上尖(三层火焰共用此形)
          const body = 0.36 - Math.hypot(u, v - 0.10);
          const tip = Math.min((v + 0.95) * 0.34 - Math.abs(u), (0.12 - v));
          f = Math.max(body, tip);
          s = shapeOf(f, () => Math.min(1, 0.5 + 0.5 * (1 - Math.min(1, Math.abs(u) * 2.2)) * (0.65 + 0.35 * (v + 0.95))));
          a = s[0]; lum = s[1]; rim = 0;   // 火焰不描边,层次由三层 tint 承担
          core = Math.min(1, Math.max(0, (0.16 - Math.hypot(u * 1.25, v - 0.02)) * 6));
        } else {                  // spark 径向柔光点(弹道/火珠/光晕共用)
          const r2 = u * u + v * v;
          lum = Math.exp(-r2 * 5.0); a = Math.min(1, lum * 1.6);
          core = Math.exp(-r2 * 18.0);
        }
        const i = ((oy + y) * S + (ox + x)) * 4;
        d[i] = Math.round(Math.min(1, lum) * 255);
        d[i+1] = Math.round(Math.min(1, rim) * 255);
        d[i+2] = Math.round(Math.min(1, core) * 255);
        d[i+3] = Math.round(Math.min(1, a) * 255);
      }
    }
    return { data: d, w: S, h: SH };
  }

  /* ---------- 程序 / RT / 网格(全部走资源重建表) ---------- */
  const prog = {}, mesh = {}, rt = {};
  let atlasTex = null, W = 0, H = 0, dprEff = 1, bloomDiv = 2;

  function compile(type, src){
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error('shader: ' + gl.getShaderInfoLog(s));
    return s;
  }
  function makeProgram(vs, fs){
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('link: ' + gl.getProgramInfoLog(p));
    p._u = {};
    const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++){ const info = gl.getActiveUniform(p, i); p._u[info.name] = gl.getUniformLocation(p, info.name); }
    return p;
  }
  function makeRT(w, h){
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    const filt = (hdrOK && halfFloatLinear) || !hdrOK ? gl.LINEAR : gl.NEAREST;
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filt);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filt);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    if (isGL2){
      if (hdrOK) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
      else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    } else {
      if (hdrOK) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, 0x8D61, null);
      else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    }
    const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);

  function makeBatch(cap){
    const m = { cap, vao: null, quad: gl.createBuffer(), inst: gl.createBuffer(), ibo: gl.createBuffer() };
    gl.bindBuffer(gl.ARRAY_BUFFER, m.quad);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-0.5,-0.5, 0.5,-0.5, 0.5,0.5, -0.5,0.5]), gl.STATIC_DRAW);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, m.ibo);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0,1,2, 0,2,3]), gl.STATIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, m.inst);

    return m;
  }
  function bindBatchAttribs(m){
    const aCorner = gl.getAttribLocation(prog.sprite, 'aCorner');
    gl.bindBuffer(gl.ARRAY_BUFFER, m.quad);
    gl.enableVertexAttribArray(aCorner); gl.vertexAttribPointer(aCorner, 2, gl.FLOAT, false, 0, 0);
    attribDivisor(aCorner, 0);                       // 角点逐顶点,显式归零防串扰
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, m.ibo);
    gl.bindBuffer(gl.ARRAY_BUFFER, m.inst);
    const names = ['aPos','aScale','aScaleY','aRot','aTint','aAlpha','aCell','aLit'];
    const sizes = [2,1,1,1,3,1,1,1]; let off = 0;   // 合计 = INST_FLOATS(11),错位会压扁精灵
    for (let i = 0; i < 8; i++){
      const loc = gl.getAttribLocation(prog.sprite, names[i]);
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, sizes[i], gl.FLOAT, false, INST_FLOATS * 4, off * 4);

  }
  function initPrograms(){
    prog.sprite = makeProgram(VS_SPRITE, FS_SPRITE);
    prog.bg = makeProgram(VS_QUAD, FS_BG);
    prog.bright = makeProgram(VS_QUAD, FS_BRIGHT);
    prog.blur = makeProgram(VS_QUAD, FS_BLUR);
    prog.upadd = makeProgram(VS_QUAD, FS_UPADD);
    prog.composite = makeProgram(VS_QUAD, FS_COMPOSITE);
    prog.copy = makeProgram(VS_QUAD, FS_COPY);
  }
  function initAtlas(){
    const a = buildAtlas();
    atlasTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, atlasTex);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, a.w, a.h, 0, gl.RGBA, gl.UNSIGNED_BYTE, a.data);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  }
  function initMeshes(){
    mesh.quad = { vbo: gl.createBuffer(), ibo: gl.createBuffer() };
    gl.bindBuffer(gl.ARRAY_BUFFER, mesh.quad.vbo);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, 1,1, -1,1]), gl.STATIC_DRAW);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, mesh.quad.ibo);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0,1,2, 0,2,3]), gl.STATIC_DRAW);
    mesh.norm = makeBatch(BATCH_NORM);
    mesh.add = makeBatch(BATCH_ADD);

  function initRTs(){
    if (W === 0) return;

    for (let i = 0; i < 3; i++){
      if (rt['mip'+i]){ gl.deleteTexture(rt['mip'+i].tex); gl.deleteFramebuffer(rt['mip'+i].fb); }
      if (rt['ping'+i]){ gl.deleteTexture(rt['ping'+i].tex); gl.deleteFramebuffer(rt['ping'+i].fb); }
    }

    for (let i = 0; i < 3; i++){

  /* 资源重建表 + 带重试重建(context 恢复初期丢失态 getter 返回 false 会使 compile 抛错) */
  const RES_TABLE = [
    { name: 'programs', init: initPrograms },
    { name: 'atlas', init: initAtlas },
    { name: 'meshes', init: initMeshes },
    { name: 'rt-chain', init: initRTs }
  ];
  function rebuildAll(){ stats.rebuilds++; for (const r of RES_TABLE) r.init(); }
  function tryRebuild(attempt){
    try { createContext(); rebuildAll(); rebuildErr = ''; }
    catch (err){
      rebuildErr = String((err && err.message) || err).slice(0, 60);
      if (attempt < 12) setTimeout(() => tryRebuild(attempt + 1), 250);
    }
  }

  /* ---------- 渲染状态 ---------- */
  let camX = 0, camY = 0;                        // 视野中心(世界坐标;juice 经 setCamera 写入震屏偏移)
  const light = { x: 0, y: 0, r: 0, on: false }; // 玩家光圈(伪 2D 光照)
  let pulse = 0, colorT = 0;                     // 受击红脉冲 / 色彩脚本(挂线)
  let candleT = 0, candleVal = 1;                // 烛光时钟
  let level = 0;                                 // 当前降级档 L0-L4
  let drawCalls = 0;
  // 实例队列(每帧 begin 清零,sprite 填充,end 上传绘制)
  const instNorm = new Float32Array(BATCH_NORM * INST_FLOATS);
  const instAdd = new Float32Array(BATCH_ADD * INST_FLOATS);
  let nNorm = 0, nAdd = 0;

  /* ---------- 性能统计(clamp ≤100ms,防卡顿/后台污染) ---------- */
  const ftRing = new Float32Array(FT_RING), ftSort = new Float32Array(FT_RING);
  let ftIdx = 0, ftCount = 0, lastStatAt = 0, lastBeginAt = 0;
  let overSince = -1, underSince = -1, lastDownAt = 0;
  const stats = { fps: 0, avg: 0, p95: 0, drawCalls: 0, level: 0,
                  frameErrors: 0, rebuilds: 0, api: '-', hdr: '-',
                  layerRebuilds: 0, lastRebuildSrc: '', dprEff: 0 };

  function resetStats(){
    ftIdx = 0; ftCount = 0; lastStatAt = 0; lastBeginAt = 0;
    overSince = -1; underSince = -1;
    stats.fps = 0; stats.avg = 0; stats.p95 = 0;
  }
  function sampleFrame(now){
    if (lastBeginAt){
      const ms = Math.min(FRAME_MS_CAP, Math.max(0, now - lastBeginAt));   // clamp(bug 2 修复项)
      ftRing[ftIdx] = ms; ftIdx = (ftIdx + 1) % FT_RING;
      if (ftCount < FT_RING) ftCount++;
    }
    lastBeginAt = now;
    if (now - lastStatAt < 100) return;                  // 统计刷新 ≤10Hz
    lastStatAt = now;
    const n = ftCount;
    if (n === 0) return;   // resetStats 后首帧(lastBeginAt 未立)无样本:p95 会取 arr[-1]=undefined,下游 toFixed 崩
    ftSort.set(ftRing.subarray(0, n));
    const arr = ftSort.subarray(0, n);
    arr.sort((a, b) => a - b);
    let sum = 0;
    for (let i = 0; i < n; i++) sum += arr[i];
    stats.avg = sum / n;
    stats.p95 = arr[Math.min(n - 1, Math.floor(n * 0.95))];
    stats.fps = 1000 / Math.max(0.01, stats.avg);
    stats.level = level;
  }

  /* ---------- L0-L4 动态降级(先 GPU 填充率后 CPU 逻辑,plan §4) ----------
   * renderer 内动作:L2 bloom 1/4 · L3 关颗粒暗角 · L4 关 bloom+DPR=1;
   * CPU 侧(L1 粒子×0.5 / L3 实体上限 180)经 bus.emit('qualityChange') 外发。 */
  function applyLevel(lv){
    level = lv; stats.level = lv;
    const newDiv = (lv >= 2) ? 4 : 2;
    if (newDiv !== bloomDiv){ bloomDiv = newDiv; initRTs(); }
    resize();                                    // L4 的 DPR=1 在 resize 内生效

  function updateDegrade(now){

      underSince = -1;
      if (now - overSince > DOWN_HOLD_MS && level < 4 && now - lastDownAt > 1500){
        applyLevel(level + 1); lastDownAt = now; overSince = -1;
      }
    } else if (p95 > 0 && p95 < P95_UP_MS){
      if (underSince < 0) underSince = now;
      overSince = -1;
      if (now - underSince > UP_HOLD_MS && level > 0){ applyLevel(level - 1); underSince = -1; }

  /* ---------- 内部绘制助手 ---------- */
  function drawQuad(p){

    gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  /* ---------- iOS 合成层重建(P4:WebKit 光栅化倍率锁定的唯一解) ----------
   * 病理:iOS 把 canvas 合成层光栅化倍率锁在加载过渡态,改后备缓冲尺寸不重光栅化,
   * 满分辨率缓冲被压成低倍率纹理再放大(双损糊);唯一解=强制整层重建。
   * 触发:resize 缓冲真变化 / webglcontextrestored / orientationchange / window load。

  const IS_IOS = (() => {

    if (!IS_IOS) return;                            // 非 iOS:恒无操作
    if (src) lastRebuildSrc = src;
    if (ctxLost) { rebuildDirty = true; return; }   // context lost 期间:顺延到 restored 后
    if (rebuildBusy || rebuildTimer) { rebuildDirty = true; return; }  // 合并:只再排一次
    rebuildTimer = setTimeout(runLayerRebuild, 300);   // 防抖:300ms 内连续变化只重建一次
  }
  function runLayerRebuild(){
    rebuildTimer = 0;
    if (ctxLost) { rebuildDirty = true; return; }
    rebuildBusy = true;
    rebuildDirty = false;
    stats.layerRebuilds++;
    stats.lastRebuildSrc = lastRebuildSrc;          // 诊断:最近触发源
    canvas.style.display = 'none';
    void canvas.offsetHeight;                       // 强制 reflow:整层抽离渲染树
    requestAnimationFrame(() => requestAnimationFrame(() => {
      canvas.style.display = '';                    // 隔 2 帧放回;display:none 不丢 GL 上下文
      rebuildBusy = false;                          //   (tryRebuild/重建表不被干扰,首帧即正常渲染)
      if (rebuildDirty) { rebuildDirty = false; scheduleLayerRebuild(lastRebuildSrc); }

  window.addEventListener('orientationchange', () => scheduleLayerRebuild('orient'));
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) scheduleLayerRebuild('visi');   // 变 visible 调度(用户"后退再前进变清晰"同路径)
  });

  setTimeout(() => scheduleLayerRebuild('load3s'), 3000);

  // 【硬重建补丁点 C:lost/restored 监听挂在本 canvas 上;克隆替换方案须随克隆节点一并迁移】

  /* ---------- 画质三档(P4 第二轮:iPhone 3× 屏被 1.5 钳成半精度渲染=天然糊) ----------
   * 高清 min(dpr,3) / 均衡 min(dpr,1.5) / 流畅 min(dpr,1),持久化 embernight.quality。
   * 默认:iOS=高清(病灶所在),非 iOS=均衡(保护低端 GPU 填充率冻结决策,不引入回归)。
   * 与降级阶梯组合:L0/L1 按画质档,L2/L3 钳 1.5、L4 钳 1(照旧),恢复升档自动回到画质档。 */
  const QUALITY_CAPS = { high: 3, balanced: 1.5, smooth: 1 };
  let qualityTier = (() => {
    const saved = Platform.storage.get('embernight.quality', null);
    if (saved && QUALITY_CAPS[saved]) return saved;

  })();
  function setQuality(tier){
    if (!QUALITY_CAPS[tier]) return qualityTier;

      try { Platform.storage.set('embernight.quality', tier); } catch (_){}
      resize();                                // 立即按新档重算缓冲;尺寸变化→iOS 图层重建自动组合触发
    }
    return qualityTier;
  }

function createUI({ bus, Platform }) {
  const root = document.createElement('div');
  root.className = 'ember-ui';
  const style = document.createElement('style');
  style.textContent = CSS;
  root.appendChild(style);
  root.insertAdjacentHTML('beforeend', `

    <div class="screen screen-settings">
      <div class="set-panel">
        <div class="set-title">设 置</div>

        <div class="set-row"><span>音效</span><input type="range" min="0" max="100" value="80" data-bus="sfx"></div>
        <div class="set-row"><span>界面</span><input type="range" min="0" max="100" value="80" data-bus="ui"></div>
        <div class="set-row"><span>画质</span><span class="set-qs">
          <button class="btn-plain set-q" type="button" data-q="high">高清</button>
          <button class="btn-plain set-q" type="button" data-q="balanced">均衡</button>
          <button class="btn-plain set-q" type="button" data-q="smooth">流畅</button>

    </div>`);
  document.body.appendChild(root);

  // ---- 句柄 ----
  const $ = (sel) => root.querySelector(sel);
  const hud = $('.hud');
  const el = {
    title: $('.screen-title'), char: $('.screen-char'), draft: $('.screen-draft'),
    settle: $('.screen-settle'), victory: $('.screen-victory'), hall: $('.screen-hall'),
    settings: $('.screen-settings'), pause: $('.screen-pause'),
    level: $('.hud-level'), levelNum: $('.hud-level b'),
    hpGhost: $('.bar-hp .ghost'), hpFill: $('.bar-hp .fill'), hpText: $('.hp-text'),
    time: $('.hud-time'), kills: $('.hud-kills b'), xpFill: $('.bar-xp .fill'),
    wicons: $('.hud-bl'), draftRow: $('.draft-row'), charRow: $('.char-row'),
    tlMarks: $('.tl-marks'), tlCur: $('.tl-cur'),
    boss: $('.bosshp'), bossName: $('.bosshp .bname'), bossFill: $('.bosshp .fill'),
  };
  const show = (node) => node.classList.add('on');
  const hide = (node) => node.classList.remove('on');
  const hideScreens = () => [el.title, el.char, el.draft, el.settle, el.victory, el.hall, el.settings].forEach(hide);

  // ======================================================================
  // 标题页(v3:背景透明,让位给演示波;opts.demo 由集成者保证)
  // ======================================================================
  function showTitle(onIgnite, opts) {
    el.title.querySelector('.btn-ember').onclick = () => {
      bus.emit('uiClick', {});
      hide(el.title);
      if (onIgnite) onIgnite();
    };
    show(el.title);
  }

  // ======================================================================
  // 角色卡(契约 v3 §3)
  // chars: [{id,name,rule,cardDesc,unlocked?,riddle?|unlock?}]
  // ======================================================================
  function showCharSelect(chars, onPick) {
    el.charRow.innerHTML = (chars || []).map((c, i) => {
      const cc = charColor(c.id);
      const unlocked = c.unlocked !== false;
      const riddle = c.riddle || (c.unlock && c.unlock.riddle) || '???';
      return `<div class="char-card${unlocked ? '' : ' locked'}" data-i="${i}"
        style="--cc:${cc}; animation-delay:${i * 110}ms">
        ${candleSVG(cc, !unlocked)}
        <div class="cname">${c.name || ''}</div>
        <div class="crule">${unlocked ? (c.rule || '') : '未 燃 之 谜'}</div>
        ${unlocked
          ? `<div class="cdesc">${c.cardDesc || ''}</div>`
          : `<div class="riddle">${riddle}</div><div class="locktag">剪 影 锁 定</div>`}

    }).join('');
    el.charRow.querySelectorAll('.char-card:not(.locked)').forEach((cardEl) => {
      cardEl.addEventListener('click', () => {
        bus.emit('uiClick', {});
        const c = chars[Number(cardEl.dataset.i)];
        hide(el.char);
        if (onPick) onPick(c);

    });
    show(el.char);
  }

  // ======================================================================
  // HUD
  // ======================================================================
  function showHUD() {
    hideScreens();
    show(hud);
  }
  const cache = { hp: -1, maxHp: -1, xp: -1, xpNext: -1, level: -1, kills: -1, sec: -1, icons: '' };
  function updateHUD(s) {
    if (!s) return;
    const maxHp = s.maxHp || 1;
    if (s.hp !== cache.hp || s.maxHp !== cache.maxHp) {
      const r = Math.max(0, Math.min(1, s.hp / maxHp));
      if (s.hp > cache.hp && cache.hp >= 0) {
        el.hpGhost.classList.add('snap');
        el.hpGhost.style.transform = `scaleX(${r})`;
        void el.hpGhost.offsetWidth;
        el.hpGhost.classList.remove('snap');
      } else {
        el.hpGhost.style.transform = `scaleX(${r})`;
      }
      el.hpFill.style.transform = `scaleX(${r})`;
      el.hpText.textContent = `${Math.ceil(s.hp)} / ${maxHp}`;
      cache.hp = s.hp; cache.maxHp = s.maxHp;
    }
    if (s.xp !== cache.xp || s.xpNext !== cache.xpNext) {
      el.xpFill.style.transform = `scaleX(${Math.max(0, Math.min(1, s.xp / (s.xpNext || 1)))})`;
      cache.xp = s.xp; cache.xpNext = s.xpNext;
    }
    if (s.level !== cache.level) { el.levelNum.textContent = s.level; cache.level = s.level; }
    if (s.kills !== cache.kills) { el.kills.textContent = s.kills; cache.kills = s.kills; }
    const sec = Math.floor(s.timeLeft || 0);
    if (sec !== cache.sec) { el.time.textContent = fmtTime(sec); cache.sec = sec; }
    const icons = JSON.stringify(s.weaponIcons || []);
    if (icons !== cache.icons) {
      cache.icons = icons;
      // B2:构筑图标 + 等级角标(·/II/III,evo 金框);data-icon 供觉醒演出匹配

  shake: { maxTrauma: 1, decay: 1.3, maxShift: 16, maxRotRad: 2 * Math.PI / 180, freq: 14 },
};

/* easeOutBack 兜底(core.js 并行开发,契约 §1 保证存在;缺失时用本地实现) */
const easeOutBack = (Ease && Ease.easeOutBack)
  || (t => { const c = 1.70158, u = t - 1; return 1 + (c + 1) * u * u * u + c * u * u; });
/* 数值格式化空值兜底(防御:任何上游 NaN/undefined 不许击穿 DOM 写入) */
const F = (v, d) => (Number.isFinite(v) ? v : 0).toFixed(d);

/* 1D Perlin 梯度噪声(震屏用;值域约 [-1,1]) */
function makePerlin(seed) {
  let s = (seed >>> 0) || 1;
  const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; const t = p[i]; p[i] = p[j]; p[j] = t; }
  const perm = new Uint8Array(512);
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
  const grad = (h, x) => ((h & 1) ? -x : x);
  return x => {
    const X = Math.floor(x) & 255, xf = x - Math.floor(x), u = fade(xf);
    return (grad(perm[X], xf) * (1 - u) + grad(perm[X + 1], xf - 1) * u) * 2;
  };
}

function createJuice({ bus, Time, renderer, audio, ui }) {
  const P = PARAMS;
  const reducedMotion = typeof matchMedia === 'function'
    && matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------------- DOM 层:.dmg-layer(juice 自建,pointer-events:none) ---------------- */
  const style = document.createElement('style');
  style.textContent = `
.dmg-layer{ position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:6; }
.jnum{ position:fixed; display:none; transform:translate(-50%,-50%);
  font:700 15px/1 Georgia,"Songti SC","STSong","SimSun",serif;   /* P4:衬线数字(圣经同款) */
  color:${PAL.BLOOD};
  text-shadow:1px 0 0 ${PAL.ABYSS},-1px 0 0 ${PAL.ABYSS},0 1px 0 ${PAL.ABYSS},0 -1px 0 ${PAL.ABYSS},0 2px 5px ${PAL.ABYSS};
  will-change:transform,opacity;
  animation:jnumPop ${P.kill.number.life}s cubic-bezier(.34,1.56,.64,1) forwards; }
@keyframes jnumPop{
  0%{ transform:translate(-50%,-50%) scale(.3); opacity:0; }
  18%{ transform:translate(-50%,-62%) scale(1.18); opacity:1; }
  100%{ transform:translate(-50%,calc(-50% - ${P.kill.number.rise}px)) scale(1); opacity:0; } }
.jpart{ position:fixed; border-radius:50%; opacity:1; will-change:transform,opacity;
  animation:jpartFly .5s ease-out forwards; }
@keyframes jpartFly{
  0%{ transform:translate(-50%,-50%) scale(1); opacity:1; }
  100%{ transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2); opacity:0; } }
.jbeam{ position:fixed; left:50%; top:50%; width:90px; height:130vh; mix-blend-mode:screen; opacity:0;
  background:linear-gradient(to top,transparent,${PAL.EMBER_CORE} 42%,${PAL.HERO_HI} 50%,${PAL.EMBER_CORE} 58%,transparent);
  animation:jbeamUp ${P.levelUp.beamSec}s ease-out forwards; will-change:transform,opacity; }
@keyframes jbeamUp{
  0%{ transform:translate(-50%,-50%) scaleY(0); opacity:0; }
  25%{ transform:translate(-50%,-50%) scaleY(1); opacity:.9; }
  100%{ transform:translate(-50%,-50%) scaleY(1.15); opacity:0; } }
.jstreak{ position:fixed; left:50%; top:50%; width:120px; height:4px; border-radius:2px; opacity:1;
  background:linear-gradient(90deg,transparent,${PAL.GOLD});
  animation:jstreakGo ${P.draftPick.streakSec}s ease-in forwards; will-change:transform,opacity; }
@keyframes jstreakGo{
  /* B4 去歧义:明确飞向构筑栏(左下),不再像"射出一支箭" */
  0%{ transform:translate(-50%,-50%) rotate(-6deg) scale(1); opacity:1; }
  100%{ transform:translate(calc(-50% - 34vw),calc(-50% + 36vh)) rotate(-6deg) scale(.45); opacity:0; } }
.chain-layer{ position:fixed; left:50%; top:38%; transform:translate(-50%,-50%); display:flex; gap:10px;
  transition:opacity .25s; }
.chain-layer.out{ opacity:0; }
.chain-chip{ width:44px; height:44px; border-radius:8px; display:flex; align-items:center; justify-content:center;
  font:700 20px/1 "Songti SC","SimSun",serif; color:${PAL.GHOUL_RIM}; background:${PAL.INK};
  border:1px solid ${PAL.GHOUL}; transform:scale(.6); opacity:.55; }
.chain-chip.pas{ border-color:${PAL.VENOM}; }
.chain-chip.pop{ animation:chipPop .34s cubic-bezier(.34,1.56,.64,1) forwards; }
.chain-chip.lit{ color:${PAL.ABYSS}; background:${PAL.EMBER_CORE}; border-color:${PAL.GOLD};
  box-shadow:0 0 14px ${PAL.EMBER_MID}; opacity:1; }
@keyframes chipPop{ 0%{ transform:scale(.6);} 60%{ transform:scale(1.25);} 100%{ transform:scale(1);} }
.evoburst{ position:fixed; inset:-20%; mix-blend-mode:screen; opacity:0;
  background:radial-gradient(closest-side,${PAL.HERO_HI},${PAL.EMBER_CORE} 35%,${PAL.EMBER_EDGE} 60%,transparent 72%);
  animation:evoGo .7s ease-out forwards; will-change:transform,opacity; }
@keyframes evoGo{ 0%{ transform:scale(.15); opacity:.95; } 100%{ transform:scale(1.4); opacity:0; } }
.dawnwarm{ position:fixed; inset:-25%; mix-blend-mode:screen; opacity:0;
  background:radial-gradient(closest-side,${PAL.HERO_HI},${PAL.EMBER_CORE} 30%,${PAL.GOLD} 55%,transparent 75%);
  animation:dawnGo 1.6s ease-in-out forwards; will-change:transform,opacity; }
@keyframes dawnGo{ 0%{ transform:scale(.5); opacity:0; } 30%{ opacity:.85; } 100%{ transform:scale(1.25); opacity:0; } }
.jburn{ border-radius:2px; }`;
  document.head.appendChild(style);
  const layer = document.createElement('div');
  layer.className = 'dmg-layer';
  document.body.appendChild(layer);
  const w2s = (x, y) => (renderer && renderer.worldToScreen) ? renderer.worldToScreen(x, y) : { x, y };
  const restartAnim = el => { el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; };

  /* ---------------- 伤害数字:池化 ≤40,easeOutBack 放大,同目标 0.3s 聚合 ---------------- */
  const numPool = [], numActive = [], aggMap = new Map();
  for (let i = 0; i < BUDGET.numbers; i++) {
    const el = document.createElement('div');
    el.className = 'jnum'; el.style.display = 'none';
    el.addEventListener('animationend', () => { if (el._entry) releaseNum(el._entry); });
    layer.appendChild(el); numPool.push(el);
  }
  function releaseNum(en) {
    const i = numActive.indexOf(en); if (i >= 0) numActive.splice(i, 1);
    if (en.target && aggMap.get(en.target) === en) aggMap.delete(en.target);
    en.el.style.display = 'none'; en.el._entry = null; numPool.push(en.el);
  }
  function spawnNumber(x, y, amount, target) {
    const now = performance.now() / 1000;
    const agg = target && aggMap.get(target);
    if (agg && now < agg.until) { // 同目标 0.3s 聚合:累加并重弹
      agg.amount += amount; agg.until = now + P.kill.number.mergeWindow;
      agg.el.textContent = agg.amount; restartAnim(agg.el);
      return;
    }
    if (!numPool.length) { if (numActive.length) releaseNum(numActive[0]); else return; } // 池满复用最旧
    const el = numPool.pop(), pt = w2s(x, y);
    const en = { el, amount, until: now + P.kill.number.mergeWindow, target, bornAt: now };
    el._entry = en;
    el.textContent = amount;
    el.style.left = pt.x + 'px'; el.style.top = pt.y + 'px';
    el.style.display = 'block'; restartAnim(el);
    numActive.push(en);
    if (target) aggMap.set(target, en);
  }

  /* ---------------- 粒子 burst / 光柱 / 飞出条(DOM,transform/opacity) ---------------- */
  let aliveParts = 0;
  function spawnParticles(x, y, count) {
    const K = P.kill.particles, pt = w2s(x, y);
    const n = Math.min(count, BUDGET.particles - aliveParts); // 高密度降级
    for (let i = 0; i < n; i++) {
      const el = document.createElement('div');
      el.className = 'jpart';
      const ang = Math.random() * Math.PI * 2;
      const sp = K.speed[0] + Math.random() * (K.speed[1] - K.speed[0]);
      const life = K.life * (0.7 + Math.random() * 0.6);
      const size = K.size[0] + Math.random() * (K.size[1] - K.size[0]);
      el.style.cssText = `left:${pt.x}px;top:${pt.y}px;width:${size}px;height:${size}px;`
        + `--dx:${F(Math.cos(ang) * sp * life, 1)}px;--dy:${F(Math.sin(ang) * sp * life, 1)}px;`
        + `background:${K.colors[(Math.random() * K.colors.length) | 0]};animation-duration:${F(life, 2)}s;`;
      aliveParts++;
      el.addEventListener('animationend', () => { el.remove(); aliveParts--; }, { once: true });
      layer.appendChild(el);
    }
  }
  function spawnBeam() {
    const el = document.createElement('div');
    el.className = 'jbeam';
    el.addEventListener('animationend', () => el.remove(), { once: true });
    layer.appendChild(el);
  }
  function spawnStreak() {
    const el = document.createElement('div');
    el.className = 'jstreak';
    el.addEventListener('animationend', () => el.remove(), { once: true });
    layer.appendChild(el);
  }

  /* ---------------- enemy.fx* 瞬态(闪白/squash/击退),juice rAF 内逐帧推进 ---------------- */
  const fxMap = new Map(); // enemy -> {flash, sT, kvx, kvy};条目均 ≤0.3s 自然消亡,Map 不泄漏
  const fxOf = e => { let f = fxMap.get(e); if (!f) { f = { flash: 0, sT: Infinity, kvx: 0, kvy: 0 }; fxMap.set(e, f); } return f; };

  /* ---------------- trauma 震屏:trauma²×Perlin 位移 + ±2° 旋转,线性衰减 ---------------- */
  let traumaVal = 0, vignette = 0, shakeT = 0;
  const nX = makePerlin(11), nY = makePerlin(37), nR = makePerlin(83);

  /* ---------------- 事件→反馈映射(全部走 bus 订阅) ---------------- */
  function onEnemyHit(p) {
    const e = p.enemy; if (!e) return;
    const f = fxOf(e);
    f.flash = 1; e.fxFlash = 1;              // 受击闪白 80ms(gameplay 用 lit 覆盖消费)
    f.sT = 0;                                // squash 重启
    const ang = (p.dir !== undefined) ? p.dir : Math.random() * Math.PI * 2; // 契约载荷无方向,缺省随机
    f.kvx = Math.cos(ang) * P.enemyHit.kickDist * P.enemyHit.kickDecay; // 指数衰减位移,总行程≈kickDist
    f.kvy = Math.sin(ang) * P.enemyHit.kickDist * P.enemyHit.kickDecay;
  }
  const tierOf = e => (e && e.boss) ? 'boss' : (e && e.elite) ? 'elite' : 'normal';
  let lastNormalStop = -9;   // 普通击杀顿帧共享窗口计时(Time.now 游戏时间口径,与 magnetUntil 等一致)
  function onKill(p) {
    const t = tierOf(p.enemy), K = P.kill;
    spawnParticles(p.x, p.y, K.particles[t]);
    const amount = Math.round(p.overkill || (p.enemy && p.enemy.lastDmg) || 0); // kill 载荷无 dmg,取 overkill/lastDmg
    if (amount > 0) spawnNumber(p.x, p.y, amount, p.enemy);
    if (t === 'normal') {
      if (Time.now - lastNormalStop >= K.normalShareMs / 1000) {   // 普通击杀:250ms 窗口共享一次顿帧
        lastNormalStop = Time.now;
        Time.hitStop(K.hitstop[t]);
      }                                                     // 窗内击杀:粒子/数字照常,仅免顿帧
    } else {
      Time.hitStop(K.hitstop[t]);                           // 精英/Boss:完整分级顿帧(节奏高潮)
      if (t === 'boss') Time.slowMo(K.bossSlowMo.sec, K.bossSlowMo.scale);
    }
    if (p.enemy) fxMap.delete(p.enemy);
  }
  function onPlayerHit() {
    vignette = P.playerHit.vignette;                  // 红脉冲,rAF 内回落写 renderer
    api.trauma.add(P.playerHit.trauma);
    api.playerFlashUntil = Time.now + P.playerHit.iframeBlinkSec; // i-frame 闪烁标志,gameplay 拉取
    if (audio && audio.play) audio.play('hit');
  }
  function onLevelUp() {
    Time.slowMo(P.levelUp.slowMoSec, P.levelUp.slowMoScale); // 慢动作 0.1×/300ms
    spawnBeam();                                             // 升级光柱(additive 观感竖条)
    api.magnetUntil = Time.now + P.levelUp.magnetSec;        // 全屏磁吸标志,gameplay 拉取
  }
  function onDraftPick() {
    spawnStreak();                                           // 卡片飞出(金色飞条;卡面 DOM 属 ui,见报告)
    if (audio && audio.play) audio.play('ui');
  }
  bus.on('enemyHit', onEnemyHit);
  bus.on('kill', onKill);
  bus.on('playerHit', onPlayerHit);
  bus.on('levelUp', onLevelUp);
  bus.on('draftPick', onDraftPick);

  /* ---------------- Phase 3:连锁跳数 / 黎明演出 / bossDown ---------------- */
  // 径向全屏爆发(evolution / dawn 共用;additive 观感 = mix-blend screen)
  function spawnRadialBurst(cls, sec) {
    const el = document.createElement('div');
    el.className = cls;
    el.style.animationDuration = sec + 's';
    el.addEventListener('animationend', () => el.remove(), { once: true });
    layer.appendChild(el);
  }
  // 燃尽粒子(黎明用):向上飘的余烬,共享 aliveParts 预算(高密度降级)
  function spawnBurn(x, y, count) {
    const pt = w2s(x, y);
    const n = Math.min(count, BUDGET.particles - aliveParts);
    for (let i = 0; i < n; i++) {
      const el = document.createElement('div');
      el.className = 'jpart jburn';
      const life = 0.55 + Math.random() * 0.45;
      const size = 2.5 + Math.random() * 4;
      el.style.cssText = `left:${pt.x}px;top:${pt.y}px;width:${size}px;height:${size}px;`
        + `--dx:${F((Math.random() - 0.5) * 60, 1)}px;--dy:${F(-40 - Math.random() * 90, 1)}px;`
        + `background:${P.kill.particles.colors[(Math.random() * 3) | 0]};animation-duration:${F(life, 2)}s;`;
      aliveParts++;
      el.addEventListener('animationend', () => { el.remove(); aliveParts--; }, { once: true });
      layer.appendChild(el);
    }
  }
  /* chainPop(items, onDone):图标 120ms 序逐个高亮弹跳(scale easeOutBack),每跳 play('pickup')
   * (audio 内部连捡爬升 0.8s 窗 >> 120ms 间隔,自然形成上行音阶),末跳 play('evolution')
   * Shepard 扫频 + 全屏 radial 爆发。items:[{icon,role?}] 或字符串数组;重入取消上一场。 */
  let chainTimer = null;
  function chainPop(items, onDone) {
    const list = (items || []).map(it => typeof it === 'string' ? { icon: it } : it);
    if (chainTimer) { clearTimeout(chainTimer); chainTimer = null; }
    const old = layer.querySelector('.chain-layer'); if (old) old.remove();
    if (!list.length) { // 无图标:仍保证演化音 + 爆发 + 回调
      if (audio && audio.play) audio.play('evolution');
      spawnRadialBurst('evoburst', 0.7);
      if (onDone) onDone();
      return;
    }
    const row = document.createElement('div');
    row.className = 'chain-layer';
    const chips = list.map(it => {
      const c = document.createElement('div');
      c.className = 'chain-chip' + (it.role === 'passive' ? ' pas' : '');
      c.textContent = it.icon || '·';
      row.appendChild(c); return c;
    });
    layer.appendChild(row);
    let i = 0;
    const step = () => {
      if (i < chips.length) {
        chips[i].classList.add('pop', 'lit');
        if (audio && audio.play) audio.play('pickup');   // 每跳:五声爬升 +1 步
        i++; chainTimer = setTimeout(step, P.chainPop.interval * 1000);
      } else {
        if (audio && audio.play) audio.play('evolution'); // 末跳:Shepard,与链时序兼容(即触发)
        spawnRadialBurst('evoburst', 0.7);
        chainTimer = setTimeout(() => {
          row.classList.add('out');
          chainTimer = setTimeout(() => { row.remove(); chainTimer = null; }, 260);
          if (onDone) onDone();
        }, P.chainPop.tailSec * 1000);
      }
    };
    step();
  }
  /* dawnSequence(onDone):victory 黎明演出。slowMo 0.3×/1.2s → setColorScript(1) 终局金
   * + 全屏暖光爆发 + 场上敌人 0.8s 逐批燃尽(只读经 api.getEnemies,粒子表现,不直接杀)→ onDone。
   * 演出中重入忽略(bus 自动触发与集成者直调不双演)。 */
  let dawnPlaying = false;
  function dawnSequence(onDone) {
    if (dawnPlaying) return;
    dawnPlaying = true;
    const D = P.dawn;
    Time.slowMo(D.slowMoSec, D.slowMoScale);
    if (renderer && renderer.setColorScript) renderer.setColorScript(1); // 接口已确认存在(renderer.js:520)
    spawnRadialBurst('dawnwarm', D.warmSec);
    const src = api.getEnemies ? api.getEnemies() : null; // 只读钩子,集成者注入
    const list = [];
    if (src) {
      if (typeof src.each === 'function') src.each(e => { if (e && !e.dead) list.push(e); });
      else if (Array.isArray(src)) for (const e of src) if (e && !e.dead) list.push(e);
    }
    const per = Math.max(2, Math.min(6, Math.floor(160 / Math.max(1, list.length))));
    for (let b = 0; b < D.batches; b++)
      setTimeout(() => {
        for (let j = b; j < list.length; j += D.batches) spawnBurn(list[j].x, list[j].y, per);
      }, (D.burnSec / D.batches) * b * 1000);
    setTimeout(() => { dawnPlaying = false; if (onDone) onDone(); }, D.slowMoSec * 1000 + 150);
  }
  bus.on('evolution', () => { // 自动连锁跳数;图标经 api.getBuildIcons 拉取,缺省通用三枚
    const icons = api.getBuildIcons ? (api.getBuildIcons() || []) : [];
    chainPop(icons.length ? icons : [{ icon: '火' }, { icon: '芯' }, { icon: '烛' }]);
  });
  bus.on('victory', () => dawnSequence());
  bus.on('bossDown', () => {
    Time.hitStop(P.bossDown.hitstop);              // 大顿帧 0.15s
    api.trauma.add(P.bossDown.trauma);             // trauma 0.6
    if (audio && audio.play) audio.play('burst');  // 大爆音
  });

  /* ---------------- 自建 rAF:每帧写 renderer.shake / 暗角回落 / enemy.fx* ----------------
   * 工厂时装配,注册先于主循环 rAF → 同帧内先于 renderer.begin 写完,无滞后。 */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    shakeT += dt;
    // trauma 线性衰减,位移=trauma²×Perlin
    traumaVal = Math.max(0, traumaVal - BUDGET.shake.decay * dt);
    const mag = traumaVal * traumaVal * (reducedMotion ? 0.3 : 1);
    const S = BUDGET.shake;
    if (renderer) {
      renderer.shake = renderer.shake || { x: 0, y: 0, rot: 0 };
      renderer.shake.x = nX(shakeT * S.freq) * S.maxShift * mag;
      renderer.shake.y = nY(shakeT * S.freq) * S.maxShift * mag;
      renderer.shake.rot = nR(shakeT * S.freq) * S.maxRotRad * mag; // 弧度,±2°
      if (vignette > 0) {
        vignette = Math.max(0, vignette - P.playerHit.vignetteDecay * dt);
        if (renderer.setVignettePulse) renderer.setVignettePulse(vignette);
      }
    }
    // enemy.fx* 推进
    for (const [e, f] of fxMap) {
      if (f.flash > 0) { f.flash = Math.max(0, f.flash - dt / P.enemyHit.flashSec); e.fxFlash = f.flash; }
      if (f.sT < P.enemyHit.squashSec) {
        f.sT += dt;
        const p01 = Math.min(1, f.sT / P.enemyHit.squashSec);
        const q = 1 - easeOutBack(p01); // 1→0,带回弹过冲
        e.fxScaleX = 1 + (P.enemyHit.squashX - 1) * q;
        e.fxScaleY = 1 - (1 - P.enemyHit.squashY) * q;
        if (p01 >= 1) { e.fxScaleX = 1; e.fxScaleY = 1; }
      }
      if (f.kvx || f.kvy) {
        e.x += f.kvx * dt; e.y += f.kvy * dt;
        const d = Math.exp(-P.enemyHit.kickDecay * dt);
        f.kvx *= d; f.kvy *= d;
        if (Math.abs(f.kvx) < 1 && Math.abs(f.kvy) < 1) { f.kvx = f.kvy = 0; }
      }
      if (!f.flash && f.sT >= P.enemyHit.squashSec && !f.kvx && !f.kvy) fxMap.delete(e);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  const api = {
    onKill(x, y, opts = {}) { onKill({ x, y, enemy: opts.enemy, overkill: opts.overkill }); }, // 仅供不便走 bus 的场合
    chainPop,           // Phase 3:连锁跳数(items:[{icon,role?}]|字符串数组, onDone)
    dawnSequence,       // Phase 3:黎明演出(bus 'victory' 自动触发;重入忽略)
    getEnemies: null,   // 【集成补充】注入:() => 敌人列表(Pool 或数组,只读),dawnSequence 燃尽用
    getBuildIcons: null,// 【集成补充】注入:() => 构筑图标数组,evolution 自动连锁跳数用
    trauma: {
      add(v) { traumaVal = Math.min(BUDGET.shake.maxTrauma, traumaVal + Math.max(0, v || 0)); },
      get value() { return traumaVal; },
