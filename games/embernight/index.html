    // 贴脸焰域:扑心堆积敌(轨道擦不到)持续灼烧
    hash.queryCircle(player.x, player.y, CFG.ring.auraR + 24, e => {
      if (e.dead || (e.ringT && Time.now - e.ringT < CFG.ring.hitCd)) return;
      const rr = CFG.ring.auraR + e.r;
      if ((e.x - player.x) ** 2 + (e.y - player.y) ** 2 > rr * rr) return;
      e.ringT = Time.now;
      hitEnemy(e, S.dmg * m * CFG.ring.auraDmg, {});
    });
    if (w.trails.length > n) w.trails.length = n;
  }
  // 烛泪:落点成潭(持续伤害区);重燃 molten:潭径+45、slow 0.45 锁足
  function stepWaxtear(w, S, m, dt) {
    w.cd -= dt;
    if (w.cd > 0) return;
    const t = nearestEnemy(560);
    if (!t) { w.cd = CFG.arrow.retry; return; }
    zones.spawn({ x: t.x, y: t.y, r: S.poolR, dps: S.dmg * m, slow: S.slow || 0,
                  until: Time.now + S.poolSec, bob: rng.range(0, 6) });
    w.cd = S.cd;
  }
  // 星芒:周期径向多目标打击 + 射向每个目标的可见光束(P4 反馈重做);重燃 nova:范围+80、击退 220
  function stepStarfall(w, S, m, dt) {
    w.cd -= dt;
    if (w.beams) for (let i = w.beams.length - 1; i >= 0; i--) {
      w.beams[i].t -= dt;
      if (w.beams[i].t <= 0) w.beams.splice(i, 1);
    }
    if (w.cd > 0) return;
    const max = S.targets || CFG.star.targetsDefault, r2 = S.range * S.range;
    const list = [];
    enemies.each(e => {
      if (e.dead) return;
      const dd = (e.x - player.x) ** 2 + (e.y - player.y) ** 2;
      if (dd <= r2) list.push([dd, e]);
    });
    list.sort((a, b) => a[0] - b[0]);
    if (!list.length) { w.cd = CFG.arrow.retry; return; }
    w.beams = w.beams || [];
    for (let i = 0; i < Math.min(max, list.length); i++) {
      const e = list[i][1];
      const d = Math.sqrt(list[i][0]) || 1;
      hitEnemy(e, S.dmg * m, S.knockback ? { kx: (e.x - player.x) / d * S.knockback,
                                             ky: (e.y - player.y) / d * S.knockback } : {});
      w.beams.push({ x1: player.x, y1: player.y, x2: e.x, y2: e.y, t: 0.16, max: 0.16 });  // 光矛一瞬
    }
    w.flashT = CFG.star.flashSec;              // 径向闪光(draw 消费)
    w.cd = S.cd;
  }

  function hitEnemy(e, dmg, opts) {
    if (e.dead) return;
    e.hp -= dmg;
    dmgDealt += dmg;                           // A 区审计:伤害量累计(台架断言用)
    e.lastDmg = dmg;                           // juice 伤害数字取 overkill||lastDmg
    if (opts.burn) { e.burnDps = opts.burn; e.burnT = 2; }
    if (opts.kx) { e.kbx = (e.kbx || 0) + opts.kx; e.kby = (e.kby || 0) + opts.ky; }
    bus.emit('enemyHit', { x: e.x, y: e.y, dmg, enemy: e });
    if (e.hp <= 0) killEnemy(e);
  }
  function killEnemy(e) {
    if (e.dead) return;
    e.dead = true;
    kills++;
    bus.emit('kill', { x: e.x, y: e.y, enemy: e, overkill: -e.hp });
  }

  // ===================== 统一弹道(friendly 火矢 / hostile 敌弹) =====================
  function stepShots(dt) {
    _dead.length = 0;
    shots.each(b => {
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      if (b.life <= 0) { _dead.push(b); return; }
      if (b.hostile) {                           // 敌弹 → 打玩家(无敌帧+蜡甲)
        const rr = b.r + player.r;
        if ((b.x - player.x) ** 2 + (b.y - player.y) ** 2 <= rr * rr) {
          _dead.push(b);
          damagePlayer(b.dmg);
        }
        return;
      }
      let hit = null;                            // 玩家弹 → 空间哈希粗筛+精判
      hash.queryCircle(b.x, b.y, b.r + 24, o => {
        if (hit || o.dead) return;
        const rr = b.r + o.r;
        if ((o.x - b.x) ** 2 + (o.y - b.y) ** 2 <= rr * rr) hit = o;
      });
      if (hit) {
        hitEnemy(hit, b.dmg, { burn: b.burn });
        b.pierce = (b.pierce || 1) - 1;
        if (b.pierce <= 0) _dead.push(b);
      }
    });
    for (const b of _dead) shots.despawn(b);
  }

  // ===================== 敌人(AI 全走 enemies.js;hostile 弹经 ctx.spawnBullet) =====================
  const aiCtx = { player: null, spawnBullet: null, summon: null, bus: null, Time: null, rng: null };
  function stepEnemies(dt) {
    enemies.each(e => { if (!e.dead) e.slowF = 0; });           // 减速标记由烛泪潭写入
    enemies.each(e => {
      if (e.dead) return;
      const sdt = e.slowF ? dt * (1 - e.slowF) : dt;            // molten 锁足
      e.ai.update(e, aiCtx, sdt);
      if (e.kbx || e.kby) {                                     // 击退(nova/通用),指数衰减
        e.x += e.kbx * dt; e.y += e.kby * dt;
        const d = Math.exp(-8 * dt);
        e.kbx *= d; e.kby *= d;
        if (Math.abs(e.kbx) < 1 && Math.abs(e.kby) < 1) e.kbx = e.kby = 0;
      }
      if (e.burnT > 0) {                                        // meteor 余烬灼烧(静默持续伤害)
        e.burnT -= dt;
        { const dd = e.burnDps * dt; e.hp -= dd; dmgDealt += dd; }
      }
    });
    if (player.iframes <= 0) {                                  // 玩家接触判定
      hash.queryCircle(player.x, player.y, player.r + 24, o => {
        if (o.dead || player.iframes > 0) return;
        const rr = player.r + o.r;
        if ((o.x - player.x) ** 2 + (o.y - player.y) ** 2 <= rr * rr) damagePlayer(o.dmg);
      });
    }
    // 青烛光环(契约 v3 §5):光圈内的敌人 auraDps×dt 灼烧(静默,sweep 统一结算)
    if (auraDpsCur > 0) {
      enemies.each(e => {
        if (e.dead) return;
        const rr = lightRCur + e.r * 0.5;
        if ((e.x - player.x) ** 2 + (e.y - player.y) ** 2 <= rr * rr) { const dd = auraDpsCur * dt; e.hp -= dd; dmgDealt += dd; }
      });
    }
  }
  function stepZones(dt) {
    _dead.length = 0;
    zones.each(z => {
      if (Time.now >= z.until) { _dead.push(z); return; }
      hash.queryCircle(z.x, z.y, z.r + 24, e => {               // 持续伤害(静默,sweep 统一结算)
        if (e.dead) return;
        const rr = z.r + e.r * 0.5;
        if ((e.x - z.x) ** 2 + (e.y - z.y) ** 2 > rr * rr) return;
        { const dd = z.dps * dt; e.hp -= dd; dmgDealt += dd; }
        if (z.slow) e.slowF = Math.max(e.slowF || 0, z.slow);
      });
    });
    for (const z of _dead) zones.despawn(z);
  }

  // ===================== 星火 / 拾取实体(宝箱/火种) =====================
  function stepGems(dt) {
    _dead.length = 0;
    gems.each(g => {
      const dx = player.x - g.x, dy = player.y - g.y;
      const d = Math.hypot(dx, dy) || 1;
      if (!g.mag && (d < mods.pickup || magnetAllT > 0)) { g.mag = true; g.mt = 0; }
      if (g.mag) {
        g.mt += dt;
        const sp = CFG.magnet.base + CFG.magnet.boost * Ease.easeInQuad(Math.min(g.mt / CFG.magnet.ramp, 1));
        g.x += dx / d * sp * dt;
        g.y += dy / d * sp * dt;
        if (d < player.r + 8) {
          _dead.push(g);
          xp += g.val || 1;
          bus.emit('xpPickup', { x: g.x, y: g.y });   // audio tick+爬升(契约 §7)
        }
      }
    });
    for (const g of _dead) gems.despawn(g);
  }
  function stepPickups(dt) {
    _dead.length = 0;
    pickups.each(p => {
      p.bob += dt;
      if (p.kind === 'flame') {                        // 火种全程磁吸(稀有且关键,不让人漏)
        const dx = player.x - p.x, dy = player.y - p.y;
        const d = Math.hypot(dx, dy) || 1;
        if (d > player.r + p.r) { p.x += dx / d * 260 * dt; p.y += dy / d * 260 * dt; }
      }
      const rr = player.r + p.r;
      if ((p.x - player.x) ** 2 + (p.y - player.y) ** 2 <= rr * rr) {
        _dead.push(p);
        if (p.kind === 'flame') {
          cstate.flames += 1;                          // 火种记账(evolveReady 消耗 1)
          bus.emit('xpPickup', { x: p.x, y: p.y });    // 拾取反馈复用 tick
        } else openChest();
      }
    });
    for (const p of _dead) pickups.despawn(p);
  }
  function openChest() {                               // 宝箱:随机未持有被动或神器(一局限 2 件)
    const artPool = Object.keys(ARTIFACTS).filter(id => !cstate.artifacts.includes(id));
    const pasPool = Object.keys(PASSIVES).filter(id => (cstate.passives[id] | 0) < 3);
    let card = null;
    if (artPool.length && cstate.artifacts.length < 2 && (rng.next() < 0.4 || !pasPool.length))
      card = { kind: 'artifact', id: rng.pick(artPool) };
    else if (pasPool.length) card = { kind: 'passiveNew', id: rng.pick(pasPool) };
    if (card) { cstate = applyCard(cstate, card); syncBuild(); }
  }

  // ===================== 空间哈希 / 清扫 =====================
  function rebuildHash() {
    hash.clear();
    enemies.each(e => { if (!e.dead) hash.insert(e); });
  }
  function sweepDead() {
    _dead.length = 0;
    enemies.each(e => { if (!e.dead && e.hp <= 0) killEnemy(e); });   // 潭/灼烧致死统一走 kill(Boss 掉落经此)
    enemies.each(e => { if (e.dead) _dead.push(e); });
    for (const e of _dead) enemies.despawn(e);
  }

  // ===================== 升级 / 三选一(全走 content) =====================
  function doLevelUp() {
    xp -= xpNext;
    cstate.level += 1;
    xpNext = CFG.xp.base + cstate.level * CFG.xp.perLevel;
    phase = 'draft';
    magnetAllT = CFG.magnet.allSec;
    bus.emit('levelUp', { level: cstate.level });
    syncBuild();                                     // wickPlus 按等级重算
    ui.openDraft(getDraftCards(cstate, rng), onDraftPick);
  }
  function onDraftPick(card) {
    const prevW = { ...cstate.weapons }, prevP = { ...cstate.passives };   // B1:构筑 diff 用
    const hadEvo = cstate.evolutions.length;
    cstate = applyCard(cstate, card);                // 替换/弃置/重燃消耗火种均在此结算
    syncBuild();
    // B1 新武器觉醒/升级反馈:新增与升级的图标飞入/跳动(经 bus,ui 订阅)
    const pulses = [];
    for (const id of Object.keys(cstate.weapons)) {
      if (!(id in prevW)) pulses.push({ icon: WEAPONS[id].icon, name: WEAPONS[id].name, role: 'weapon', kind: 'new' });
      else if (cstate.weapons[id] > prevW[id]) pulses.push({ icon: WEAPONS[id].icon, name: WEAPONS[id].name, role: 'weapon', kind: 'up' });
    }
    for (const id of Object.keys(cstate.passives)) {
      if (!(id in prevP)) pulses.push({ icon: PASSIVES[id].icon, name: PASSIVES[id].name, role: 'passive', kind: 'new' });
      else if (cstate.passives[id] > prevP[id]) pulses.push({ icon: PASSIVES[id].icon, name: PASSIVES[id].name, role: 'passive', kind: 'up' });
    }
    if (pulses.length) bus.emit('buildChanged', { pulses });
    bus.emit('draftPick', { card });
    if (cstate.evolutions.length > hadEvo) {         // 重燃触发(契约 v2 §4)
      const evoId = cstate.evolutions[cstate.evolutions.length - 1];
      const wi = wInst.get(EVOLUTIONS[evoId].from);  // 防御:极端时序下实例未建不许崩
      if (wi) wi.cd = 0;
      bus.emit('evolution', { evoId });
    }
    ui.closeDraft();
    phase = 'run';
  }

  // ===================== 死亡 =====================
  function doGameOver() {
    phase = 'over';
    const t = director ? Math.floor(director.t) : 0;
    const stats = { time: t, kills, level: cstate.level };
    try {
      const best = Platform.storage.get('embernight.best', null);
      if (!best || stats.time > best.time) Platform.storage.set('embernight.best', stats);
    } catch (e) { /* storage 不可用时静默 */ }
    bus.emit('gameOver', { stats });
  }

  // ===================== 渲染 =====================
  function draw() {
    if (phase === 'title') return;
    const t = director ? director.t : 0;
    const tl = director ? director.timeline : null;
    renderer.setCamera(player.x, player.y);
    renderer.setPlayerLight(player.x, player.y, lightRCur);   // 青烛光圈 ×1.4(meta 注入)
    renderer.setColorScript(Math.min(t / CFG.run.length, 1));

    // 敌足下红圈预警(tri 蓄力 / Boss 冲刺;renderer 无红圈基元:BLOOD spark + 内暗盘合成环)
    enemies.each(e => {
      if (e.dead || !(e.telegraphT > 0)) return;
      const k = 1 - e.telegraphT / (e.telegraphMax || 1);
      const R = (e.r * 2.4) * (0.75 + 0.45 * k);
      renderer.sprite('spark', e.x, e.y, { tint: PAL.BLOOD, alpha: 0.5 + 0.3 * k, scale: R / 12, additive: true });
      renderer.sprite('blob', e.x, e.y, { tint: PAL.ABYSS, alpha: 0.85, scale: R / 22 });
    });
    // 聚火拾取点(director 持有,渲染归 gameplay)
    if (tl) for (const m of tl.magnets)
      renderer.sprite('spark', m.x, m.y, { tint: PAL.GOLD, alpha: 0.6 + 0.3 * Math.sin(Time.now * 5),
                                           scale: 1.6 + 0.3 * Math.sin(Time.now * 5), additive: true });
    // 余烬之门(30s 限时;GOLD 环 + 门心)
    if (tl && tl.gate) {
      const g = tl.gate, left = Math.max(0, g.until - t);
      renderer.sprite('spark', g.x, g.y, { tint: PAL.GOLD, alpha: 0.55, scale: 2.6, additive: true });
      renderer.sprite('blob', g.x, g.y, { tint: PAL.ABYSS, alpha: 0.9, scale: 1.35 });
      renderer.sprite('spark', g.x, g.y, { tint: PAL.HERO_HI, alpha: 0.4 + 0.3 * Math.sin(Time.now * 7),
                                           scale: 0.5 * (left / 30 + 0.5), additive: true });
    }
    // 烛泪伤害潭(P4 反馈:边缘脉动环 + 潭内翻涌双层 spark)
    zones.each(z => {
      const pu = Math.sin(Time.now * 6 + z.bob);
      renderer.sprite('spark', z.x, z.y, { tint: PAL.EMBER_EDGE, additive: true,
        alpha: 0.30 + 0.12 * pu, scale: z.r / 12 });                                     // 边缘脉动环
      renderer.sprite('spark', z.x, z.y, { tint: PAL.EMBER_MID, additive: true,
        alpha: 0.20 - 0.08 * pu, scale: (z.r / 12) * (0.72 + 0.06 * Math.sin(Time.now * 9 + z.bob * 2)) }); // 内层翻涌
    });
    // P4:环境微光尘 + 氛围余烬(铺底,极低密度)
    for (const m of motes)
      renderer.sprite('spark', m.x, m.y, { tint: PAL.EMBER_CORE, additive: true,
                                           alpha: 0.10 + 0.05 * Math.sin(Time.now * 0.8 + m.ph), scale: 0.30 });
    embers.each(b => {
      const k = b.life / b.max;
      renderer.sprite('spark', b.x, b.y, { tint: PAL.EMBER_EDGE, additive: true,
                                           alpha: k * 0.7, scale: b.kind === 0 ? 0.30 + 0.15 * (1 - k) : 0.34 });
    });
    gems.each(g => renderer.sprite('gem', g.x, g.y, { scale: 1 + 0.15 * Math.sin(Time.now * 6 + g.bob) }));
    // 拾取实体:宝箱(金)/ 烛芯火种(暖白全程磁吸)
    pickups.each(p => {
      if (p.kind === 'chest')
        renderer.sprite('gem', p.x, p.y, { tint: PAL.GOLD, scale: 1.8 + 0.2 * Math.sin(p.bob * 4) });
      else
        renderer.sprite('spark', p.x, p.y, { tint: PAL.EMBER_CORE, additive: true,
                                             alpha: 0.85, scale: 1.4 + 0.25 * Math.sin(p.bob * 6) });
    });
    // 敌人(fx 消费:闪白/squash;lit 平滑 + 进圈暖晕 + 描边点亮,圣经同款伪 2D 光照)
    enemies.each(e => {
      if (e.dead) return;
      const d = Math.hypot(e.x - player.x, e.y - player.y);
      const litT = Math.min(1, Math.max(0, 1 - d / lightRCur));
      e.litS = (e.litS || 0) + (litT - (e.litS || 0)) * Math.min(1, Time.dt * 8);
      if (e.litS > 0.03)                               // 进圈:脚下暖色光晕(r×2.2)
        renderer.sprite('spark', e.x, e.y, { tint: PAL.EMBER_MID, additive: true,
                                             alpha: 0.10 * e.litS, scale: (e.r * 4.4) / 24 });
      const opts = { rot: e.rot, tint: e.tint, scale: e.sizeMult || 1,
                     scaleX: e.fxScaleX || 1, scaleY: e.fxScaleY || 1, lit: e.litS };
      if (e.fxFlash > 0) opts.tint = '#FFFFFF';
      renderer.sprite(e.frame, e.x, e.y, opts);
    });
    // 统一弹道:发光弹 = radial glow 底 + 菱形核(圣经同款);敌弹 VENOM 非 additive
    shots.each(b => {
      if (b.additive)
        renderer.sprite('spark', b.x, b.y, { tint: PAL.EMBER_CORE, additive: true, alpha: 0.5, scale: 1.3 });
      renderer.sprite(b.frame || 'proj', b.x, b.y,
        { rot: Math.atan2(b.vy, b.vx), tint: b.tint, additive: !!b.additive });
    });
    // 焰环火珠(P4:放大 ~1.5× + 短拖尾)与星芒光矛(P4:additive 细长线,命中帧存在)
    for (const [, w] of wInst) {
      if (w.trails) for (const tr of w.trails)
        for (let k = 0; k < tr.length - 1; k++)
          renderer.sprite('spark', tr[k].x, tr[k].y, { tint: PAL.EMBER_MID, additive: true,
                          alpha: 0.30 * (k + 1) / tr.length, scale: 0.55 });
      for (const o of w.orbs) renderer.sprite('spark', o.x, o.y, { tint: PAL.EMBER_CORE, additive: true, alpha: 0.9, scale: 1.3 });
      if (w.orbs.length)                              // 贴脸焰域可视提示(淡环)
        renderer.sprite('spark', player.x, player.y, { tint: PAL.EMBER_MID, additive: true,
                          alpha: 0.07 + 0.03 * Math.sin(Time.now * 3), scale: CFG.ring.auraR / 12 });
      if (w.beams) for (const bm of w.beams) {
        const dx = bm.x2 - bm.x1, dy = bm.y2 - bm.y1;
        const len = Math.hypot(dx, dy), ang = Math.atan2(dy, dx);
        renderer.sprite('proj', (bm.x1 + bm.x2) / 2, (bm.y1 + bm.y2) / 2,
          { rot: ang, tint: PAL.HERO_HI, additive: true, alpha: (bm.t / bm.max) * 0.85,
            scaleX: len / 26, scaleY: 0.30 });
        renderer.sprite('spark', bm.x2, bm.y2, { tint: PAL.EMBER_CORE, additive: true,
                        alpha: (bm.t / bm.max) * 0.7, scale: 1.2 });
      }
      if (w.flashT > 0) {                             // 星芒径向闪光
        w.flashT -= Time.dt;
        renderer.sprite('spark', player.x, player.y, { tint: PAL.HERO_HI, additive: true,
                        alpha: Math.max(0, w.flashT / CFG.star.flashSec) * 0.5, scale: 8 });
      }
    }
    // 玩家:三层泪滴火焰(圣经同款:内芯 HERO_HI / 中层 EMBER_CORE / 外层 EMBER_MID 半透明;
    // 摆动按层差分,呼吸经 uCandle;i-frame 闪烁 + juice bossTelegraph 烛焰闪烁标志)
    let alpha = 1;
    const flashUntil = juice ? juice.playerFlashUntil : 0;
    if (player.iframes > 0 || Time.now < flashUntil) alpha = Math.sin(Time.now * 40) > 0 ? 0.35 : 0.9;
    const sway = Math.sin(Time.now * 2.6) * 2.2, fx = player.x, fy = player.y - 4;
    renderer.sprite('player', fx + sway * 0.05, fy, { tint: PAL.EMBER_MID, alpha: 0.45 * alpha, scale: 1.55, additive: true });
    renderer.sprite('player', fx + sway * 0.50, fy, { tint: PAL.EMBER_CORE, alpha: 0.85 * alpha, scale: 1.10, additive: true });
    renderer.sprite('player', fx + sway * 1.00, fy, { tint: PAL.HERO_HI, alpha: alpha, scale: 0.62, additive: true });
  }

  // ===================== 对外 state / 装配口 =====================
  const state = {
    player, enemies, gems, bullets: shots, shots, zones, pickups,
    get phase()    { return phase; },
    get hp()       { return player.hp; },
    get maxHp()    { return maxHpCur; },
    get xp()       { return xp; },
    get xpNext()   { return xpNext; },
    get level()    { return cstate.level; },
    get kills()    { return kills; },
    get time()     { return director ? director.t : 0; },
    get timeLeft() { return Math.max(0, CFG.run.length - (director ? director.t : 0)); },

    get mods()     { return mods; },                 // A 区审计:派生值直读(台架断言)

    get weaponIcons() {                              // B2:构筑图标 + 等级角标数据
      return Object.keys(cstate.weapons)

  aiCtx.summon = outletSummon;

// ===== entry: main.js =====
(function(){
'use strict';
const { bus, Time, Input, Pool, SpatialHash, RNG, Ease, PAL, Platform } = __modules.core;
const { createRenderer } = __modules.renderer;
const { createAudio } = __modules.audio;
const { createUI } = __modules.ui;
const { createJuice } = __modules.juice;

const { createDirector } = __modules.director;
const { createMeta, CHARACTERS } = __modules.meta;
const { WEAPONS, PASSIVES } = __modules.content;
// ============================================================================
// 《烛夜 Embernight》main.js — 装配层 + 界面流转状态机(契约 v3 §1)
// title(演示波背景) → charSelect → run → settlement/victory → hall →【启程】→ charSelect
// 帧序:Input.update() → Time.update(rawDt) → renderer.begin → game.update() →
//       renderer.end() → HUD/烛泪刻度(10Hz)→ Input.lateUpdate()
// ============================================================================










const canvas = document.getElementById('gl');

// 装配顺序:renderer → audio → ui → juice → game → director → meta(P3)
const renderer = createRenderer(canvas);
const audio = createAudio({ bus });
const ui = createUI({ bus, Platform });
const juice = createJuice({ bus, Time, renderer, audio, ui });
const game = createGame({ bus, Time, Input, Pool, SpatialHash, RNG, Ease, PAL,
                          renderer, juice, audio, ui, Platform });
const director = createDirector({ bus, Time, rng: game.rng,
  spawnEnemy: game.directorOutlets.spawnEnemy,
  summon: game.directorOutlets.summon,
  player: game.directorOutlets.player,
  grant: game.directorOutlets.grant });
game.setDirector(director);
const meta = createMeta({ Platform });           // 工厂内 load() 恢复存档

Input.init(canvas);

/* ==================== 界面流转状态机(契约 v3 §1) ==================== */
let appPhase = 'title';        // title|charSelect|run|settlement|victory|hall
let currentChar = 'white';
let currentMetaMods = {};

function charList() {
  return Object.values(CHARACTERS).map(c => ({
    ...c,
    unlocked: meta.isCharUnlocked(c.id),               // 青烛谜面:deaths≥3 或 dawn 咒语(meta 闩存)
    riddle: c.unlock && c.unlock.riddle,
  }));
}
function applyRateBias() {                            // lure 节点 × 长夜(+50% 敌量)→ director
  const lure = 1 + (currentMetaMods.enemyRateMult || 0);
  director.setRateBias(lure * (meta.data.longNight ? 1.5 : 1));
}

function goTitle() {                                  // 标题:演示波背景(≤60 实体,L1 档起跑)
  appPhase = 'title';
  game.startDemo();
  director.setDemo(true);
  renderer.setLevel(1);
  ui.showTitle(() => { audio.unlock(); bus.emit('ignite'); goCharSelect(); });
}
function goCharSelect() {                             // 角色卡:清场退出 demo
  appPhase = 'charSelect';
  game.exitDemo();
  director.setDemo(false);
  renderer.setLevel(0);
  ui.showCharSelect(charList(), c => { currentChar = c.id; startRun(); });
}
function startRun() {
  appPhase = 'run';
  currentMetaMods = meta.aggregateMods(currentChar);  // meta 注入(契约 v3 §5)
  director.reset();                                   // 新局时钟归零(重开不再 reload)
  director.setDemo(false);                            // 确认退出演示波(刷怪/时钟恢复)
  applyRateBias();
  ui.hideBossHp();
  game.startRun(currentChar, currentMetaMods);
  ui.showHUD();
  meta.save();
}
function goHall() {                                   // 烛台(死亡帧=奖励帧,先落烛台再操作)
  appPhase = 'hall';
  ui.showHall(meta, {
    depart: goCharSelect,                             // 【启程】→ charSelect
    openSettings: () => ui.showSettings({
      buses: audio.buses,                             // 三滑杆已在 ui 内接 GainNode
      quality: renderer.quality,                      // 画质三档(P4)
      onQuality: (t) => renderer.setQuality(t),       // 切档立即生效(缓冲重算;iOS 自动触发图层重建)
      onWipe: () => { meta.wipe(); goTitle(); },      // 清档 → 回 title
    }),
    onCode: (reward) => {                             // meta 已入账,这里给定制提示
      if (reward.type === 'unlockChar') return '呢喃应验:青烛已解锁';
      if (reward.type === 'cores') return '呢喃应验:烛芯 +' + reward.n;
      return null;
    },
    onLongNight: () => applyRateBias(),
  });
}

/* ---- 结算流(契约 v3 §5) ---- */
bus.on('gameOver', ({ stats }) => {
  if (appPhase !== 'run') return;
  appPhase = 'settlement';
  ui.hideBossHp();
  const r = meta.recordRun({ ...stats, char: currentChar, cause: (stats && stats.cause) || '' }, false);
  meta.save();
  ui.showSettlement({
    stats,
    coresEarned: r.coresEarned,
    line: r.line,
    dawnGap: Math.max(0, 600 - ((stats && stats.time) || 0)),   // 「距黎明 XX 秒」
  }, { toHall: goHall });
});
bus.on('victory', () => {
  if (appPhase !== 'run') return;
  appPhase = 'victory';
  game.state.player.iframes = 9999;                   // 黎明演出期不再烛灭
  // juice dawnSequence 已由 bus 自动触发(重入忽略);对齐其 1.2s+0.15s 时长后落结算
  setTimeout(() => {
    ui.hideBossHp();
    const stats = { time: 600, kills: game.state.kills, level: game.state.level };
    const r = meta.recordRun({ ...stats, char: currentChar, cause: '' }, true);
    meta.save();
    ui.showVictory({ stats, coresEarned: r.coresEarned, line: r.line }, { toHall: goHall });
  }, 1450);
});

/* ---- Boss 血条 / 事件转发 / juice 钩子 ---- */
bus.on('bossSpawn', ({ boss }) => ui.showBossHp(boss.name || '', 1));
bus.on('enemyHit', (p) => {
  if (p.enemy && p.enemy.boss) ui.showBossHp(p.enemy.name || '', Math.max(0, p.enemy.hp / p.enemy.maxHp));
});
bus.on('bossDown', () => ui.hideBossHp());
bus.on('evolution', () => audio.play('evolution'));
bus.on('bossTelegraph', () => { juice.playerFlashUntil = Time.now + 1.0; });
bus.on('qualityChange', ({ level }) => {
  juice.budget.particles = level >= 1 ? 80 : 160;
  juice.budget.numbers = level >= 3 ? 20 : 40;
});

juice.getEnemies = () => game.state.enemies;          // dawnSequence 燃尽只读列表
juice.getBuildIcons = () => {                         // evolution 连锁跳数图标
  const b = game.state.build;
  return Object.keys(b.weapons).map(id => ({ icon: WEAPONS[id].icon, role: 'weapon' }))
    .concat(Object.keys(b.passives).map(id => ({ icon: PASSIVES[id].icon, role: 'passive' })));
};

/* ---- 设置:震屏开关(Platform.storage,1Hz 轮询应用;音量三滑杆 ui 内已接) ---- */
function applyShakePref() {
  const on = Platform.storage.get('embernight.shake', true);
  juice.budget.shake.maxShift = on ? 16 : 0;
  juice.budget.shake.maxRotRad = on ? (2 * Math.PI) / 180 : 0;
}
applyShakePref();
setInterval(applyShakePref, 1000);

// 暂停页旧音量滑杆 → master(保留;正式三滑杆在设置页)
const vol = document.querySelector('.pause-vol input');
if (vol) vol.addEventListener('input', () => {
  if (audio.buses.master) audio.buses.master.gain.value = vol.value / 100;
});

/* ---- 烛泪刻度(契约 v3 §5;director markers → ui {t01,icon,kind}) ---- */
const TL_ICON = { elite: '英', hordeStart: '潮', hordeEnd: '潮', boss: '瞳', victory: '晓', sparkGuard: '星' };
const TL_KIND = { elite: 'elite', hordeStart: 'horde', hordeEnd: 'horde', boss: 'boss', victory: 'dawn' };
function tlMarkers() {
  return director.timeline.markers.map(m => ({
    t01: m.t / 600, icon: TL_ICON[m.kind] || '·', kind: TL_KIND[m.kind] || m.kind,
  }));
}

/* ---- 触屏摇杆可视化(P4:半透明底盘圆环+摇杆球,transform-only 无布局抖动) ---- */
const stickRing = document.createElement('div'), stickKnob = document.createElement('div');
const _stickCss = 'position:fixed;left:0;top:0;z-index:5;pointer-events:none;border-radius:50%;'
  + 'opacity:0;transition:opacity .18s ease;will-change:transform,opacity;';
// 样式纪律:ink 描边 + ember-mid 低透明填充(12 色 token)
stickRing.style.cssText = _stickCss + 'width:112px;height:112px;box-sizing:border-box;'
  + 'border:2px solid rgba(42,30,20,.9);background:rgba(255,158,79,.07);';
stickKnob.style.cssText = _stickCss + 'width:48px;height:48px;box-sizing:border-box;'
  + 'border:2px solid rgba(42,30,20,.85);background:rgba(255,158,79,.28);';
document.body.append(stickRing, stickKnob);
function drawStick(){
  const sk = Input.stick;
  if (sk && sk.active){
    const R = Input.stickRadius;
    const dx = sk.x - sk.ox, dy = sk.y - sk.oy;
    const len = Math.hypot(dx, dy), cl = len > R ? R / len : 1;   // 摇杆球限制在环内
    stickRing.style.opacity = '1';
    stickKnob.style.opacity = '1';
    stickRing.style.transform = `translate(${sk.ox - R}px, ${sk.oy - R}px)`;
    stickKnob.style.transform = `translate(${sk.ox + dx * cl - 24}px, ${sk.oy + dy * cl - 24}px)`;
  } else {
    stickRing.style.opacity = '0';
    stickKnob.style.opacity = '0';
  }
}

/* ---- 触屏暂停按钮(P4:仅 touch 设备显示,半透明;键盘 Esc 路径不动) ---- */
const pauseBtn = document.createElement('button');
pauseBtn.type = 'button';
pauseBtn.textContent = '‖';
pauseBtn.setAttribute('aria-label', '暂停');
pauseBtn.style.cssText = 'position:fixed;top:calc(64px + env(safe-area-inset-top));'
  + 'right:calc(14px + env(safe-area-inset-right));z-index:11;width:40px;height:40px;border-radius:50%;'
  + 'border:1px solid rgba(42,30,20,.9);background:rgba(11,8,6,.55);color:#FF9E4F;font-size:16px;'
  + 'display:none;align-items:center;justify-content:center;cursor:pointer;';
pauseBtn.addEventListener('click', () => { Input.state.pause = true; });   // 边沿触发,gameplay 消费
document.body.appendChild(pauseBtn);

/* ---- F3 性能 HUD(默认隐藏) ---- */
const perf = document.createElement('div');
perf.style.cssText = 'position:fixed;top:8px;left:8px;z-index:20;pointer-events:none;'
  + 'font:12px/1.5 Consolas,Menlo,monospace;color:#FFD9A0;white-space:pre;'
  + 'background:rgba(11,8,6,.72);border:1px solid #2A1E14;border-radius:6px;padding:6px 9px;display:none;';
document.body.appendChild(perf);
let perfOn = false;
window.addEventListener('keydown', e => {
  if (e.key === 'F3'){ e.preventDefault(); perfOn = !perfOn; perf.style.display = perfOn ? 'block' : 'none'; }
});
function perfTick(){
  if (!perfOn) return;
  const s = renderer.stats, st = game.state;
  const f = (v, d) => (Number.isFinite(v) ? v : 0).toFixed(d);   // 空值兜底(统计重置窗内字段可能瞬时空)
  perf.textContent =
    `fps ${f(s.fps, 1)}  avg ${f(s.avg, 2)}ms  p95 ${f(s.p95, 2)}ms  L${s.level}\n` +
    `draw ${s.drawCalls}  ${s.api} ${s.hdr}  帧异常 ${s.frameErrors}  重建 ${s.rebuilds}\n` +
    `敌 ${st.enemies.alive}  弹 ${st.shots.alive}  星火 ${st.gems.alive}  ${appPhase}`
    // 诊断探针(仅 debug 版,__EMBER 存在时):图层重建计数/触发源/画质/dpr/构建版本
    + (window.__EMBER ? `\n重建层 ${s.layerRebuilds}(${s.lastRebuildSrc || '-'})  画质 ${renderer.quality}  dpr ${f(s.dprEff, 2)}  ${buildVer}` : '');
}
const buildVer = (document.querySelector('meta[name="build-ver"]') || {}).content || '';

/* ---- 主循环 ---- */
let last = performance.now(), hudAcc = 0;
function loop(tms){
  requestAnimationFrame(loop);
  const rawDt = Math.min(0.1, (tms - last) / 1000);
  last = tms;
  Input.update();
  drawStick();                 // 摇杆可视化(每帧跟手)
  Time.update(rawDt);
  renderer.begin(Time.dt);     // 帧开始:清屏+清实例队列+uCandle 推进(必须先于精灵入队)
  game.update();               // 玩法/演示波(内部读 Time.dt,色彩脚本在 draw 内每帧推进)
  renderer.end();
  hudAcc += rawDt;
  if (hudAcc >= 0.1){
    hudAcc = 0;
    if (appPhase === 'run'){
      ui.updateHUD(game.state);
      ui.updateTimeline(Math.min(1, director.t / 600), tlMarkers());   // 烛泪刻度
      pauseBtn.style.display = Input.state.device === 'touch' ? 'flex' : 'none';  // 触屏暂停入口
    } else {
      pauseBtn.style.display = 'none';
    }
    audio.setIntensity(Math.min(1, game.state.enemies.alive / 120));
    perfTick();
  }
  Input.lateUpdate();
}

/* ---- 启动:进 title(演示波背景) ---- */
goTitle();
requestAnimationFrame(loop);
})();
