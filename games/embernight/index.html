const _listeners = new Map();

  on(evt, fn){
    let s = _listeners.get(evt);
    if (!s){ s = new Set(); _listeners.set(evt, s); }
    s.add(fn);
    return fn;
  },
  off(evt, fn){
    const s = _listeners.get(evt);
    if (s) s.delete(fn);
  },
  emit(evt, payload){
    const s = _listeners.get(evt);
    if (!s) return;
    for (const fn of [...s]) fn(payload);   // 快照遍历:回调内 on/off 不破坏本轮派发
  }
};

/* ---------- Time:全局时间总线(顿帧/慢动作;plan §4 juice timeScale 总线) ----------
 * 用法:main.js 每帧以真实 dt(秒)调用 Time.update(rawDt)(契约 §8「Time 推进」)。

const _fx = [];            // {scale, until(rawNow)}
let _rawNow = 0;
const Time = {
  dt: 0,                   // 本帧逻辑 dt(已乘 timeScale)
  raw: 0,                  // 本帧真实 dt(UI/输入专用,不吃顿帧)
  now: 0,                  // 游戏累计时间(秒,乘 timeScale)
  timeScale: 1,
  hitStop(sec, scale = 0.1){ _fx.push({ scale, until: _rawNow + sec }); },
  slowMo(sec, scale){ _fx.push({ scale, until: _rawNow + sec }); },
  update(rawDt){
    _rawNow += rawDt;
    if (_fx.length){
      for (let i = _fx.length - 1; i >= 0; i--) if (_fx[i].until <= _rawNow) _fx.splice(i, 1);
    }
    let ts = 1;
    for (let i = 0; i < _fx.length; i++) if (_fx[i].scale < ts) ts = _fx[i].scale;
    this.timeScale = ts;
    this.raw = rawDt;
    this.dt = rawDt * ts;
    this.now += this.dt;
  }
};

/* ---------- Pool:定容对象池(swap-pop,零 GC) ----------
 * spawn 满容返回 null(由调用方决策);each(fn) 中 fn 返回 true 可安全 despawn 当前项。 */
class Pool {
  constructor(factory, capacity){
    this._items = new Array(capacity);
    for (let i = 0; i < capacity; i++){
      this._items[i] = factory(i);
      this._items[i].__pi = i;          // 池内槽位索引(随 swap 维护)
    }
    this._n = 0;
    this._cap = capacity;
  }
  spawn(initObj){
    if (this._n >= this._cap) return null;
    const obj = this._items[this._n++];
    if (initObj) Object.assign(obj, initObj);
    return obj;
  }
  despawn(obj){
    const i = obj.__pi;
    if (i == null || i >= this._n || this._items[i] !== obj) return;   // 非活跃/已回收
    const last = this._items[--this._n];
    this._items[i] = last; last.__pi = i;
    this._items[this._n] = obj; obj.__pi = this._n;
  }
  each(fn){
    for (let i = 0; i < this._n; i++){
      if (fn(this._items[i], i) === true){ this.despawn(this._items[i]); i--; }
    }
  }
  get alive(){ return this._n; }
  clear(){ this._n = 0; }
}

/* ---------- SpatialHash:空间哈希(insert 需 obj 有 x,y,r;queryCircle 精确距离复核) ---------- */
class SpatialHash {
  constructor(cellSize){
    this.cs = cellSize;
    this._map = new Map();              // key -> obj[](数组复用,clear 不释放)
  }
  _key(cx, cy){ return (cx + 4096) * 8192 + (cy + 4096); }   // 覆盖 ±4096 格,远超局内范围
  clear(){ for (const a of this._map.values()) a.length = 0; }
  insert(obj){
    const k = this._key(Math.floor(obj.x / this.cs), Math.floor(obj.y / this.cs));
    let a = this._map.get(k);
    if (!a){ a = []; this._map.set(k, a); }
    a.push(obj);
  }
  queryCircle(x, y, r, cb){
    const cs = this.cs;
    const x0 = Math.floor((x - r) / cs), x1 = Math.floor((x + r) / cs);
    const y0 = Math.floor((y - r) / cs), y1 = Math.floor((y + r) / cs);
    for (let cy = y0; cy <= y1; cy++){
      for (let cx = x0; cx <= x1; cx++){
        const a = this._map.get(this._key(cx, cy));
        if (!a) continue;
        for (let i = 0; i < a.length; i++){
          const o = a[i], rr = r + (o.r || 0);
          const dx = o.x - x, dy = o.y - y;
          if (dx * dx + dy * dy <= rr * rr) cb(o);
        }
      }
    }
  }
}

/* ---------- RNG:mulberry32 种子随机 ---------- */
class RNG {
  constructor(seed){ this._s = (seed >>> 0) || 0x9E3779B9; }
  next(){
    let t = this._s += 0x6D2B79F5;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  range(a, b){ return a + (b - a) * this.next(); }
  int(a, b){ return Math.floor(this.range(a, b + 1)); }   // 含两端
  pick(arr){ return arr[this.int(0, arr.length - 1)]; }
}

    if (def.phases && phaseIdx < def.phases.length - 1 && e.hp <= e.maxHp * def.phases[phaseIdx + 1].below) {

      ctx.bus.emit('bossTelegraph', { boss: e, kind: 'phase' });

        }

      waveT -= dt;

      phaseT -= dt;
      e.telegraphT = Math.max(0, phaseT);

        } else advance(e, ctx);

  const o = opts || {};
  const elite = !!o.elite;
  const starless = !!o.starless;              // 哑影(design-snuffer-stand §4.2,TODO-CONTRACT 契约增项):

  const sizeMult = (o.sizeMult || 1) * (elite ? 1.6 : 1);   // 精英 ×1.6 体型
  const hp = Math.round(def.hp * hpMult);
  return {
    id: ++_uid, type: id,
    x, y,

    hp, maxHp: hp,

        const a = rng.range(0, Math.PI * 2);
        const x = player.x + Math.cos(a) * CFG.bossDist;
        const y = player.y + Math.sin(a) * CFG.bossDist;
        // TODO-CONTRACT #2:契约 §3 仅注入 spawnEnemy/summon 两个实体出口,未明确 Boss 专用入口;
        // 此处以 spawnEnemy('nyct1'|'nyct2', x, y, {boss:true}) 创建,集成者请将该 id 路由至 enemies.makeBoss(which,x,y)。
        const e = spawnEnemy(ev.which, x, y, { boss: true });
        if (!e) break;
        spawned++;
        bossWhich.set(e, ev.which);
        bus.emit('bossSpawn', { boss: e });
        break;
      }
      case 'snufferOpen':                      // 熄灯台开窗:视野外环带 700±80 生成灯台标记(设计案 §1.2)
        openSnuffer(ev.n);
        break;
      case 'snufferClose':                     // 关窗:未点亮即沉夜,无惩罚(§1.5;仪式中亦直接判负)
        if (snuffer && snuffer.n === ev.n) failSnuffer('timeout');
        break;
      case 'victory':
        failSnuffer('dawn');                   // 黎明天亮,在场灯台自然沉夜(设计案 §4.1.7)
        victoryFired = true;                   // 停刷怪;场上残敌由 gameplay 收尾
        bus.emit('victory', {});
        break;
    }
  }

  function fireDue(to) {                       // 触发全部到点事件(warp 共用同一路径,保证照常 emit)
    while (evIdx < TIMELINE.length && TIMELINE[evIdx].t <= to) handle(TIMELINE[evIdx++]);
  }

  // ===================== 精英/Boss 死亡:宝箱 / 火种 / 余烬之门 / 心流反拍 =====================
  function onEliteDown(e, x, y) {
    bus.emit('eliteDown', { e, x, y });
    grant({ kind: 'chest', x, y });            // 宝箱:随机未持有被动或神器(上限裁决在 content/gameplay)
    flowT = CFG.flow.dur;
  }

  function onBossDown(boss, x, y) {
    const which = bossWhich.get(boss) || boss.type || 'nyct1';
    const n = which === 'nyct2' ? 2 : 1;       // 烛芯火种序号
    bossWhich.delete(boss);                    // 池复用收口:Boss 死即除名,防 swap-pop 新住户误承身份再走 onBossDown(2026-07-24 泄漏修复,D-020)
    bus.emit('bossDown', { boss, x, y });
    flowT = CFG.flow.dur;
    bus.emit('wickFlameDrop', { n, x, y });
    grant({ kind: 'wickFlame', n, x, y });
    if (n === 1) openGate(x, y);               // 仅 Boss① 开余烬之门(契约 §3)
  }

  function openGate(x, y) {
    // TODO-CONTRACT #4:「神器一件或 +2 级经验量」的选择权契约未定,暂由导演 rng 二选一;
    // 神器一局限 2 件的上限由 content/gameplay 裁决,溢出时请降级为 levels2。
    const reward = rng.next() < 0.5 ? 'artifact' : 'levels2';
    gate = { x, y, r: CFG.gate.r, until: t + CFG.gate.sec, reward };
    bus.emit('gateOpen', { x, y, sec: CFG.gate.sec });
  }

  function dropMagnet() {
    const a = rng.range(0, Math.PI * 2), d = CFG.magnet.dropDist;
    const x = player.x + Math.cos(a) * d, y = player.y + Math.sin(a) * d;
    magnets.push({ x, y, r: CFG.magnet.r });
    bus.emit('magnetDrop', { x, y });
  }

  // ===================== 熄灯台状态机(设计案 design-snuffer-stand §2/§4.1,仿 gate 模式) =====================
  function openSnuffer(n) {
    const w = CFG.snuffer.windows[n - 1];
    if (!w || snuffer) return;                 // 单座在场;未知序号静默(防御)
    // 取角/定距用黄金角确定性布点,不消耗主 rng——否则灯台开窗抽数会扰动其后精英/Boss/聚火
    // 的随机序列,经验台架(exp-sim)前后对照被蝴蝶效应污染;两座 bearing/距离天然不同。
    // 伏击滴灌仍走主 rng(实战随机;台架不充能永不触发,序列零扰动)。
    const a = n * GOLDEN_ANGLE;
    const d = CFG.snuffer.spawnDist + ((n * 137) % (2 * CFG.snuffer.spawnDistVar)) - CFG.snuffer.spawnDistVar;
    snuffer = { n, x: player.x + Math.cos(a) * d, y: player.y + Math.sin(a) * d,
                progress: 0, channeling: false, started: false, graceT: 0,
                ambushLeft: CFG.snuffer.ambush[n - 1].n, ambushAcc: 0, lit: false, until: w.close };
    bus.emit('snufferOpen', { n, x: snuffer.x, y: snuffer.y, until: w.close });
  }

  function failSnuffer(reason) {               // 沉夜:timeout=窗口关闭/warp 跳过,dawn=黎明(§1.5/§4.1.7)
    if (!snuffer) return;
    bus.emit('snufferFail', { n: snuffer.n, reason });
    snuffer = null;                            // 本局不再出现;场上哑影保留
  }

  function lightSnuffer() {                    // 逆燃成功(§1.4):伏击停刷(场上哑影保留),奖励当场发放,灯台亮起后淡出
    const s = snuffer; snuffer = null;
    bus.emit('snufferDone', { n: s.n, x: s.x, y: s.y });
    grant({ kind: 'snufferReward', n: s.n, x: s.x, y: s.y });   // 治疗 25% +「余温」75s 兑现归 gameplay(工程项 E10)
  }

  function stepSnuffer(dt) {
    if (!snuffer || snuffer.lit) return;
    const s = snuffer, S = CFG.snuffer;
    const inCircle = (s.x - player.x) ** 2 + (s.y - player.y) ** 2 <= S.r * S.r;   // 玩家中心入仪式圈(§1.3)
    if (inCircle) {
      if (!s.channeling) {                     // 「分焰」开始(每次回圈重发,供音频 loop 重启 E11;debounce 归工程)
        s.channeling = true;
        bus.emit('snufferChannelStart', { n: s.n });
      }
      s.started = true;
      s.graceT = 0;
      s.progress += dt / S.channelSec;
    } else if (s.started) {                    // 离圈:进度暂停,宽限后 0.5×/s 衰减;「分焰」离圈即解(§1.3)
      s.channeling = false;
      s.graceT += dt;
      if (s.graceT > S.graceSec) s.progress = Math.max(0, s.progress - S.decayRate * dt);
    }
    // 伏击滴灌:仪式一开始泄光即引哑影(离圈宽限亦不停,§2 规则 3);不经 stepSpawn/acc,
    // 不吃 rateMult/flowT/dropMult;opts.starless 哑影标记(TODO-CONTRACT:xp=0,enemies.js 工程项)
    if (s.started && s.ambushLeft > 0) {
      const ab = S.ambush[s.n - 1];
      s.ambushAcc += ab.rate * dt;
      while (s.ambushAcc >= 1 && s.ambushLeft > 0) {
        s.ambushAcc -= 1; s.ambushLeft -= 1;
        let total = 0;
        for (const [, w] of ab.mix) total += w;
        let r = rng.next() * total, id = ab.mix[0][0];
        for (const [mid, w] of ab.mix) { r -= w; if (r <= 0) { id = mid; break; } }
        const a = rng.range(0, Math.PI * 2);
        const d = S.ambushDist + rng.range(-S.ambushDistVar, S.ambushDistVar);
        const e = spawnEnemy(id, s.x + Math.cos(a) * d, s.y + Math.sin(a) * d, { starless: true });
        if (e) spawned++;                      // 池满滴灌静默丢弃(软上限纪律同 spawnOne)
      }
    }
    if (s.progress >= 1) lightSnuffer();
  }

  // ===================== 聚火「按缺口补」经验锚(契约 v4 §3,review-juhuo §五方案 C) =====================
  // 要求升级次数:45s 首升 + 35s/级 + 聚火记跳 @180/@480(锚点与 TIMELINE sparkGuard/hordeStart 同源;
  // 真机 [XP] 回传后可修订,不视为契约破坏——TODO-CONTRACT #8)
  function requiredUps(at) {
    const A = CFG.xpAnchor;
    let u = at >= A.firstUp ? 1 + Math.floor((at - A.firstUp) / A.perLevel) : 0;
    for (const j of A.jumps) if (at >= j) u++;
    return u;
  }

  // ===================== 基础刷怪曲线 + 怪组 =====================
  function rateMult() {
    let m = 1;
    if (horde) m *= CFG.horde.rateMult;
    if (lull) m *= CFG.lull.rateMult;
    if (flowT > 0) m *= CFG.flow.rateMult;     // 心流反拍:rate×0.4(与喘息乘算叠加)
    return m;
  }

  function stepSpawn(dt) {
    const rate = CFG.spawn.base + (t / 60) * CFG.spawn.perMin;   // rate(t)=0.8+t/60×0.9 只/s
    acc = Math.min(acc + rate * rateMult() * rateBias * dt, CFG.spawn.accCap);
    const cap = demo ? 60 : CFG.spawn.cap;                 // 演示波 ≤60 实体(契约 v3 §5)
    while (acc >= 1) {
      if (spawned - killsSeen >= cap) { acc = 0; break; }  // 存活上限(软估计)
      acc -= 1;
      spawnOne();
    }
  }

  function spawnOne() {
    const id = pickGroup();
    let x, y;
    if (horde) {                               // 环形围攻:黄金角逐点均匀围困玩家
      ringAngle += GOLDEN_ANGLE;
      const d = CFG.horde.ringR + rng.range(-CFG.horde.ringJitter, CFG.horde.ringJitter);
      x = player.x + Math.cos(ringAngle) * d;
      y = player.y + Math.sin(ringAngle) * d;
    } else {                                   // 常规:视野外环带(口径同 Phase 1)
      const a = rng.range(0, Math.PI * 2);
      const d = CFG.spawn.distMin + rng.range(0, CFG.spawn.distVar);
      x = player.x + Math.cos(a) * d;
      y = player.y + Math.sin(a) * d;
    }
    const e = spawnEnemy(id, x, y);
    if (e) spawned++;
  }

  function pickGroup() {                       // 按当前 t 选怪组,再按权重抽族
    let g = GROUPS[GROUPS.length - 1];
    for (const gg of GROUPS) if (t < gg.until) { g = gg; break; }
    let total = 0;
    for (const [, w] of g.w) total += w;
    let r = rng.next() * total;
    for (const [id, w] of g.w) { r -= w; if (r <= 0) return id; }
    return g.w[0][0];
  }

  // ===================== 拾取判定:聚火 / 余烬之门(玩家接触半径) =====================
  function stepPickups() {
    const pr = player.r || 14;
    for (let i = magnets.length - 1; i >= 0; i--) {
      const m = magnets[i];
      const rr = pr + m.r;
      if ((m.x - player.x) ** 2 + (m.y - player.y) ** 2 <= rr * rr) {
        magnets.splice(i, 1);
        bus.emit('magnetPickup', {});
        grant({ kind: 'magnet', x: m.x, y: m.y });   // 全屏星火磁吸 + xp += max(xpNext, 缺口)
                                                     // (契约 v4 §3:兑现与缺口计算在 gameplay,
                                                     //  REQ 锚经 requiredUpsAt(t) 由本模块导出)
      }
    }
    if (gate) {
      const rr = pr + gate.r;
      if ((gate.x - player.x) ** 2 + (gate.y - player.y) ** 2 <= rr * rr) {
        const g = gate; gate = null;
        bus.emit('gateEnter', { reward: g.reward });
        grant({ kind: 'gateReward', reward: g.reward, x: g.x, y: g.y });
      } else if (t >= gate.until) {
        gate = null;                           // 30s 超时静默消失(契约无 gateClose 事件)
      }
    }
  }

  // ===================== 对外 API(契约 §3 签名) =====================
  function update() {
    const dt = Time.dt;                        // 逻辑 dt(顿帧/慢动作自动生效)
    if (demo) {                                // 演示波:只刷怪+拾取,时钟不走、节奏表/尸潮不发
      if (dt > 0) stepSpawn(dt);
      stepPickups();
      return;
    }
    if (dt > 0) {
      t += dt;
      fireDue(t);
      if (flowT > 0) flowT -= dt;
      if (!victoryFired) stepSpawn(dt);        // victory 后停刷(契约 §3)
      stepSnuffer(dt);                         // 熄灯台:充能/衰减/伏击滴灌(draft/暂停期随 dt=0 冻结)
    }
    stepPickups();                             // 拾取判定即使 dt=0 也检查(贴脸生成即拾取)
  }

  // P3 集成补丁:演示波开关 / 开局重置 / 敌量加成(lure×长夜,由集成者算好给入)
  function setDemo(on) { demo = !!on; }
  function setRateBias(m) { rateBias = Math.max(0, m || 1); }
  function reset() {
    t = 0; evIdx = 0; acc = 0;
    horde = null; lull = false; flowT = 0;
    victoryFired = false; sawLevelUp = false;
    gate = null; magnets.length = 0;
    snuffer = null;                            // 熄灯台全部状态清零
    spawned = 0; killsSeen = 0; ringAngle = 0;
    bossWhich.clear();
  }


  return {
    update,
    setDemo, setRateBias, reset,
    requiredUpsAt: (at) => requiredUps(at),    // 契约 v4 §3:聚火缺口补 REQ 锚 getter(gameplay 兑现侧读;REQ(t)=req(u) 曲线累计(D-037,4+L+0.55L²),u=requiredUpsAt(t))
    get t() { return t; },
    get dropMult() { return flowT > 0 ? CFG.flow.dropMult : 1; },   // P4:gameplay 星火掉落直读(免 timeline 分配)
    // TODO-CONTRACT #5:timeline 载荷形状契约未定;自定如下,供 Phase 3 烛泪刻度/HUD 标记
    // 与 gameplay 渲染聚火/余烬之门拾取点;掉落×1.5 无契约事件通道,经 dropMult 暴露给 gameplay。
    get timeline() {
      return {
        t,
        markers: TIMELINE.map((ev, i) => ({
          t: ev.t, kind: ev.kind,
          n: ev.n != null ? ev.n : null,
          which: ev.which != null ? ev.which : null,
          fired: i < evIdx,
        })),
        rateMult: rateMult(),
        dropMult: flowT > 0 ? CFG.flow.dropMult : 1,   // 心流反拍:掉落率 ×1.5
        flowT, lull,
        horde: horde ? { n: horde.n, endsAt: horde.endsAt } : null,
        magnets: magnets.slice(),
        gate: gate ? { x: gate.x, y: gate.y, r: gate.r, until: gate.until, reward: gate.reward } : null,
        // 熄灯台逐帧状态(设计案 §4.1.5:进度/debuff 不进事件,与 gate/magnets 同模式逐帧读;
        // renderer 仪式圈+进度弧 E4、分焰 debuff 生效 E10、烛焰收窄 E9 直读 channeling/debuffLight/debuffDmg)
        snuffer: snuffer ? { n: snuffer.n, x: snuffer.x, y: snuffer.y, r: CFG.snuffer.r,
                             progress: snuffer.progress, channeling: snuffer.channeling, until: snuffer.until,
                             debuffLight: CFG.snuffer.debuffLight, debuffDmg: CFG.snuffer.debuffDmg } : null,
        victory: victoryFired,
      };
    },
  };
}
return { createDirector };
})();

 * 3 八度(频率 ×2,振幅 0.5/0.25/0.125),smoothstep 插值,晶格按 64/128/256 环绕

 * 值域 [0, 0.875]⊂[0,1],均值≈0.4375(=0.5×振幅和 0.875),与 shader 内 fbm 同分布。 */
function bakeBgNoise(size){
  size = size || 256;
  const lattices = [];
  for (let k = 0; k < 3; k++){
    const L = 64 << k;                                       // 64 / 128 / 256 晶格
    const g = new Float64Array(L * L);
    let s = (0x9E3779B9 ^ ((L * 0x85EBCA6B) >>> 0)) >>> 0;   // 确定性种子(八度间不相关)
    for (let i = 0; i < g.length; i++){                      // xorshift32,构建/真机一致
      s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0;
      g[i] = s / 4294967296;

  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++){
    let v = 0, amp = 0.5;
    for (let k = 0; k < 3; k++){

      const px = (x + 0.5) / size * L, py = (y + 0.5) / size * L;

      const x0 = ((ix % L) + L) % L, x1 = (x0 + 1) % L;                 // 晶格环绕 → 无缝

      v += amp * n; amp *= 0.5;
    }
    data[y * size + x] = Math.round(Math.min(1, Math.max(0, v)) * 255);
  }
  return { data, size };
}

                       0.32 - Math.hypot(u + 0.44, v + 0.34),
                       0.32 - Math.hypot(u - 0.46, v + 0.38));
          s = shapeOf(f, () => 0.5 + 0.5 * Math.max(0, 0.85 - Math.hypot(u, v - 0.05)));
          a = s[0]; lum = s[1]; rim = s[2];
        } else if (cell === 1){   // tri 尖三角:顶点 (0.98,0),底边 x=-0.72(更长更尖)
          f = Math.min(u + 0.72, (0.98 - u) * 0.44 - Math.abs(v));
          s = shapeOf(f, () => 0.88);
          a = s[0]; lum = s[1]; rim = s[2];
        } else if (cell === 2){   // limb 瘦长多肢:竖椭圆躯干 + 四足可见
          f = 1 - Math.hypot(u / 0.32, (v + 0.08) / 0.74);
          f = Math.max(f, 0.055 - segDist(u, v, -0.15, 0.20, -0.50, 0.98));
          f = Math.max(f, 0.055 - segDist(u, v, 0.15, 0.20, 0.50, 0.98));
          f = Math.max(f, 0.05 - segDist(u, v, -0.12, 0.42, -0.40, 1.05));
          f = Math.max(f, 0.05 - segDist(u, v, 0.12, 0.42, 0.40, 1.05));
          s = shapeOf(f, () => 0.82);
          a = s[0]; lum = s[1]; rim = s[2];
          core = Math.min(1, Math.max(0, (0.10 - Math.hypot(u, v + 0.30)) * 12));  // venom 眼
        } else if (cell === 3){   // boss 巨形复眼:圆盘 + 双角 + 三眼(venom 高亮)
          f = 0.76 - Math.hypot(u, v - 0.06);
          f = Math.max(f, 0.17 - Math.hypot((u + 0.40) * 1.5, v + 0.88));
          f = Math.max(f, 0.17 - Math.hypot((u - 0.40) * 1.5, v + 0.88));
          s = shapeOf(f, () => 0.48 + 0.3 * Math.max(0, 0.85 - Math.hypot(u, v)));
          a = s[0]; lum = s[1]; rim = s[2];
          core = Math.min(1, Math.max(0, (0.13 - Math.hypot(u, v + 0.10)) * 10),
                          Math.max(0, (0.095 - Math.hypot(u - 0.30, v - 0.02)) * 10),
                          Math.max(0, (0.095 - Math.hypot(u + 0.30, v - 0.02)) * 10));
        } else if (cell === 4){   // gem 星火(经验宝石,沿用)
          const dd = Math.abs(u) + Math.abs(v);
          a = Math.min(1, Math.max(0, (0.62 - dd) * 6));
          lum = a * (0.7 + 0.3 * Math.max(0, 1 - dd * 2));
          core = Math.max(0, 1 - dd * 3.5);
        } else if (cell === 5){   // proj 弹道长菱形(沿用)
          const dd = Math.abs(u) * 2.2 + Math.abs(v) * 0.75;
          a = Math.min(1, Math.max(0, (1 - dd) * 5));
          lum = a * (0.6 + 0.4 * Math.max(0, 1 - dd));
          core = Math.max(0, 1 - dd * 1.6);
        } else if (cell === 6){   // player 烛焰泪滴:下圆上尖(三层火焰共用此形)
          const body = 0.36 - Math.hypot(u, v - 0.10);
          const tip = Math.min((v + 0.95) * 0.34 - Math.abs(u), (0.12 - v));
          f = Math.max(body, tip);
          s = shapeOf(f, () => Math.min(1, 0.5 + 0.5 * (1 - Math.min(1, Math.abs(u) * 2.2)) * (0.65 + 0.35 * (v + 0.95))));
          a = s[0]; lum = s[1]; rim = 0;   // 火焰不描边,层次由三层 tint 承担
          core = Math.min(1, Math.max(0, (0.16 - Math.hypot(u * 1.25, v - 0.02)) * 6));
        } else if (cell === 8){   // snuffer 熄灯台(E1):高脚台座+灭顶灯碗——梯形敞口碗(平顶沿,去"米老鼠耳朵"误读,店主真机观感)
          const halfW = 0.34 - 0.14 * ((v + 0.55) / 0.43);   // 碗半宽:沿口 0.34 → 碗底 0.20
          f = Math.min(halfW - Math.abs(u), v + 0.55, -0.12 - v);   // 敞口碗(平顶沿,读作器皿不读作头)
          f = Math.max(f, 0.50 - Math.hypot(u / 0.12, (v - 0.25) / 0.75));  // 台柱(细高椭圆)
          f = Math.max(f, 0.22 - Math.hypot(u / 1.5, (v - 0.82) / 0.30));   // 喇叭足
          f = Math.max(f, 0.07 - Math.hypot(u / 0.7, (v + 0.44) / 0.9));    // 灭顶小座(碗内低于沿,无焰)
          s = shapeOf(f, () => 0.55 + 0.25 * Math.max(0, 0.8 - Math.hypot(u, v + 0.3)));
          a = s[0]; lum = s[1]; rim = s[2];
        } else if (cell === 9){   // boss2 复眼冠形(B-1):圆盘 + 三冠刺 + 五复眼(venom 高亮)
          f = 0.70 - Math.hypot(u, v - 0.14);                            // 主盘(略下移让出冠位)
          f = Math.max(f, 0.22 - Math.hypot(u * 1.3, v + 0.90));          // 冠刺·中(加长)
          f = Math.max(f, 0.17 - Math.hypot((u - 0.40) * 1.3, v + 0.76)); // 冠刺·右
          f = Math.max(f, 0.17 - Math.hypot((u + 0.40) * 1.3, v + 0.76)); // 冠刺·左
          s = shapeOf(f, () => 0.48 + 0.3 * Math.max(0, 0.85 - Math.hypot(u, v)));
          a = s[0]; lum = s[1]; rim = s[2];
          core = Math.min(1, Math.max(0, (0.13 - Math.hypot(u, v + 0.02)) * 10),   // 主眼
                          Math.max(0, (0.09 - Math.hypot(u - 0.27, v - 0.10)) * 10),
                          Math.max(0, (0.09 - Math.hypot(u + 0.27, v - 0.10)) * 10),
                          Math.max(0, (0.075 - Math.hypot(u - 0.16, v + 0.24)) * 10),
                          Math.max(0, (0.075 - Math.hypot(u + 0.16, v + 0.24)) * 10));
        } else {                  // spark 径向柔光点(弹道/火珠/光晕共用)
          const r2 = u * u + v * v;
          lum = Math.exp(-r2 * 5.0); a = Math.min(1, lum * 1.6);
          core = Math.exp(-r2 * 18.0);
        }
        const i = ((oy + y) * S + (ox + x)) * 4;
        d[i] = Math.round(Math.min(1, lum) * 255);
        d[i+1] = Math.round(Math.min(1, rim) * 255);
        d[i+2] = Math.round(Math.min(1, core) * 255);
        d[i+3] = Math.round(Math.min(1, a) * 255);
      }
    }
    return { data: d, w: S, h: SH };
  }

  /* ---------- 程序 / RT / 网格(全部走资源重建表) ---------- */
  const prog = {}, mesh = {}, rt = {};
  let atlasTex = null, noiseTex = null, W = 0, H = 0, dprEff = 1, bloomDiv = 2;

  function compile(type, src){
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error('shader: ' + gl.getShaderInfoLog(s));
    return s;
  }
  function makeProgram(vs, fs){
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('link: ' + gl.getProgramInfoLog(p));
    p._u = {};
    const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++){ const info = gl.getActiveUniform(p, i); p._u[info.name] = gl.getUniformLocation(p, info.name); }
    return p;
  }
  function makeRT(w, h){
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    const filt = (hdrOK && halfFloatLinear) || !hdrOK ? gl.LINEAR : gl.NEAREST;
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filt);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filt);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    if (isGL2){
      if (hdrOK) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
      else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    } else {
      if (hdrOK) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, 0x8D61, null);
      else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    }
    const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { tex, fb, w, h };
  }
  function makeBatch(cap){
    const m = { cap, vao: null, quad: gl.createBuffer(), inst: gl.createBuffer(), ibo: gl.createBuffer() };
    gl.bindBuffer(gl.ARRAY_BUFFER, m.quad);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-0.5,-0.5, 0.5,-0.5, 0.5,0.5, -0.5,0.5]), gl.STATIC_DRAW);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, m.ibo);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0,1,2, 0,2,3]), gl.STATIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, m.inst);
    gl.bufferData(gl.ARRAY_BUFFER, cap * INST_FLOATS * 4, gl.DYNAMIC_DRAW);
    return m;
  }
  function bindBatchAttribs(m){
    const aCorner = gl.getAttribLocation(prog.sprite, 'aCorner');
    gl.bindBuffer(gl.ARRAY_BUFFER, m.quad);
    gl.enableVertexAttribArray(aCorner); gl.vertexAttribPointer(aCorner, 2, gl.FLOAT, false, 0, 0);
    attribDivisor(aCorner, 0);                       // 角点逐顶点,显式归零防串扰
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, m.ibo);
    gl.bindBuffer(gl.ARRAY_BUFFER, m.inst);
    const names = ['aPos','aScale','aScaleY','aRot','aTint','aAlpha','aCell','aLit'];
    const sizes = [2,1,1,1,3,1,1,1]; let off = 0;   // 合计 = INST_FLOATS(11),错位会压扁精灵
    for (let i = 0; i < 8; i++){
      const loc = gl.getAttribLocation(prog.sprite, names[i]);
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, sizes[i], gl.FLOAT, false, INST_FLOATS * 4, off * 4);
      attribDivisor(loc, 1);
      off += sizes[i];
    }
  }
  function buildBatchVAO(m){
    m.vao = vaoCreate();
    if (!m.vao) return;                              // GL1 无 VAO 扩展 → 每 draw 手动绑定
    vaoBind(m.vao); bindBatchAttribs(m); vaoBind(null);
  }
  function initPrograms(){
    prog.sprite = makeProgram(VS_SPRITE, FS_SPRITE);
    prog.bg = makeProgram(VS_QUAD, bgMode === 'tex' ? FS_BG_TEX : FS_BG);   // 体检选编译
    prog.bright = makeProgram(VS_QUAD, FS_BRIGHT);
    prog.blur = makeProgram(VS_QUAD, FS_BLUR);
    prog.upadd = makeProgram(VS_QUAD, FS_UPADD);
    prog.composite = makeProgram(VS_QUAD, FS_COMPOSITE);
    prog.copy = makeProgram(VS_QUAD, FS_COPY);
  }
  function initAtlas(){
    const a = buildAtlas();
    atlasTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, atlasTex);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, a.w, a.h, 0, gl.RGBA, gl.UNSIGNED_BYTE, a.data);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  }
  /* 低精度兜底的烘焙噪声纹理(tex 模式才烘焙/占显存;proc 模式恒跳过)。
   * 随资源重建表走:context 恢复/克隆重建后旧纹理句柄失效,按新 bgMode 重建或跳过。 */
  function initNoiseTex(){
    if (noiseTex){ try { gl.deleteTexture(noiseTex); } catch (_){} noiseTex = null; }
    if (bgMode !== 'tex') return;
    const t = bakeBgNoise(256);
    noiseTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, noiseTex);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, t.size, t.size, 0, gl.LUMINANCE, gl.UNSIGNED_BYTE, t.data);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);   // 烘焙晶格环绕 → 可平铺
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
  }
  function initMeshes(){
    mesh.quad = { vbo: gl.createBuffer(), ibo: gl.createBuffer() };
    gl.bindBuffer(gl.ARRAY_BUFFER, mesh.quad.vbo);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, 1,1, -1,1]), gl.STATIC_DRAW);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, mesh.quad.ibo);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0,1,2, 0,2,3]), gl.STATIC_DRAW);
    mesh.norm = makeBatch(BATCH_NORM);
    mesh.add = makeBatch(BATCH_ADD);
    buildBatchVAO(mesh.norm);
    buildBatchVAO(mesh.add);
  }
  function initRTs(){
    if (W === 0) return;
    if (rt.scene){ gl.deleteTexture(rt.scene.tex); gl.deleteFramebuffer(rt.scene.fb); }
    for (let i = 0; i < 3; i++){
      if (rt['mip'+i]){ gl.deleteTexture(rt['mip'+i].tex); gl.deleteFramebuffer(rt['mip'+i].fb); }
      if (rt['ping'+i]){ gl.deleteTexture(rt['ping'+i].tex); gl.deleteFramebuffer(rt['ping'+i].fb); }
    }
    rt.scene = makeRT(W, H);
    let w = Math.max(1, W / bloomDiv | 0), h = Math.max(1, H / bloomDiv | 0);
    for (let i = 0; i < 3; i++){
      rt['mip'+i] = makeRT(w, h);
      rt['ping'+i] = makeRT(w, h);
      w = Math.max(1, w >> 1); h = Math.max(1, h >> 1);
    }
  }
  /* 资源重建表 + 带重试重建(context 恢复初期丢失态 getter 返回 false 会使 compile 抛错) */
  const RES_TABLE = [
    { name: 'programs', init: initPrograms },
    { name: 'atlas', init: initAtlas },
    { name: 'noiseTex', init: initNoiseTex },
    { name: 'meshes', init: initMeshes },
    { name: 'rt-chain', init: initRTs }
  ];
  function rebuildAll(){ stats.rebuilds++; for (const r of RES_TABLE) r.init(); }
  function tryRebuild(attempt){
    try { createContext(); rebuildAll(); rebuildErr = ''; }
    catch (err){
      rebuildErr = String((err && err.message) || err).slice(0, 60);
      if (attempt < 12) setTimeout(() => tryRebuild(attempt + 1), 250);
    }
  }

  /* ---------- 渲染状态 ---------- */
  let camX = 0, camY = 0;                        // 视野中心(世界坐标;juice 经 setCamera 写入震屏偏移)
  const light = { x: 0, y: 0, r: 0, on: false }; // 玩家光圈(伪 2D 光照)
  let pulse = 0, colorT = 0;                     // 受击红脉冲 / 色彩脚本(挂线)
  let candleT = 0, candleVal = 1, candleDimT = 0;  // 烛光时钟 + 骤暗脉冲计时(E8 熄灯台失败)
  let level = 0;                                 // 当前降级档 L0-L4
  let drawCalls = 0;
  // 实例队列(每帧 begin 清零,sprite 填充,end 上传绘制)
  const instNorm = new Float32Array(BATCH_NORM * INST_FLOATS);
  const instAdd = new Float32Array(BATCH_ADD * INST_FLOATS);
  let nNorm = 0, nAdd = 0;

  /* ---------- 性能统计(clamp ≤100ms,防卡顿/后台污染) ---------- */
  const ftRing = new Float32Array(FT_RING), ftSort = new Float32Array(FT_RING);
  let ftIdx = 0, ftCount = 0, lastStatAt = 0, lastBeginAt = 0;
  let overSince = -1, underSince = -1, lastDownAt = 0;
  const stats = { fps: 0, avg: 0, p95: 0, drawCalls: 0, level: 0,
                  frameErrors: 0, rebuilds: 0, api: '-', hdr: '-',
                  layerRebuilds: 0, lastRebuildSrc: '', dprEff: 0,
                  fragHighpMax: 0, fragHighpPrec: 0, bgMode: 'proc' };   // 精度体检 + 背景模式探针

  function resetStats(){
    ftIdx = 0; ftCount = 0; lastStatAt = 0; lastBeginAt = 0;
    overSince = -1; underSince = -1;
    stats.fps = 0; stats.avg = 0; stats.p95 = 0;
  }
  function sampleFrame(now){
    if (lastBeginAt){
      const ms = Math.min(FRAME_MS_CAP, Math.max(0, now - lastBeginAt));   // clamp(bug 2 修复项)
      ftRing[ftIdx] = ms; ftIdx = (ftIdx + 1) % FT_RING;
      if (ftCount < FT_RING) ftCount++;
    }
    lastBeginAt = now;
    if (now - lastStatAt < 100) return;                  // 统计刷新 ≤10Hz
    lastStatAt = now;
    const n = ftCount;
    if (n === 0) return;   // resetStats 后首帧(lastBeginAt 未立)无样本:p95 会取 arr[-1]=undefined,下游 toFixed 崩
    ftSort.set(ftRing.subarray(0, n));
    const arr = ftSort.subarray(0, n);
    arr.sort((a, b) => a - b);
    let sum = 0;
    for (let i = 0; i < n; i++) sum += arr[i];
    stats.avg = sum / n;
    stats.p95 = arr[Math.min(n - 1, Math.floor(n * 0.95))];
    stats.fps = 1000 / Math.max(0.01, stats.avg);
    stats.level = level;
  }

  /* ---------- L0-L4 动态降级(先 GPU 填充率后 CPU 逻辑,plan §4) ----------
   * renderer 内动作:L2 bloom 1/4 · L3 关颗粒暗角 · L4 关 bloom+DPR=1;
   * CPU 侧(L1 粒子×0.5 / L3 实体上限 180)经 bus.emit('qualityChange') 外发。 */
  function applyLevel(lv){
    level = lv; stats.level = lv;
    const newDiv = (lv >= 2) ? 4 : 2;
    if (newDiv !== bloomDiv){ bloomDiv = newDiv; initRTs(); }
    resize();                                    // L4 的 DPR=1 在 resize 内生效
    bus.emit('qualityChange', { level: lv });
  }
  function updateDegrade(now){
    if (!autoDegrade){ overSince = underSince = -1; return; }
    const p95 = stats.p95;
    if (p95 > P95_DOWN_MS){
      if (overSince < 0) overSince = now;
      underSince = -1;
      if (now - overSince > DOWN_HOLD_MS && level < 4 && now - lastDownAt > 1500){
        applyLevel(level + 1); lastDownAt = now; overSince = -1;
      }
    } else if (p95 > 0 && p95 < P95_UP_MS){
      if (underSince < 0) underSince = now;
      overSince = -1;
      if (now - underSince > UP_HOLD_MS && level > 0){ applyLevel(level - 1); underSince = -1; }
    } else { overSince = -1; }                   // 滞回带内:打断降档计时,但**保留**恢复进度(旧为双清,p95 在 13.5–16.6 徘徊会永卡 L4,2026-07-24 真机实证)
  }

  /* ---------- 内部绘制助手 ---------- */
  function drawQuad(p){
    drawCalls++;
    const loc = gl.getAttribLocation(p, 'aXY');
    gl.bindBuffer(gl.ARRAY_BUFFER, mesh.quad.vbo);
    gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    attribDivisor(loc, 0);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, mesh.quad.ibo);
    gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
    gl.disableVertexAttribArray(loc);
  }
  function drawBatch(m, data, n){
    if (n <= 0) return;
    gl.bindBuffer(gl.ARRAY_BUFFER, m.inst);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, data.subarray(0, n * INST_FLOATS));
    if (m.vao) vaoBind(m.vao); else bindBatchAttribs(m);
    drawCalls++;
    if (isGL2) gl.drawElementsInstanced(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0, n);
    else extInst.drawElementsInstancedANGLE(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0, n);
    if (m.vao) vaoBind(null);
  }

  /* ---------- iOS 合成层硬重建(P4 终极:克隆替换,逼 WebKit 建全新合成层) ----------
   * 病理:iOS 把 canvas 合成层光栅化倍率锁在加载过渡态,改后备缓冲尺寸不重光栅化;
   * display:none 保留旧节点,WebKit 可能复用旧纹理缓存(前两轮实测未解锁)——
   * 故替换为克隆新节点替换旧节点 + 全量 GL 重建(复用 context-lost 重建路径)。
   * 触发:全套(load/延时1s·3s/首次touch/visi/orient/restored/尺寸真变化),同一 300ms 防抖。
   * 防抖合并;context lost 期间顺延;非 iOS 零触发(连节点都不碰)。 */
  const IS_IOS = (() => {
    const ua = navigator.userAgent || '';
    return /iPhone|iPad|iPod/.test(ua)

};

/* 优先级:数值小 = 不重要,满池抢占时先死 */
const PRIO = { tick: 1, burst: 2, chain: 3, hit: 4, levelup: 4, rekindle: 4, bigburst: 5, ui: 5 };
const DEDUP_WINDOW = 0.020;                 // 同类事件 20ms 去重
const BURST_CAP = 6;                        // 爆音类并发上限
const POOL_SIZE = 24;
const BURST_TYPES = new Set(['burst', 'bigburst']); // 爆音类共享并发上限

function createAudio(opts = {}) {
  let ctx = null;
  const buses = { master: null, sfx: null, music: null, ui: null }; // 引用稳定,unlock 后填充
  let noiseWhite = null, noiseBrown = null;
  const lastFire = {};                      // type -> 上次触发的 audio clock
  const chain = { step: 0, last: -9 };      // 连捡链状态
  let ambNodes = null;

  /* ---------------- lookahead 排程器(25ms,setInterval 10ms 驱动) ----------------
   * 每个 tick 把 [now, now+lookahead] 内的事件写入音频时钟(start(t) 样本级精确)。
   * 不用 rAF/帧同步:掉帧与后台标签页会打断排程;interval 抖动被 lookahead 吸收。
   * (plan.md §8 已否决 <10ms 帧同步;audio-lab 实测该路径自身开销 ΔP95≈10.7ms) */
  const scheduler = {
    lookahead: 0.025, tickMs: 10, queue: [], timer: null,
    start() { this.timer = setInterval(() => this.tick(), this.tickMs); },
    at(t, fn) { let i = this.queue.length;
      while (i > 0 && this.queue[i - 1].t > t) i--;
      this.queue.splice(i, 0, { t, fn }); },
    tick() {
      if (!ctx) return;
      const horizon = ctx.currentTime + this.lookahead;
      while (this.queue.length && this.queue[0].t <= horizon) this.queue.shift().fn();
      music.tick(horizon);
    }
  };

  /* ---------------- voice 池 24 槽:抢占 + 20ms 去重 + 爆音上限 6 ---------------- */
  const pool = {
    slots: [],
    init() {
      for (let i = 0; i < POOL_SIZE; i++)
        this.slots.push({ id: i, busy: false, src: null, gain: null, type: '', prio: 0, t0: 0 });
    },
    acquire(type, when) {
      const prio = PRIO[type] ?? 1;
      let slot = this.slots.find(s => !s.busy);
      if (!slot) { // 满池:最低优先级 → 同优先级最早启动
        const cand = [...this.slots].sort((a, b) => a.prio - b.prio || a.t0 - b.t0)[0];
        if (cand.prio > prio) return null; // 优先级不够,丢弃
        this.kill(cand); slot = cand;
      }
      slot.busy = true; slot.type = type; slot.prio = prio; slot.t0 = when;
      slot.gain = ctx.createGain();
      slot.gain.connect(type === 'ui' ? buses.ui : buses.sfx);
      slot.src = null;
      return slot;
    },
    kill(slot) { // 抢占:5ms 淡出防 click
      if (slot.src) {
        const t = ctx.currentTime;
        try {
          slot.gain.gain.cancelScheduledValues(t);
          slot.gain.gain.setTargetAtTime(0, t, 0.002);
          slot.src.stop(t + 0.02);
        } catch (e) {}
      }
      slot.busy = false; slot.src = null; slot.type = '';
    },
    release(slot) { slot.busy = false; slot.src = null; slot.type = ''; },
    burstCount() { return this.slots.filter(s => s.busy && BURST_TYPES.has(s.type)).length; },
    burstOldest() {
      return this.slots.filter(s => s.busy && BURST_TYPES.has(s.type))
        .sort((a, b) => a.t0 - b.t0)[0] || null;
    }
  };

  /* 事件入口:去重 + 爆音上限 + 取槽 */
  function fire(type, noteOn) {
    if (!ctx) return null;
    const now = ctx.currentTime;
    if (lastFire[type] !== undefined && now - lastFire[type] < DEDUP_WINDOW) return null;
    lastFire[type] = now;
    if (BURST_TYPES.has(type) && pool.burstCount() >= BURST_CAP) {
      const old = pool.burstOldest();
      if (old) pool.kill(old);
    }
    const slot = pool.acquire(type, now);
    if (!slot) return null;
    noteOn(slot, Math.max(now, ctx.currentTime));
    if (slot.src) slot.src.onended = () => pool.release(slot);
    return slot;
  }

  /* ---------------- 噪声 buffer 预渲染复用(契约 §4 纪律) ---------------- */
  function makeNoiseBuffers() {
    const sr = ctx.sampleRate;
    noiseWhite = ctx.createBuffer(1, sr * 2, sr);
    const w = noiseWhite.getChannelData(0);
    for (let i = 0; i < w.length; i++) w[i] = Math.random() * 2 - 1;
    const sec = RECIPES.ambience.bufferSec;
    noiseBrown = ctx.createBuffer(1, sr * sec, sr);
    const b = noiseBrown.getChannelData(0);
    let last = 0, peak = 0.0001;
    for (let i = 0; i < b.length; i++) {
      last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02;
      b[i] = last * 3.5;
      peak = Math.max(peak, Math.abs(b[i]));
    }
    for (let i = 0; i < b.length; i++) b[i] /= peak; // 归一化防 clip
  }

  /* ---------------- 音色配方(函数化合成,只读 RECIPES;p=音高倍率 g=增益倍率) ---------------- */
  // 击杀爆音(噪声 BP 800→200 + sawtooth 150→40,±20% 抖动);big=true 时走爆燃大爆音参数
  function burstInto(type, R, p, g) {
    fire(type, (slot, t) => {
      const jit = () => (1 + (Math.random() * 2 - 1) * R.jitter) * p;
      const n = ctx.createBufferSource(); n.buffer = noiseWhite;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = R.noiseQ;
      bp.frequency.setValueAtTime(R.noiseBpFrom * jit(), t);
      bp.frequency.exponentialRampToValueAtTime(Math.max(30, R.noiseBpTo * jit()), t + R.dur);
      const ng = ctx.createGain();
      ng.gain.setValueAtTime(0, t);
      ng.gain.linearRampToValueAtTime(R.noiseGain * g, t + R.attack);
      ng.gain.exponentialRampToValueAtTime(0.001, t + R.dur);
      n.connect(bp).connect(ng).connect(slot.gain);
      n.start(t); n.stop(t + R.dur + 0.05);
      const o = ctx.createOscillator(); o.type = R.oscType || 'sawtooth';   // 音色可配:击杀/大爆改 sine(去锯齿廉价感)
      o.frequency.setValueAtTime(R.sawFrom * jit(), t);
      o.frequency.exponentialRampToValueAtTime(Math.max(20, R.sawTo * jit()), t + R.sawDur);
      slot.gain.gain.setValueAtTime(0, t);
      slot.gain.gain.linearRampToValueAtTime(R.gain * g, t + R.attack);
      slot.gain.gain.exponentialRampToValueAtTime(0.001, t + R.sawDur);
      o.connect(slot.gain);
      o.start(t); o.stop(t + R.sawDur + 0.05);
      slot.src = o;
    });
  }
  // 短促 triangle 脉冲(拾取/连捡共用音色)
  function pip(type, freq, R, g) {
    fire(type, (slot, t) => {
      const o = ctx.createOscillator(); o.type = R.oscType || 'triangle';   // 拾取改 sine(圆润,去廉价感)
      o.frequency.value = freq;
      slot.gain.gain.setValueAtTime(0, t);
      slot.gain.gain.linearRampToValueAtTime(R.gain * g, t + R.attack);
      slot.gain.gain.exponentialRampToValueAtTime(0.001, t + R.dur);
      o.connect(slot.gain); o.start(t); o.stop(t + R.dur + 0.02);
      slot.src = o;
    });
  }
  const synths = {
    kill(p, g) { burstInto('burst', RECIPES.killBurst, p, g); },
    bigBurst(p, g) { burstInto('bigburst', RECIPES.burst, p, g); },
    // E7 熄灯台失败「黯灭」:下沉短音——三角滑坠 + 棕噪低通渐闭(零新资产)
    snufferFail(p, g) {
      const t0 = ctx.currentTime;
      const o = ctx.createOscillator(); o.type = 'triangle';
      o.frequency.setValueAtTime(160 * p, t0);
      o.frequency.exponentialRampToValueAtTime(48 * p, t0 + 0.5);
      const og = ctx.createGain();
      og.gain.setValueAtTime(0.10 * g, t0);
      og.gain.exponentialRampToValueAtTime(0.001, t0 + 0.55);
      o.connect(og).connect(buses.sfx); o.start(t0); o.stop(t0 + 0.6);
      const n = ctx.createBufferSource(); n.buffer = noiseBrown;
      const f = ctx.createBiquadFilter(); f.type = 'lowpass';
      f.frequency.setValueAtTime(900, t0);
      f.frequency.exponentialRampToValueAtTime(120, t0 + 0.5);
      const ng = ctx.createGain();
      ng.gain.setValueAtTime(0.08 * g, t0);
      ng.gain.exponentialRampToValueAtTime(0.001, t0 + 0.5);
      n.connect(f).connect(ng).connect(buses.sfx); n.start(t0); n.stop(t0 + 0.55);
    },
    // 拾取 = 连捡爬升:0.8s 内连续调用沿五声上行,封顶 12 步,超窗归零(内部计数)
    pickup(p, g) {
      const R = RECIPES.chain, now = ctx.currentTime;
      chain.step = (now - chain.last < R.window) ? Math.min(chain.step + 1, R.maxStep) : 0;
      chain.last = now;
      const semi = R.scale[chain.step % R.scale.length] + 12 * Math.floor(chain.step / R.scale.length);
      pip('chain', R.base * Math.pow(2, semi / 12) * p, RECIPES.tick, g);
    },
    // 玩家受击:sine 下坠 + 低通噪声噗
    hit(p, g) {
      fire('hit', (slot, t) => {
        const R = RECIPES.playerHit;
        const o = ctx.createOscillator(); o.type = 'sine';
        o.frequency.setValueAtTime(R.freqFrom * p, t);
        o.frequency.exponentialRampToValueAtTime(Math.max(25, R.freqTo * p), t + R.dur);
        slot.gain.gain.setValueAtTime(0, t);
        slot.gain.gain.linearRampToValueAtTime(R.gain * g, t + R.attack);
        slot.gain.gain.exponentialRampToValueAtTime(0.001, t + R.dur);
        o.connect(slot.gain); o.start(t); o.stop(t + R.dur + 0.02);
        slot.src = o;
        const n = ctx.createBufferSource(); n.buffer = noiseWhite;
        const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = R.noiseLp;
        const ng = ctx.createGain();
        ng.gain.setValueAtTime(R.noiseGain * g, t);
        ng.gain.exponentialRampToValueAtTime(0.001, t + R.noiseDur);
        n.connect(lp).connect(ng).connect(slot.gain);
        n.start(t); n.stop(t + R.noiseDur + 0.02);
      });
    },
    // 升级琶音:大三和弦上行,音间经排程器预排
    levelup(p, g) {
      const R = RECIPES.levelUp, t0 = ctx.currentTime;
      R.intervals.forEach((semi, i) => {
        const t = t0 + 0.01 + i * R.noteGap;
        scheduler.at(t, () => {
          const slot = pool.acquire('levelup', t);
          if (!slot) return;
          const o = ctx.createOscillator(); o.type = R.type;
          o.frequency.value = R.root * Math.pow(2, semi / 12) * p;
          slot.gain.gain.setValueAtTime(0, t);
          slot.gain.gain.linearRampToValueAtTime(R.gain * g, t + R.attack);
          slot.gain.gain.exponentialRampToValueAtTime(0.001, t + R.dur);
          o.connect(slot.gain); o.start(t); o.stop(t + R.dur + 0.02);
          slot.src = o; slot.src.onended = () => pool.release(slot);
        });
      });
    },
    // 重燃 Shepard 式低频上扫:3 声部八度间隔同速上升,sin² 交叉淡化
    evolution(p, g) {
      fire('rekindle', (slot, t) => {
        const R = RECIPES.rekindle;
        const octaves = Math.log2(R.to / R.from);
        for (let v = 0; v < R.voices; v++) {
          const o = ctx.createOscillator(); o.type = R.type;
          const f0 = R.from * Math.pow(2, v) * p;
          o.frequency.setValueAtTime(f0, t);
          o.frequency.exponentialRampToValueAtTime(f0 * (R.to / R.from), t + R.dur);
          const gn = ctx.createGain();
          const curve = new Float32Array(R.curveSegs + 1);
          for (let i = 0; i <= R.curveSegs; i++) {
            const phi = Math.min(1, Math.max(0, (v + i / R.curveSegs * octaves) / (R.voices - 1 + octaves / 2)));
            curve[i] = Math.pow(Math.sin(Math.PI * phi), 2) * R.gain * g;
          }
          gn.gain.setValueCurveAtTime(curve, t, R.dur);
          o.connect(gn).connect(slot.gain);
          o.start(t); o.stop(t + R.dur + 0.02);
          if (v === 0) slot.src = o;
        }
        slot.gain.gain.value = 1;
      });
    },
    ui(p, g) {
      fire('ui', (slot, t) => {
        const R = RECIPES.uiBlip;
        const o = ctx.createOscillator(); o.type = R.type;
        o.frequency.value = R.freq * p;
        slot.gain.gain.setValueAtTime(0, t);
        slot.gain.gain.linearRampToValueAtTime(R.gain * g, t + R.attack);
        slot.gain.gain.exponentialRampToValueAtTime(0.001, t + R.dur);
        o.connect(slot.gain); o.start(t); o.stop(t + R.dur + 0.02);
        slot.src = o;
      });
    }
  };

  /* ---------------- 烛光环境底噪(棕噪循环 + LFO 呼吸) ---------------- */
  function startAmbience() {
    if (ambNodes || !ctx) return;
    const R = RECIPES.ambience;
    const src = ctx.createBufferSource(); src.buffer = noiseBrown; src.loop = true;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = R.lowpass;
    const g = ctx.createGain();
    g.gain.value = R.gain * (1 - R.lfoDepth);
    const lfo = ctx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = R.lfoFreq;
    const lfoG = ctx.createGain(); lfoG.gain.value = R.gain * R.lfoDepth;
    lfo.connect(lfoG).connect(g.gain);
    src.connect(lp).connect(g).connect(buses.music);
    src.start(); lfo.start();
    ambNodes = { src, lfo };
  }

  /* ---------------- 双层自适应配乐:bass 常驻 + 琶音 gain 门控 ---------------- */
  const music = {
    on: false, nextBass: 0, nextArp: 0, arpIdx: 0, gate: null, intensity: 0.2,
    start() {
      if (this.on || !ctx) return;
      this.on = true;
      this.gate = ctx.createGain(); this.gate.gain.value = 0;
      this.gate.connect(buses.music);
      const t = ctx.currentTime + 0.1;
      this.nextBass = t; this.nextArp = t;
      this.setIntensity(this.intensity);
    },
    stop() {
      this.on = false;
      if (this.gate) { this.gate.disconnect(); this.gate = null; }
    },
    tick(horizon) {
      if (!this.on) return;
      const R = RECIPES.music, beat = 60 / R.bpm;
      while (this.nextBass < horizon) {
        const t = this.nextBass, idx = Math.round(t / beat) % R.bassNotes.length;
        const o = ctx.createOscillator(); o.type = 'triangle';
        o.frequency.value = R.root * R.bassNotes[idx < 0 ? 0 : idx];
        const g = ctx.createGain();
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(R.bassGain, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.001, t + R.bassDur);
        o.connect(g).connect(buses.music);
        o.start(t); o.stop(t + R.bassDur + 0.05);
        this.nextBass += beat;
      }
      while (this.nextArp < horizon) {
        const t = this.nextArp;
        const semi = R.arpChord[this.arpIdx % R.arpChord.length];
        const o = ctx.createOscillator(); o.type = 'sine';
        o.frequency.value = R.root * R.arpOctave * Math.pow(2, semi / 12);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(R.arpGain, t + 0.008);
        g.gain.exponentialRampToValueAtTime(0.001, t + R.arpDur);
        o.connect(g).connect(this.gate);
        o.start(t); o.stop(t + R.arpDur + 0.05);
        this.nextArp += beat / 2; this.arpIdx++;
      }
    },
    setIntensity(v) {
      this.intensity = v;
      if (!this.gate || !ctx) return;
      const R = RECIPES.music;
      const target = v < R.gateFloor ? 0 : Math.min(1, (v - R.gateFloor) / (1 - R.gateFloor));
      this.gate.gain.setTargetAtTime(target, ctx.currentTime, R.gateSmooth);
    }
  };

  /* ---------------- 首次手势解锁(契约 §3:iOS 需 1-sample 静音) ---------------- */
  function unlock() {
    if (ctx) { ctx.resume(); return; }
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ctx.createDynamicsCompressor(); // 主链压缩,防削波
    comp.threshold.value = -18; comp.knee.value = 12; comp.ratio.value = 4;
    comp.attack.value = 0.003; comp.release.value = 0.25;
    comp.connect(ctx.destination);
    buses.master = ctx.createGain(); buses.master.gain.value = 0.9; buses.master.connect(comp);
    for (const name of ['sfx', 'music', 'ui']) {
      buses[name] = ctx.createGain();
      buses[name].gain.value = name === 'music' ? 0.85 : 1.0;
      buses[name].connect(buses.master);
    }
    makeNoiseBuffers();
    pool.init();
    ctx.resume();
    const one = ctx.createBuffer(1, 1, ctx.sampleRate); // 1-sample 静音
    const s = ctx.createBufferSource(); s.buffer = one; s.connect(ctx.destination); s.start();
    scheduler.start();
    startAmbience();
  }

  /* victory:配乐 2s 淡出后 stop(底噪同 bus 渐弱;stop 后恢复增益,烛台底噪仍在) */
  function fadeOutMusic(sec = 2) {
    if (!ctx || !buses.music) { music.stop(); return; }
    const g = buses.music.gain, t = ctx.currentTime, prev = g.value;
    g.cancelScheduledValues(t);
    g.setValueAtTime(prev, t);
    g.linearRampToValueAtTime(0.0001, t + sec);
    setTimeout(() => {
      music.stop();
      g.cancelScheduledValues(ctx.currentTime);
      g.setValueAtTime(prev, ctx.currentTime);
    }, sec * 1000 + 100);
  }

  /* play(name, opts):name 见契约 §3;opts {pitch, gain} 为倍率,默认 1 */
  /* ---------------- E6 熄灯台仪式低鸣(充能期 loop,音高随 6s 充能微爬升) ---------------- */
  let humNodes = null;
  function humStart() {
    if (!ctx || ctx.state !== 'running' || !buses.sfx || humNodes) return;
    const t0 = ctx.currentTime;
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(88, t0);
    o.frequency.linearRampToValueAtTime(101, t0 + 6);         // 6s 充能约 +2.3 半音微爬
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.05, t0 + 0.6);
    const lfo = ctx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 2.2;
    const lg = ctx.createGain(); lg.gain.value = 0.015;
    lfo.connect(lg).connect(g.gain);
    o.connect(g).connect(buses.sfx);
    o.start(t0); lfo.start(t0);
    humNodes = { o, g, lfo };
  }
  function humStop() {
    if (!humNodes || !ctx) return;
    const t0 = ctx.currentTime, h = humNodes; humNodes = null;
    try {
      h.g.gain.cancelScheduledValues(t0);
      h.g.gain.setTargetAtTime(0, t0, 0.12);
      h.o.stop(t0 + 0.5); h.lfo.stop(t0 + 0.5);
    } catch (_) {}
  }

  function play(name, o = {}) {
    if (!ctx || ctx.state !== 'running') return;
    const p = o.pitch ?? 1, g = o.gain ?? 1;
    switch (name) {
      case 'kill': synths.kill(p, g); break;
      case 'pickup': synths.pickup(p, g); break;
      case 'hit': synths.hit(p, g); break;
      case 'levelup':
        // 琶音不经 fire(),这里补事件级 20ms 去重(连升两级不叠音)
        if (lastFire.levelup !== undefined && ctx.currentTime - lastFire.levelup < DEDUP_WINDOW) break;
        lastFire.levelup = ctx.currentTime;
        synths.levelup(p, g); break;
      case 'evolution': synths.evolution(p, g); break;
      case 'ui': synths.ui(p, g); break;
      case 'burst': synths.bigBurst(p, g); break;
      case 'snufferfail': synths.snufferFail(p, g); break;
    }
  }

  /* 事件订阅(契约 §7,主要订阅方=audio);bus 经 opts 可选注入,同步派发 */
  if (opts.bus) {
    const b = opts.bus;
    b.on('kill', () => play('kill'));
    b.on('playerHit', () => play('hit'));      // juice 同事件也会 play('hit'),20ms 去重保证不双响
    b.on('xpPickup', () => play('pickup'));
    b.on('levelUp', () => play('levelup'));
    b.on('draftPick', () => play('ui'));
    b.on('uiClick', () => play('ui'));
    b.on('gameOver', () => music.stop());
    b.on('victory', () => fadeOutMusic(2));   // Phase 3:配乐 2s 淡出 stop
    /* 暂停 duck(审计①):music 总线压至 0.15(不静音,保氛围),解除暂停回用户设定值;
     * 暂停中用户拖过音乐滑杆(值≠0.15)则尊重新值不覆写。环境底噪(烛光棕噪)保留。 */
    let preDuckMusic = null;
    b.on('pauseToggle', ({ paused }) => {
      if (!buses.music) return;
      const g = buses.music.gain;
      if (paused) { if (preDuckMusic == null) { preDuckMusic = g.value; g.value = 0.15; } }
      else if (preDuckMusic != null) { if (g.value === 0.15) g.value = preDuckMusic; preDuckMusic = null; }
    });
    b.on('ignite', () => { unlock(); music.start(); }); // 点击【点燃】的手势上下文内同步执行
    /* 熄灯台(E6/E7):仪式低鸣充能期 loop;点亮=evolution 降阶版;失败=「黯灭」下沉短音 */

// ---------------------------------------------------------------------------
function createUI({ bus, Platform }) {
  const root = document.createElement('div');
  root.className = 'ember-ui';
  const style = document.createElement('style');
  style.textContent = CSS;
  root.appendChild(style);
  root.insertAdjacentHTML('beforeend', `
    <div class="hud">
      <div class="hud-tl">
        <div class="hud-level">LV <b>1</b></div>
        <div class="bar bar-hp"><i class="ghost"></i><i class="fill"></i><span class="hp-text"></span></div>
      </div>
      <div class="hud-tr">
        <div class="hud-time">10:00</div>
        <div class="hud-kills">击杀 <b>0</b></div>
      </div>
      <div class="hud-bl"></div>
      <div class="bar bar-xp"><i class="fill"></i></div>
      <div class="timeline"><div class="tl-track"></div><div class="tl-marks"></div><div class="tl-cur" style="left:0%"></div></div>
      <div class="bosshp"><div class="bname"></div><div class="bar"><i class="fill"></i></div></div>
    </div>

    <div class="screen screen-title">
      <div class="title-mark">
        <div class="title-name">烛夜 <span style="font-size:.62em;letter-spacing:.18em;">Embernight</span></div>
        <div class="title-sub">长夜无昼。你是最后一支烛火。</div>
      </div>
      <button class="btn-ember" type="button"><span>点 燃</span></button>
      <div class="title-hint">WASD / 触屏移动 · 火焰自己战斗</div>
    </div>

    <div class="screen screen-char">
      <div class="char-title">择 烛</div>
      <div class="char-row"></div>
    </div>

    <div class="screen screen-draft">
      <div class="draft-title">抉 择</div>
      <div class="draft-row"></div>
    </div>

    <div class="screen screen-settle"></div>
    <div class="screen screen-victory"></div>
    <div class="screen screen-hall"></div>

    <div class="screen screen-settings"><div class="set-panel"></div></div>

    <div class="screen screen-pause"></div>`);
  document.body.appendChild(root);

  // ---- 句柄 ----
  const $ = (sel) => root.querySelector(sel);
  const hud = $('.hud');
  const el = {
    title: $('.screen-title'), char: $('.screen-char'), draft: $('.screen-draft'),
    settle: $('.screen-settle'), victory: $('.screen-victory'), hall: $('.screen-hall'),
    settings: $('.screen-settings'), pause: $('.screen-pause'),
    level: $('.hud-level'), levelNum: $('.hud-level b'),
    hpGhost: $('.bar-hp .ghost'), hpFill: $('.bar-hp .fill'), hpText: $('.hp-text'),
    time: $('.hud-time'), kills: $('.hud-kills b'), xpFill: $('.bar-xp .fill'),
    wicons: $('.hud-bl'), draftRow: $('.draft-row'), charRow: $('.char-row'),
    tlMarks: $('.tl-marks'), tlCur: $('.tl-cur'),
    boss: $('.bosshp'), bossName: $('.bosshp .bname'), bossFill: $('.bosshp .fill'),
  };
  const show = (node) => node.classList.add('on');
  const hide = (node) => node.classList.remove('on');
  const hideScreens = () => [el.title, el.char, el.draft, el.settle, el.victory, el.hall, el.settings].forEach(hide);

  // ======================================================================
  // 标题页(v3:背景透明,让位给演示波;opts.demo 由集成者保证)
  // ======================================================================
  function showTitle(onIgnite, opts) {
    el.title.querySelector('.btn-ember').onclick = () => {
      bus.emit('uiClick', {});
      hide(el.title);
      if (onIgnite) onIgnite();
    };
    show(el.title);
  }

  // ======================================================================
  // 角色卡(契约 v3 §3)
  // chars: [{id,name,rule,cardDesc,unlocked?,riddle?|unlock?}]
  // ======================================================================
  function showCharSelect(chars, onPick) {
    el.charRow.innerHTML = (chars || []).map((c, i) => {
      const cc = charColor(c.id);
      const unlocked = c.unlocked !== false;
      const riddle = c.riddle || (c.unlock && c.unlock.riddle) || '???';
      return `<div class="char-card${unlocked ? '' : ' locked'}" data-i="${i}"
        style="--cc:${cc}; animation-delay:${i * 110}ms">
        ${candleSVG(cc, !unlocked)}
        <div class="cname">${c.name || ''}</div>
        <div class="crule">${unlocked ? (c.rule || '') : '未 燃 之 谜'}</div>
        ${unlocked
          ? `<div class="cdesc">${c.cardDesc || ''}</div>`
          : `<div class="riddle">${riddle}</div><div class="locktag">剪 影 锁 定</div>`}
      </div>`;
    }).join('');
    el.charRow.querySelectorAll('.char-card:not(.locked)').forEach((cardEl) => {
      cardEl.addEventListener('click', () => {
        bus.emit('uiClick', {});
        const c = chars[Number(cardEl.dataset.i)];
        hide(el.char);
        if (onPick) onPick(c);
      });
    });
    show(el.char);
  }

  // ======================================================================
  // HUD
  // ======================================================================
  function showHUD() {
    hideScreens();
    show(hud);
  }
  const cache = { hp: -1, maxHp: -1, xp: -1, xpNext: -1, level: -1, kills: -1, sec: -1, icons: '' };
  function updateHUD(s) {
    if (!s) return;
    const maxHp = s.maxHp || 1;
    if (s.hp !== cache.hp || s.maxHp !== cache.maxHp) {
      const r = Math.max(0, Math.min(1, s.hp / maxHp));
      if (s.hp > cache.hp && cache.hp >= 0) {
        el.hpGhost.classList.add('snap');
        el.hpGhost.style.transform = `scaleX(${r})`;
        void el.hpGhost.offsetWidth;
        el.hpGhost.classList.remove('snap');
      } else {
        el.hpGhost.style.transform = `scaleX(${r})`;
      }
      el.hpFill.style.transform = `scaleX(${r})`;
      el.hpText.textContent = `${Math.ceil(s.hp)} / ${maxHp}`;
      cache.hp = s.hp; cache.maxHp = s.maxHp;
    }
    if (s.xp !== cache.xp || s.xpNext !== cache.xpNext) {
      el.xpFill.style.transform = `scaleX(${Math.max(0, Math.min(1, s.xp / (s.xpNext || 1)))})`;
      cache.xp = s.xp; cache.xpNext = s.xpNext;
    }
    if (s.level !== cache.level) { el.levelNum.textContent = s.level; cache.level = s.level; }
    if (s.kills !== cache.kills) { el.kills.textContent = s.kills; cache.kills = s.kills; }
    const sec = Math.floor(s.timeLeft || 0);
    if (sec !== cache.sec) { el.time.textContent = fmtTime(sec); cache.sec = sec; }
    const icons = JSON.stringify(s.weaponIcons || []);
    if (icons !== cache.icons) {
      cache.icons = icons;
      // B2:构筑图标 + 等级角标(·/II/III,evo 金框);data-icon 供觉醒演出匹配
      el.wicons.innerHTML = (s.weaponIcons || []).map((ic) => {
        const pip = ['·', 'II', 'III'][Math.min(3, Math.max(1, ic.lv || 1)) - 1];
        return `<div class="wicon${ic.evo ? ' evo' : ''}" data-icon="${ic.icon}">${ic.icon || '◆'}<i class="pip">${pip}</i></div>`;
      }).join('');
    }
  }

  // ======================================================================
  // 烛泪刻度尺(契约 v3 §3)
  // ======================================================================
  let tlMarkKey = null;
  function updateTimeline(t01, markers) {
    const key = markers ? JSON.stringify(markers.map((m) => [m.t01, m.icon, m.kind])) : '';
    if (key !== tlMarkKey) {
      tlMarkKey = key;
      el.tlMarks.innerHTML = (markers || []).map((m) =>
        `<div class="tl-mark" style="left:${Math.max(0, Math.min(1, m.t01)) * 100}%; color:${MARK_COLOR[m.kind] || PAL.INK}">${m.icon || '·'}</div>`
      ).join('');
    }
    el.tlCur.style.left = `${Math.max(0, Math.min(1, t01 || 0)) * 100}%`;
  }

  // ======================================================================
  // Boss 血条(契约 v3 §3)
  // ======================================================================
  function showBossHp(name, frac) {
    el.bossName.textContent = name || '';
    el.bossFill.style.transform = `scaleX(${Math.max(0, Math.min(1, frac == null ? 1 : frac))})`;
    el.boss.classList.add('on');
  }
  function hideBossHp() { el.boss.classList.remove('on'); }

  // ======================================================================
  // 三选一(保留 v1)
  // ======================================================================
  let draftLock = false;
  function openDraft(cards, onPick) {
    draftLock = false;
    el.draftRow.innerHTML = (cards || []).map((c, i) => `
      <div class="card-slot" style="animation-delay:${i * 90}ms">
        <div class="card" data-i="${i}" style="--role:${roleColor(c.role)}">
          <div class="icon">${c.icon || '◆'}</div>
          <div class="name">${c.name || ''}</div>
          <div class="desc">${c.desc || ''}</div>
        </div>
      </div>`).join('');
    el.draftRow.querySelectorAll('.card').forEach((cardEl) => {
      cardEl.addEventListener('click', () => {
        if (draftLock) return;
        draftLock = true;
        bus.emit('uiClick', {});
        const card = cards[Number(cardEl.dataset.i)];
        cardEl.classList.add('picked');
        el.draftRow.querySelectorAll('.card-slot').forEach((s) => {
          if (!s.contains(cardEl)) s.classList.add('dim');
        });
        setTimeout(() => {
          closeDraft();
          if (onPick) onPick(card);
          else bus.emit('draftPick', { card });
        }, 240);
      });
    });
    show(el.draft);
  }
  function closeDraft() {
    hide(el.draft);
    el.draftRow.innerHTML = '';
  }

  // ======================================================================
  // 结算编排(死亡帧=奖励帧,契约 v3 §3)
  // r = {stats, coresEarned, line, dawnGap}; actions.toHall()
  // 序列:烛芯凝聚(+N)→星图节点预亮剪影→旁白一行→距黎明 XX 秒→【前往烛台】
  // ======================================================================
  function showSettlement(r, actions) {
    const st = (r && r.stats) || {};
    const toHall = (actions && actions.toHall) || (() => {});
    const steps = [];
    let html = `<div class="settle-line">烛灭于子夜。</div>
      <div class="over-stats" style="margin-top:22px">存活 <b>${fmtTime(st.time)}</b> · 击杀 <b>${st.kills ?? 0}</b> · 等级 <b>${st.level ?? 1}</b></div>`;
    if (r && r.coresEarned != null) {
      html += `<div class="step settle-core" data-step>${coreSVG(22)}<span>烛芯 +${r.coresEarned}</span></div>`;
    }
    // 星图预亮剪影:取未燃节点前 5 做剪影,前 2 个"预高亮"(S-2;纯呈现,选择逻辑归 meta)
    const litSet = (r && r.litSet) || {};
    const preview = NODES.filter(n => !litSet[n.id]).slice(0, 5);
    if (r && r.coresEarned != null && preview.length) {
      html += `<div class="step" data-step><div class="settle-nodes">${
        preview.map((n, i) => `<div class="sn${i < 2 ? ' pre' : ''}">${n.icon}</div>`).join('')
      }</div><div class="settle-cap">星图上,有节点微微发亮</div></div>`;
    }
    // E3:熄灯台结算行(N=0 不显;+M 口径同 meta.recordRun:+2/座、双亮再 +2)
    const snN = st.snufferLit | 0;
    if (snN > 0) {
      html += `<div class="step settle-core" data-step>🕯<span>熄灯台 ×${snN},+${snN * 2 + (snN === 2 ? 2 : 0)} 烛芯</span></div>`;
    }
    if (r && r.line) html += `<div class="step settle-voice" data-step>${r.line}</div>`;
    if (r && r.dawnGap != null) html += `<div class="step settle-gap" data-step>距黎明 ${Math.max(0, Math.ceil(r.dawnGap))} 秒</div>`;
    html += `<div class="step" data-step><button class="btn-ember small" type="button"><span>前 往 烛 台</span></button></div>`;
    el.settle.innerHTML = html;
    el.settle.querySelector('.btn-ember').onclick = () => { bus.emit('uiClick', {}); hide(el.settle); toHall(); };
    show(el.settle);
    runSteps(el.settle);
  }

  // 分步揭示;点击界面可跳过直接全部点亮
  function runSteps(screenEl) {
    const steps = [...screenEl.querySelectorAll('[data-step]')];
    let i = 0, timer = null;
    const revealAll = () => { steps.forEach((s) => s.classList.add('on')); screenEl.querySelector('.settle-core')?.classList.add('pop'); };
    if (REDUCED) { revealAll(); return; }
    const tick = () => {
      if (i >= steps.length) return;
      const s = steps[i++];
      s.classList.add('on');
      if (s.classList.contains('settle-core')) s.classList.add('pop');
      timer = setTimeout(tick, 550);
    };
    timer = setTimeout(tick, 350);
    screenEl.addEventListener('click', function skip() {
      clearTimeout(timer);
      revealAll();
      screenEl.removeEventListener('click', skip);
    });
  }

  // ======================================================================
  // 胜利(契约 v3 §3):「黎明,由你点亮。」+ stats + coresEarned →【前往烛台】
  // ======================================================================
  function showVictory(r, actions) {
    const st = (r && r.stats) || {};
    const toHall = (actions && actions.toHall) || (() => {});
    el.victory.innerHTML = `
      <div class="victory-line">黎明,由你点亮。</div>
      <div class="over-stats" style="margin-top:26px">存活 <b>${fmtTime(st.time)}</b> · 击杀 <b>${st.kills ?? 0}</b> · 等级 <b>${st.level ?? 1}</b></div>
      ${r && r.coresEarned != null ? `<div class="step settle-core on pop" style="margin-top:24px">${coreSVG(22)}<span>烛芯 +${r.coresEarned}</span></div>` : ''}
      ${(st.snufferLit | 0) > 0 ? `<div class="step settle-core on" style="margin-top:10px">🕯<span>熄灯台 ×${st.snufferLit | 0},+${(st.snufferLit | 0) * 2 + ((st.snufferLit | 0) === 2 ? 2 : 0)} 烛芯</span></div>` : ''}
      ${r && r.line ? `<div class="settle-voice" style="margin-top:20px">${r.line}</div>` : ''}
      <button class="btn-ember small" type="button"><span>前 往 烛 台</span></button>`;
    el.victory.querySelector('.btn-ember').onclick = () => { bus.emit('uiClick', {}); hide(el.victory); toHall(); };
    show(el.victory);
  }

  // v1 兼容:旧 showGameOver 内部转发 showSettlement(契约 v3 §3)
  function showGameOver(stats) {
    showSettlement({ stats }, { toHall: () => location.reload() });
  }

  // ======================================================================
  // 烛台大厅(契约 v3 §3):SVG 星图 + 烛芯余额 + 呢喃咒语 + 夜更深四档 + 启程 + 设置
  // actions: {depart(), openSettings(), onCode(reward), onLongNight(v)}
  // TODO-CONTRACT:actions 各键名为本实现约定,契约未钉死,建议补记。
  // ======================================================================
  let hallSel = null;      // 当前选中节点
  let hallFresh = null;    // 刚点燃节点(连线点火动画用)
  function showHall(meta, actions) {
    hallSel = null; hallFresh = null;
    renderHall(meta, actions || {});
    show(el.hall);
  }
  function renderHall(meta, acts) {
    const d = meta.data || {};
    const litSet = d.nodes || {};
    const tierCur = d.longNight === true ? 1 : (d.longNight | 0) || 0;   // 夜更深档位 0–3:true≡1(旧存档)
    // 节点三态:已燃 lit / 可点 avail / 锁定 locked
    const stateOf = (n) => (litSet[n.id] ? 'lit' : (meta.canIgnite && meta.canIgnite(n.id) ? 'avail' : 'locked'));
    // 连线(req → node)
    const edges = [];
    for (const n of NODES) for (const req of (n.req || [])) {
      const a = STAR_LAYOUT[req], b = STAR_LAYOUT[n.id];
      if (a && b) edges.push({ from: req, to: n.id, x1: a[0], y1: a[1], x2: b[0], y2: b[1], lit: !!litSet[req] && !!litSet[n.id] });
    }
    const nodes = NODES.map((n) => {
      const [x, y] = STAR_LAYOUT[n.id] || [320, 230];
      const st = stateOf(n);
      return `<g class="node ${st}${hallSel === n.id ? ' sel' : ''}" data-id="${n.id}" transform="translate(${x},${y})">
        <circle class="ring" r="15"/><text y="1">${n.icon}</text>
      </g>`;
    }).join('');
    el.hall.innerHTML = `
      <div class="hall-head">
        <div class="hall-title">烛 台</div>
        <div class="hall-cores">${coreSVG(15)}<span>${d.cores ?? 0}</span></div>
        ${(d.snufferTotal | 0) > 0 ? `<div class="hall-snuffer" style="opacity:.55;font-size:12px;letter-spacing:2px">熄灯台累计 ×${d.snufferTotal | 0}</div>` : ''}
      </div>
      <svg class="starmap" viewBox="0 0 640 460">
        ${edges.map((e) => `<line class="edge${e.lit ? ' lit' : ''}" data-to="${e.to}" x1="${e.x1}" y1="${e.y1}" x2="${e.x2}" y2="${e.y2}"/>`).join('')}
        ${nodes}
      </svg>
      <div class="hall-detail">点按星图节点查看;烛火相连,方可点燃。</div>
      <div class="hall-row">
        <input class="whisper" type="text" maxlength="24" placeholder="呢喃…" aria-label="呢喃咒语">
        <button class="btn-plain whisper-btn" type="button">低 语</button>
        <div class="whisper-fb"></div>
      </div>
      ${(d.wins > 0) ? `<div class="longnight hall-row ln-tiers"><span>夜</span>${[['熄', '×1.0'], ['长夜', '×1.5'], ['深夜', '×2.0'], ['永夜', '×2.5']].map((t, i) => `<button class="ln-tier${tierCur === i ? ' on' : ''}" data-tier="${i}" type="button">${t[0]}<span class="ln-tag">${t[1]}</span></button>`).join('')}<span class="ln-tag">敌量·烛芯同倍</span></div>` : ''}
      <div class="hall-foot">
        <button class="btn-ember small hall-depart" type="button"><span>启 程</span></button>

  animation:jpartFly .5s ease-out forwards; }
@keyframes jpartFly{
  0%{ transform:translate(-50%,-50%) scale(1); opacity:1; }
  100%{ transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2); opacity:0; } }
.jbeam{ position:fixed; left:50%; top:50%; width:90px; height:130vh; mix-blend-mode:screen; opacity:0;
  background:linear-gradient(to bottom,transparent 0%,${PAL.EMBER_MID} 20%,${PAL.EMBER_CORE} 38%,${PAL.HERO_HI} 50%,${PAL.EMBER_CORE} 60%,transparent 72%);   /* 最亮在角色(屏中),上尾长下尾短(店主 01:50 观感) */
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 32%,#000 68%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 32%,#000 68%,transparent);   /* 左右羽化:去"规则长方形"硬边(店主 01:31 观感) */
  animation:jbeamUp ${P.levelUp.beamSec}s ease-out forwards; will-change:transform,opacity; }
@keyframes jbeamUp{
  0%{ transform:translate(-50%,-50%) scaleY(0); opacity:0; }
  25%{ transform:translate(-50%,-50%) scaleY(1); opacity:.9; }

  animation:jstreakGo ${P.draftPick.streakSec}s ease-in forwards; will-change:transform,opacity; }
@keyframes jstreakGo{
  /* B4 去歧义:明确飞向构筑栏(左下),不再像"射出一支箭" */

  100%{ transform:translate(calc(-50% - 34vw),calc(-50% + 36vh)) rotate(-6deg) scale(.45); opacity:0; } }

  transition:opacity .25s; }
.chain-layer.out{ opacity:0; }
