<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- V1.1 终稿（responsive-spec §7.1）：新增 maximum-scale=1.0 与 viewport-fit=cover，
         canvas 铺进刘海/Home 指示条区，safe-area 由 ui.ts CSS 令牌接管 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>地牢幸存者</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0b12;
        overscroll-behavior: none; /* 禁下拉刷新/橡皮筋（responsive-spec §7.2） */
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh; /* 旧浏览器回退行在前 */
        height: 100dvh; /* 移动动态视口高（终值） */
        display: block;
        touch-action: none;
        image-rendering: pixelated;
      }
      @media (display-mode: standalone) {
        /* PWA 冷启动 dvh 集体撒谎的修正（responsive-spec §7.2） */
        #game {
          height: 100lvh;
        }
      }
      /* UI overlay：UIDev_01 的 DOM HUD 容器。默认不拦截指针，可交互元素需自行开启 pointer-events */
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
        user-select: none;
        font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
        color: #e8e6df;
      }
      /* 首帧遮罩（responsive-spec §2.4：safe-area env() 冷启动返回 0 的对策；
         main.ts 在 loop.start() 后首个 rAF 回调内移除） */
      #boot-mask {
        position: fixed;
        inset: 0;
        z-index: 90;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0b12;
        color: #9a8b76;
        font-size: 14px;
        letter-spacing: 3px;
        font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
      }
      /* 竖屏提示条（TouchUX_01：原「请旋转设备」全屏阻挡层降级——非阻挡、
         pointer-events:none 不拦截触摸、顶部 toast 式、3s 自隐、每会话一次；
         显隐由 main.ts 按 media query + sessionStorage 驱动） */
      #portrait-hint {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        z-index: 95;
        display: none;
        align-items: center;
        gap: 8px;
        padding: 8px 18px;
        background: rgba(24, 19, 16, 0.85);
        border: 1px solid #6b5847;
        border-radius: 999px;
        color: #d8cfc0;
        font-size: 13px;
        letter-spacing: 2px;
        font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.4s ease;
      }
      #portrait-hint.show {
        display: flex;
        opacity: 1;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-BuWEFIr4.js"></script>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <div id="boot-mask">深渊开启中……</div>
    <div id="portrait-hint">横屏体验更佳 · 竖屏也可畅玩</div>
  </body>
</html>
